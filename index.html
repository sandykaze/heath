<style>
/* 🎨 极具活力与治愈感的多巴胺糖果配色体系 */
:root {
  /* 基础背景：渐变亮黄/柠檬糖暖色 */
  --bg-gradient: linear-gradient(135deg, #FFF0F5 0%, #FFFAEB 50%, #E8F0FE 100%);
  --card-bg: rgba(255, 255, 255, 0.60);
  --card-border: rgba(255, 255, 255, 0.32);

  /* 毛玻璃质感 */
  --glass-bg: rgba(255, 255, 255, 0.5);
  --glass-bg-strong: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(255, 255, 255, 0.32);
  --glass-shadow: 0 8px 32px rgba(120, 90, 130, 0.10);
  
  /* 多巴胺核心高亮配色 */
  --pop-pink: #FF6B9B;      /* 主视觉/活力粉 */
  --pop-purple: #9D4EDD;    /* 薰衣草紫/排卵期 */
  --pop-yellow: #FFD166;    /* 明黄/卡片强调/今日 */
  --pop-green: #06D6A0;     /* 罗勒绿/体重下降 */
  --pop-orange: #FF8811;    /* 落日橙/体重上升 */
  --pop-poop: #FF9E7D;      /* 排便主题：蜜桃色 */
  --pop-blue: #118AB2;      /* 薄荷蓝/按钮 hover */

  /* 文字颜色：高对比度、不闷沉的浓郁墨紫与明亮字调 */
  --text-main: #3D2B42;     
  --text-muted: #8E7A93;
  --text-light: #BCA3C3;

  /* 周期四阶段（姨妈期/卵泡期/排卵期/黄体期）柔和高亮底色，整体调淡，避免日历太花 */
  --rose: var(--pop-pink);
  --rose-bg: rgba(255, 107, 155, 0.14);
  --purple: var(--pop-purple);
  --purple-bg: rgba(157, 78, 221, 0.12);
  --blue: var(--pop-blue);
  --blue-bg: rgba(17, 138, 178, 0.13);
  --amber: #D4A017;
  --amber-bg: rgba(255, 209, 102, 0.22);
  --poop-gray: #D4A373;

  /* 数据对比色：日历格子上"↑ / ↓"箭头的颜色统一为淡灰，
     让增减不再因为颜色（绿 / 橙 / 棕）而显得花哨，方向本身已经能说明增减 */
  --diff-down: #A89B91;
  --diff-up: #A89B91;
  --diff-zero: #A89B91;

  /* 高级偏粉色调，用于生理期预测等需要区别于亮粉的强调色 */
  --rose-mauve: #B8557A;

  /* 运动主题色：左淡右深的薄荷绿渐变 */
  --pop-exercise-1: #9BD9A1;   /* 左侧：淡一点的嫩薄荷 */
  --pop-exercise-2: #62C6A5;   /* 右侧：较深的尤加利薄荷，作为运动主色 */
  --exercise: var(--pop-exercise-2);
  --exercise-bg: rgba(98, 198, 165, 0.18);

  /* 多巴胺糖果感阴影与大圆角 */
  --shadow-soft: 0 16px 40px rgba(120, 90, 130, 0.10);
  --shadow-hover: 0 10px 26px rgba(120, 90, 130, 0.12);
  --radius-lg: 28px;
  --radius-md: 20px;
  --radius-sm: 12px;

  /* 统一字体：西文用 Fredoka 撑起圆润气质，中文交给 Noto Sans SC 保持大气整洁，两者字重呼应 */
  /* 统一字体：中文用 Noto Sans SC 保证清爽好读；数字单独换成 DM Sans——
     几何感更强、字形修长挺拔，质感比圆润的 Poppins 更高级冷静，混入的中文（如"天"）
     仍自动落回 Noto Sans SC，不会出现整段文字字体不统一的问题 */
  --font-main: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-num: 'DM Sans', 'Noto Sans SC', sans-serif;
  --font-brand: 'Fredoka', 'Noto Sans SC', sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{
  margin:0;
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-main);
  font-family: var(--font-main);
  letter-spacing: .02em;
  min-height: 100vh;
}
.wrap{max-width:580px;margin:auto;padding:24px 18px 80px}

/* Header 页头品牌区域：左侧 Logo，右侧集成账号状态 */
.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:12px 4px 24px;
}
.brand-left{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}
.brand-mark{
  flex-shrink:0;
  width:48px;height:48px;border-radius:18px;
  display:grid;place-items:center;
  background: linear-gradient(135deg, #FF6B9B 0%, #FF8811 100%);
  color:#FFFFFF;
  font-size:24px;font-weight:700;
  font-family:var(--font-brand);
  box-shadow:0 8px 18px rgba(255, 107, 155, 0.4);
  transform: rotate(-3deg);
}
h1{font-size:26px;line-height:1;margin:0;font-weight:700;color:var(--text-main);letter-spacing:0.02em;font-family:var(--font-brand);}
.sub{color:var(--pop-pink);font-size:11px;letter-spacing:.18em;margin:6px 0 0;font-weight:600;font-family:var(--font-brand);}

/* Account 账号信息：集成在页头右上角的小组件 */
.account-mini{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:5px;
  flex-shrink:0;
}
.account-status{font-size:10.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px;font-weight:600;}
.account-status.logged{color:var(--pop-pink);}
.account-btn{
  border:0;
  background: linear-gradient(135deg, #FF6B9B, #9D4EDD);
  color:#fff;
  border-radius:10px;padding:5px 12px;
  font-size:11px;font-weight:700;cursor:pointer;
  white-space:nowrap;
  box-shadow: 0 3px 10px rgba(255, 107, 155, 0.28);
  transition:all .2s ease;
}
.account-btn:hover{transform: scale(1.05); box-shadow: 0 5px 14px rgba(157, 78, 221, 0.35);}

/* 今日提示：logo/slogan 与菜单栏之间，紧凑两行显示，前置 💡 小灯泡 */
.today-tip{
  margin:0 16px 8px;
  padding:2px 4px;
}
.today-tip-inner{
  display:flex;
  align-items:flex-start;
  gap:5px;
  font-size:10.5px;
  font-weight:600;
  color:var(--text-muted);
  line-height:1.45;
}
.today-tip-bulb{
  flex-shrink:0;
  font-size:11px;
  line-height:1.45;
}
.today-tip-text{
  flex:1;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* Top Navigation Tabs 顶部分段导航 */
.nav-tabs{
  display:flex;
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  padding:4px;
  border-radius:var(--radius-lg);
  margin-bottom:18px;
  gap:5px;
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
}
.tab-btn{
  flex:1;
  border:0;
  background:transparent;
  padding:9px 0;
  font-size:13px;
  font-weight:700;
  color:var(--text-muted);
  border-radius:var(--radius-md);
  cursor:pointer;
  transition:all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
 .tab-btn.active{
  background: var(--pop-pink);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: #FFFFFF;
  box-shadow: 0 6px 18px rgba(255, 107, 155, 0.22);
  transform: scale(1.02);
}
.tab-btn.active.tab-record{
  background: linear-gradient(135deg, #FF6B9B, #9D4EDD);
  box-shadow: 0 6px 18px rgba(157, 78, 221, 0.28);
}
.tab-btn.active.tab-poop{
  background: linear-gradient(135deg, #FFB89C, #FF7A54);
  box-shadow: 0 6px 18px rgba(255, 122, 84, 0.32);
}
.tab-btn.active.tab-weight{
  background: linear-gradient(135deg, #FFB3C6, #FF6B9B);
  box-shadow: 0 6px 18px rgba(255, 107, 155, 0.28);
}
.tab-btn.active.tab-cycle{
  background: linear-gradient(135deg, #FF6B9B 0%, #FF8811 100%);
  box-shadow: 0 6px 18px rgba(255, 136, 17, 0.28);
}
.tab-btn.active.tab-exercise{
  background: linear-gradient(135deg, #9BD9A1, #62C6A5);
  box-shadow: 0 6px 18px rgba(98, 198, 165, 0.30);
}
.tab-btn.active.tab-trend{
  background: linear-gradient(135deg, #FFB3C6, #FF6B9B);
  box-shadow: 0 6px 18px rgba(255, 107, 155, 0.28);
}

/* 趋势 Tab：今日汇总卡片 */
.trend-summary-row1{
  display:flex;
  align-items:center;
  gap:8px;
  padding-bottom:7px;
  margin-bottom:5px;
  border-bottom:1px dashed var(--glass-border);
}
.trend-summary-date{
  font-size:15px;
  font-weight:800;
  color:var(--text-main);
}
.trend-metric-row{
  display:flex;
  align-items:flex-start;
  gap:8px;
  padding:5px 2px;
  cursor:pointer;
  border-radius:var(--radius-md);
  transition:background .2s;
}
.trend-metric-row:not(:last-child){
  border-bottom:1px solid var(--glass-border);
}
.trend-metric-row:active{background:rgba(0,0,0,0.03);}
.trend-metric-row input[type="radio"]{
  appearance:none;
  -webkit-appearance:none;
  width:15px;
  height:15px;
  flex:0 0 15px;
  margin-top:2px;
  border-radius:50%;
  border:2px solid rgba(0,0,0,0.28);
  background:#fff;
  position:relative;
  cursor:pointer;
}
.trend-metric-row input[type="radio"]:checked{
  border-color:var(--pop-pink);
}
.trend-metric-row input[type="radio"]:checked::after{
  content:"";
  position:absolute;
  top:50%; left:50%;
  width:8px; height:8px;
  border-radius:50%;
  background:var(--pop-pink);
  transform:translate(-50%,-50%);
}
/* 各项目对应各自主题色：体重=粉，排便=蜜桃，运动=薄荷绿 */
.trend-metric-row input[type="radio"][value="weight"]:checked{border-color:var(--pop-pink);}
.trend-metric-row input[type="radio"][value="weight"]:checked::after{background:var(--pop-pink);}
.trend-metric-row input[type="radio"][value="poop"]:checked{border-color:var(--pop-poop);}
.trend-metric-row input[type="radio"][value="poop"]:checked::after{background:var(--pop-poop);}
.trend-metric-row input[type="radio"][value="exercise"]:checked{border-color:var(--pop-exercise-2);}
.trend-metric-row input[type="radio"][value="exercise"]:checked::after{background:var(--pop-exercise-2);}
.trend-metric-body{flex:1; min-width:0;}
.trend-metric-label{
  font-size:10.5px;
  font-weight:700;
  color:var(--text-muted);
  margin-bottom:1px;
  display:block;
  transition:color .2s ease;
}
.trend-metric-val{
  font-size:12.5px;
  font-weight:700;
  color:var(--text-main);
  line-height:1.35;
  word-break:break-all;
  transition:color .2s ease;
}
.trend-metric-val.muted{color:var(--text-muted); font-weight:500;}
.trend-metric-val .diff-val{font-size:11px; font-weight:700; margin-left:4px;}

/* 选中某一项（体重/排便/运动）后，整行呈现主题色高亮框，且文字同步变为主题色 */
.trend-metric-row{
  transition:background .2s ease;
}
.trend-metric-row:has(input:checked){
  border-radius:var(--radius-sm);
  padding-left:8px;
  padding-right:8px;
}
.trend-metric-row:has(input[value="weight"]:checked){
  background:var(--rose-bg);
}
.trend-metric-row:has(input[value="weight"]:checked) .trend-metric-label,
.trend-metric-row:has(input[value="weight"]:checked) .trend-metric-val{
  color:var(--pop-pink);
}
.trend-metric-row:has(input[value="poop"]:checked){
  background:rgba(255, 158, 125, 0.18);
}
.trend-metric-row:has(input[value="poop"]:checked) .trend-metric-label,
.trend-metric-row:has(input[value="poop"]:checked) .trend-metric-val{
  color:#C15A32;
}
.trend-metric-row:has(input[value="exercise"]:checked){
  background:var(--exercise-bg);
}
.trend-metric-row:has(input[value="exercise"]:checked) .trend-metric-label,
.trend-metric-row:has(input[value="exercise"]:checked) .trend-metric-val{
  color:#1F8368;
}
.trend-metric-row:has(input:checked) .trend-metric-val.muted{
  color:inherit;
  opacity:.85;
}
.trend-chart-section{
  display:none;
  margin-top:8px;
  padding-top:8px;
  border-top:1px dashed var(--glass-border);
}
.trend-chart-section.active{display:block;}

/* Card Style 卡片全构架 */
.card{
  background: var(--card-bg);
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: 24px 16px;
  box-shadow: var(--shadow-soft);
}
.tab-content{display:none}
.tab-content.active{display:block}

/* Toolbar & Legend 日历顶部工具栏 */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.toolbar button{
  width:38px;height:38px;background:var(--glass-bg);color:var(--pop-pink);
  backdrop-filter: blur(12px);-webkit-backdrop-filter: blur(12px);
  border:1px solid var(--glass-border);border-radius:50%;font-size:18px;font-weight:bold;
  cursor:pointer;display:grid;place-items:center;
  box-shadow:0 4px 10px rgba(120, 90, 130, 0.12);
  transition:all .2s ease;
}
.toolbar button:hover{background:var(--pop-pink);color:#FFF;transform:scale(1.1);}
.month{font-weight:700;font-size:20px;color:var(--text-main);letter-spacing:0.01em;font-family:var(--font-num);font-variant-numeric: tabular-nums;}

.legend{display:flex;gap:16px;color:var(--text-muted);font-size:12px;margin-bottom:20px;justify-content:center;font-weight:600;flex-wrap:wrap;}
.legend label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;transition:opacity .2s ease;}
.legend label:has(input:not(:checked)){opacity:.45;}
/* 自定义 checkbox：用真实 input（透明、铺满）负责交互，视觉盒子是独立的兄弟 span，
   靠 flex 精确居中画勾，彻底摆脱原生 input 伪元素在不同浏览器里定位不一致导致的勾偏移问题 */
.legend .chk{
  position:relative;
  width:15px;height:15px;
  flex-shrink:0;
  display:inline-flex;
}
.legend .chk input[type="checkbox"]{
  position:absolute;
  inset:0;
  width:100%;height:100%;
  margin:0;
  padding:0;
  opacity:0;
  cursor:pointer;
  -webkit-appearance:none;appearance:none;
}
.legend .chk-box{
  position:absolute;
  inset:0;
  box-sizing:border-box;
  border:2px solid #E8DEF8;
  border-radius:5px;
  background:#FFFFFF;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  transition:all .15s ease;
}
.legend .chk-box:after{
  content:"";
  width:4px;
  height:7px;
  border:solid #FFFFFF;
  border-width:0 1.5px 1.5px 0;
  /* 45° 旋转形成对勾形状；translate 微调让视觉重心落在盒子正中央 */
  transform:translate(-0.5px,-1px) rotate(40deg);
  opacity:0;
  transition:opacity .1s ease;
}
.legend .chk input[type="checkbox"]:checked ~ .chk-box:after{opacity:1;}
.legend .leg-cycle .chk input[type="checkbox"]:checked ~ .chk-box{background:var(--pop-pink);border-color:var(--pop-pink);}
.legend .leg-poop .chk input[type="checkbox"]:checked ~ .chk-box{background:linear-gradient(135deg, #FF6B9B, #FF8811);border-color:#FF8811;}
.legend .leg-weight .chk input[type="checkbox"]:checked ~ .chk-box{background:var(--text-muted);border-color:var(--text-muted);}
.legend .leg-exercise .chk input[type="checkbox"]:checked ~ .chk-box{background:linear-gradient(135deg, #9BD9A1, #62C6A5);border-color:#62C6A5;}

/* Calendar Grid 日历独立卡片小格子网格 */
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  position:relative;
}
/* 英文缩写表头样式 */
.dow{
  text-align:center;
  color:var(--text-muted);
  font-size:11px;
  font-weight:700;
  padding:2px 0 6px;
  letter-spacing:.08em;
  font-family: var(--font-main);
  text-transform: uppercase;
}

.day-cell{
  position:relative;
  height:58px;
  background: rgba(255, 255, 255, 0.42);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: var(--radius-sm);
  box-shadow: 0 3px 10px rgba(120, 90, 130, 0.05);
  cursor:pointer;
  user-select:none;
  transition:all .2s ease;
  overflow:hidden;
}
.day-cell:hover{
  border-color: rgba(255, 107, 155, 0.35);
  background: rgba(255, 255, 255, 0.72);
  transform: translateY(-2px);
}
.day-cell:active{transform: scale(0.96);}

/* 今天以后的日期稍微淡化显示 */
.day-cell.future-day{
  opacity: 0.55;
  background: rgba(255, 255, 255, 0.28);
  border-color: rgba(255, 255, 255, 0.5);
}
.day-cell.future-day:hover{
  transform: none;
  background: rgba(255, 255, 255, 0.28);
  border-color: rgba(255, 255, 255, 0.5);
}

.day-cell.other-month{
  opacity:0.25;
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  pointer-events: none;
}

.week-detail-row{
  grid-column: 1 / -1;
  animation: detailExpand .25s ease;
}
@keyframes detailExpand{
  from{ opacity:0; transform:translateY(-8px); }
  to{ opacity:1; transform:translateY(0); }
}

/* 经期/排卵期在小格子内的独立半透明遮罩与正确外边框颜色 */
.day-bg-band{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  border-radius:10px;
}
.day-bg-band.period{
  background:var(--rose-bg);
}
.day-bg-band.follicular{
  background:var(--blue-bg);
}
.day-bg-band.ovulation{
  background:var(--purple-bg);
}
.day-bg-band.luteal{
  background:var(--amber-bg);
}
/* 预测中的周期阶段不再画边框，仅用更淡的底色区分 */
.day-bg-band.pred.period{background:rgba(255, 107, 155, 0.09)}
.day-bg-band.pred.follicular{background:rgba(17, 138, 178, 0.08)}
.day-bg-band.pred.ovulation{background:rgba(157, 78, 221, 0.07)}
.day-bg-band.pred.luteal{background:rgba(255, 209, 102, 0.14)}

/* 左上角日期数字样式（突出品质感） */
.num-wrap{
  position:absolute;
  top:4px;
  left:4px;
  z-index:2;
  width:22px;
  height:22px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:700;
  font-family: var(--font-main);
  color:var(--text-main);
  transition: all 0.2s ease;
}
.day-cell.selected{
  border-color: var(--pop-pink) !important;
  box-shadow: 0 4px 14px rgba(255, 107, 155, 0.25);
}
.day-cell.selected .num-wrap{
  background: var(--pop-pink) !important;
  color: #FFFFFF !important;
}

.day-cell.today:not(.selected) .num-wrap{
  background: var(--pop-yellow);
  color: var(--text-main);
  box-shadow:0 2px 6px rgba(255, 209, 102, 0.6);
}

/* 排便打卡标签：右上角小圆点，渐变色 */
.poop-tag{
  position:absolute;
  top:6px;
  right:6px;
  z-index:2;
  width:10px;
  height:10px;
  border-radius:50%;
  background: linear-gradient(135deg, #FF6B9B, #FF8811);
  pointer-events:none;
}

/* 运动打卡标签：紧挨在排便小点正下方，与排便保持相同尺寸（10x10），
   只是颜色换成运动主题薄荷绿，方便视觉上区分 */
.exercise-tag{
  position:absolute;
  top:20px;
  right:6px;
  z-index:2;
  width:10px;
  height:10px;
  border-radius:50%;
  background: linear-gradient(135deg, #9BD9A1, #62C6A5);
  pointer-events:none;
}

/* 右下角体重数值与箭头样式（区分字体调性） */
.weight-slot{
  position:absolute;
  bottom:5px;
  right:5px;
  z-index:2;
  display:flex;
  align-items:center;
}
.weight-tag{
  font-size:10.5px;
  color:#523B58;
  font-weight:600;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  white-space:nowrap;
  letter-spacing:-0.02em;
}
.arrow-up{color:var(--diff-up);font-size:9px;font-weight:bold;margin-left:1px;}
.arrow-down{color:var(--diff-down);font-size:9px;font-weight:bold;margin-left:1px;}
.arrow-slot{
  display:inline-block;
  width:8px;
  margin-left:1px;
  text-align:center;
  line-height:1;
}

/* 详情抽屉卡片 */
.inline-detail-card {
  margin: 12px 0 6px;
  background: var(--glass-bg);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  box-shadow: 0 6px 16px rgba(120, 90, 130, 0.10);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.inline-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px dashed rgba(184, 85, 122, 0.25);
  padding-bottom: 10px;
}
.inline-date { font-size: 15px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px;}
.inline-edit-btn {
  background: linear-gradient(135deg, #FFD166, #FF8811);
  border: 0; padding: 6px 14px; border-radius: 10px;
  font-size: 12px; font-weight: 700; color: #FFF; cursor: pointer;
  box-shadow: 0 3px 8px rgba(255, 136, 17, 0.3);
  transition: transform .2s;
}
.inline-edit-btn:hover { transform: scale(1.05); }

.inline-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; background: rgba(255, 255, 255, 0.5); padding: 12px; border-radius: 14px;
}
.inline-item { display: flex; flex-direction: column; gap: 2px; }
.inline-item label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
.inline-item val { font-size: 14px; font-weight: 700; color: var(--text-main); font-family: var(--font-num); font-variant-numeric: tabular-nums;}
.inline-poop-val { font-size: 13px !important; font-weight: 600 !important; color: var(--text-main) !important; line-height: 1.45; }

/* 弹窗样式表 */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(61, 43, 66, 0.4);
  backdrop-filter: blur(6px);
  display:flex; align-items:flex-end; justify-content:center;
  z-index:1000;
  opacity:0; pointer-events:none;
  transition:opacity .25s ease;
}
.modal-overlay.active{opacity:1; pointer-events:auto;}
.modal-panel{
  /* 用带色彩倾向的渐变代替纯白，配合更强的 blur/saturate，
     让"毛玻璃"真正读出来，而不是被内部一堆白色表单元素盖成一块实心白板 */
  background: linear-gradient(165deg, rgba(255, 246, 249, 0.62) 0%, rgba(255, 255, 255, 0.4) 100%);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-bottom: none;
  width:100%; max-width:580px;
  border-radius:24px 24px 0 0;
  padding:24px 20px calc(20px + env(safe-area-inset-bottom));
  /* 只保留一层顶部柔光阴影，去掉原来叠加的 inset 高光，
     避免在底部安全区附近看起来像多了一层阴影 */
  box-shadow:0 -10px 34px rgba(120, 90, 130, 0.18);
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(0.16, 1, 0.3, 1);
  max-height:88vh;
  overflow-y:auto;
}
.modal-overlay.active .modal-panel{transform:translateY(0);}
.modal-header{
  display:flex; justify-content:space-between; align-items:center;
  margin: -18px -20px 12px;
  padding: 16px 20px 12px;
}
.modal-header span{font-size:18px;font-weight:700;color:var(--text-main)}
.modal-close{
  background:rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border:1px solid var(--glass-border); width:32px; height:32px; border-radius:50%;
  font-size:16px; color:var(--pop-pink); font-weight:bold; cursor:pointer; display:grid; place-items:center;
}

/* 排便板块：与体重板块结构一致，高亮色改为排便主题的柔玫橘 */
.poop-stat-num{color:var(--pop-poop) !important;}
.poop-scrollbar-thumb{background:linear-gradient(90deg, var(--pop-poop), var(--pop-yellow)) !important;}

/* 运动板块：复用排便的整体结构，仅替换主题色为橄榄黄绿→果绿渐变 */
.exercise-stat-num{color:var(--pop-exercise-2) !important;}
.exercise-scrollbar-thumb{background:linear-gradient(90deg, #9BD9A1, #62C6A5) !important;}

.inline-exercise-val{ font-size:13px !important; font-weight:600 !important; color:var(--text-main) !important; line-height:1.45;}
.inline-exercise-types{ color:var(--pop-exercise-2); font-weight:700; }

.tag-phase{
  display:inline-block;
  padding:4px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:700;
}
.tag-phase.period{background:var(--rose-bg);color:var(--pop-pink)}
.tag-phase.follicular{background:var(--blue-bg);color:var(--pop-blue)}
.tag-phase.ovulation{background:var(--purple-bg);color:var(--pop-purple)}
.tag-phase.luteal{background:var(--amber-bg);color:var(--amber)}

.chart-container{width:100%;height:200px;position:relative;touch-action:none}
canvas{width:100%;height:100%;display:block}

/* 图表下方的可拖动位置提示条：默认淡出，交互时淡入 */
.chart-scrollbar-track{
  position:relative;
  height:4px;
  border-radius:2px;
  background:#FFE5EC;
  margin:10px 20px 0;
  opacity:0.25;
  transition:opacity .35s ease;
}
.chart-scrollbar-track.active{opacity:1;}
.chart-scrollbar-thumb{
  position:absolute;
  top:0;left:0;
  height:100%;
  min-width:8%;
  border-radius:2px;
  background:linear-gradient(90deg, var(--pop-pink), var(--pop-orange));
}

.zoom-hint{
  text-align:center;
  font-size:12px;
  color:var(--text-muted);
  margin-top:10px;
  margin-bottom:18px;
  font-weight:600;
}

/* 底部数据网格 */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--glass-bg);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:9px 12px;text-align:center;}
.stat b{display:block;font-size:17px;color:var(--pop-pink);margin-top:4px;font-weight:700;font-family:var(--font-num);font-variant-numeric: tabular-nums;}
.stat span{font-size:11px;color:var(--text-muted);font-weight:600;}
.stat-editable{cursor:pointer;}

.notice{padding:2px 2px 4px;font-size:13px;line-height:1.6;color:var(--text-main);font-weight:600;}
.notice b{
  background: linear-gradient(135deg, #FF6B9B, #FF8811);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.prediction-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}
.pred-item{
  padding:6px;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.pred-item .d-label{
  color:var(--text-muted);
  font-size:14px;
  font-weight:700;
  font-family:var(--font-num);
  font-variant-numeric: tabular-nums;
  display:inline-flex;
  align-items:center;
  padding:10px 16px 10px 18px;
  border-radius:999px;
  background: var(--glass-bg);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border:1px solid rgba(255, 255, 255, 0.4);
  box-shadow: 0 6px 18px rgba(255, 107, 155, 0.14);
  transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
}
.pred-item:hover .d-label,
.pred-item:active .d-label{
  background: var(--glass-bg-strong);
  transform: scale(1.05);
  box-shadow: 0 10px 26px rgba(255, 107, 60, 0.22);
}
.d-arrow{
  margin-left:5px;
  font-weight:700;
  font-size:13px;
  background: linear-gradient(135deg, #FF6B9B, #FF8811);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  opacity:0.7;
  transition: transform .18s ease;
}
.pred-item:hover .d-arrow,
.pred-item:active .d-arrow{
  transform: translateX(2px);
  opacity:1;
}
.pred-hint{
  display:block;
  margin-top:6px;
  font-size:11px;
  font-weight:600;
  color:var(--text-muted);
}

/* ===== AI 洞察卡片（周期 Tab 内，AI 生成的建设性提醒）===== */
.ai-insight-card{margin-top:16px;}
.ai-insight-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.ai-insight-title-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  cursor:pointer;

<script>
const SUPABASE_URL="https://uiqkqgwnlboqacwknkdi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_QVHDieGAZvy8vZxLtCCHLw_q3_B-aGO";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let authMode="login";

const KEY="bodyDiaryV3";
let data=JSON.parse(localStorage.getItem(KEY)||'{"targetWeight":50.0,"days":{}}');
if(!data.targetWeight) data.targetWeight = 50.0;

let selectedKey = null;
let viewDate = new Date();

function formatChartDateWithWeekday(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const weekdays = ["日","一","二","三","四","五","六"];
  if(!isNaN(d.getTime())){
    const parts = dateStr.split("-");
    if(parts.length === 3){
      return `${parseInt(parts[1],10)}月${parseInt(parts[2],10)}日(${weekdays[d.getDay()]})`;
    }
  }
  return dateStr;
}

/* 4 个日历筛选 checkbox 的状态从 localStorage 恢复，避免每次刷新都被重置为全选 */
const FILTER_KEY = "bodyDiaryV3_filters";
let calFilters = { cycle:true, poop:true, weight:true, exercise:true };

function toggleFilter(type, checked){
  calFilters[type] = checked;
  try { localStorage.setItem(FILTER_KEY, JSON.stringify(calFilters)); } catch(e){}
  renderCalendar();
}

/* 从 localStorage 恢复筛选状态，并把 checkbox 视觉上同步过来 */
function loadFilters(){
  try {
    const saved = JSON.parse(localStorage.getItem(FILTER_KEY) || "null");
    if (saved && typeof saved === "object"){
      for (const k of ["cycle","poop","weight","exercise"]){
        if (k in saved) calFilters[k] = !!saved[k];
      }
    }
  } catch(e){}
  const labelMap = {
    "leg-cycle":"cycle",
    "leg-poop":"poop",
    "leg-weight":"weight",
    "leg-exercise":"exercise"
  };
  document.querySelectorAll(".legend input[type=\"checkbox\"]").forEach(cb=>{
    const label = cb.closest("label");
    if (!label) return;
    for (const cls of label.classList){
      if (labelMap[cls]){ cb.checked = !!calFilters[labelMap[cls]]; break; }
    }
  });
}
let currentPickerWeight = 52.0;

function pad(n){return String(n).padStart(2,"0")}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function formatSlash(d){return d.getFullYear()+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate())}
function fmt1(n){return n == null ? "" : Number(n).toFixed(1)}
let cloudSyncQueue=Promise.resolve();
let cloudLoaded=false;
let cloudUserId=null;

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
  if(cloudLoaded && cloudUserId) queueCloudSync();
}

function queueCloudSync(){
  const snapshot=JSON.parse(JSON.stringify(data));
  cloudSyncQueue=cloudSyncQueue
    .then(()=>syncSnapshotToCloud(snapshot))
    .catch(err=>console.error("云端同步失败:",err));
  return cloudSyncQueue;
}

async function syncSnapshotToCloud(snapshot){
  if(!cloudUserId) return;
  const rows=Object.entries(snapshot.days||{}).map(([date,d])=>({
    user_id:cloudUserId,
    record_date:date,
    weight:d?.weight==null?null:Number(d.weight),
    period:d?.period||null,
    poops:Array.isArray(d?.poops)?d.poops:[],
    exercises:Array.isArray(d?.exercises)?d.exercises:[]
  }));

  if(rows.length){
    const {error}=await supabaseClient.from("body_records").upsert(rows,{onConflict:"user_id,record_date"});
    if(error) throw error;
  }

  const {data:remoteRows,error:readError}=await supabaseClient
    .from("body_records").select("record_date").eq("user_id",cloudUserId);
  if(readError) throw readError;
  const keep=new Set(rows.map(r=>r.record_date));
  const stale=(remoteRows||[]).map(r=>r.record_date).filter(d=>!keep.has(d));
  if(stale.length){
    const {error}=await supabaseClient.from("body_records")
      .delete().eq("user_id",cloudUserId).in("record_date",stale);
    if(error) throw error;
  }

  const {error:profileError}=await supabaseClient.from("profiles").upsert({
    id:cloudUserId,
    username:(snapshot.username||"") || undefined,
    target_weight:Number(snapshot.targetWeight||50)
  });
  if(profileError) console.warn("目标体重同步失败:",profileError);
}

async function loadCloudData(user){
  if(!user) return;
  cloudUserId=user.id;
  await ensureProfile(user);

  const {data:rows,error}=await supabaseClient.from("body_records")
    .select("record_date,weight,period,poops,exercises")
    .eq("user_id",user.id)
    .order("record_date");
  if(error) throw error;

  const {data:profile}=await supabaseClient.from("profiles")
    .select("target_weight").eq("id",user.id).maybeSingle();

  const localHasData=Object.keys(data.days||{}).length>0;
  const cloudHasData=(rows||[]).length>0;

  if(!cloudHasData && localHasData){
    cloudLoaded=true;
    await syncSnapshotToCloud(data);
    return;
  }

  if(cloudHasData){
    const days={};
    for(const r of rows){
      const d={poops:Array.isArray(r.poops)?r.poops:[]};
      if(Array.isArray(r.exercises) && r.exercises.length) d.exercises = r.exercises;
      if(r.weight!=null) d.weight=Number(r.weight);
      if(r.period) d.period=r.period;
      if(!d.poops.length) delete d.poops;
      if(d.exercises && !d.exercises.length) delete d.exercises;
      days[r.record_date]=d;
    }
    data={
      targetWeight: profile?.target_weight==null ? 50 : Number(profile.target_weight),
      days
    };
    localStorage.setItem(KEY,JSON.stringify(data));
  }else if(profile?.target_weight!=null){
    data.targetWeight=Number(profile.target_weight);
    localStorage.setItem(KEY,JSON.stringify(data));
  }

  cloudLoaded=true;
  renderCalendar();
  drawChart();
  drawPoopChart();
  drawExerciseChart();
  renderTrendSummary();
  prediction();
  loadLatestCloudAIInsight();
}

function showAuthMessage(text,error=false){

  el.textContent=text;
  el.className="auth-message"+(error?" error":"");
}

async function submitAuth(){
  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;
  if(!email||!password){showAuthMessage("请填写邮箱和密码。",true);return;}
  if(password.length<6){showAuthMessage("密码至少需要 6 位。",true);return;}
  const btn=document.getElementById("authSubmitBtn");
  btn.disabled=true;
  showAuthMessage(authMode==="login"?"正在登录…":"正在注册…");
  try{
    if(authMode==="signup"){
      const {data:result,error}=await supabaseClient.auth.signUp({
        email,
        password,
        options:{emailRedirectTo:"https://sandykaze.github.io/heath/"}
      });
      if(error) throw error;
      if(result.session){
        await ensureProfile(result.user);
        await handleSignedIn(result.user);
        showAuthMessage("注册成功，数据已同步。");
      }else{
        showAuthMessage("注册成功！请检查邮箱并点击验证链接，然后回来登录。");
      }
    }else{
      const {data:result,error}=await supabaseClient.auth.signInWithPassword({email,password});
      if(error) throw error;
      await ensureProfile(result.user);
      await handleSignedIn(result.user);
      showAuthMessage("登录成功，数据已同步！");
      setTimeout(closeAuth,700);
    }
  }catch(err){
    console.error(err);
    showAuthMessage(authErrorText(err),true);
  }finally{
    btn.disabled=false;
  }
}

function authErrorText(err){
  const msg=String(err?.message||err||"");
  if(msg.toLowerCase().includes("invalid login credentials")) return "邮箱或密码不正确。";
  if(msg.toLowerCase().includes("email not confirmed")) return "邮箱还没有验证，请先去邮箱点击验证链接。";
  if(msg.toLowerCase().includes("user already registered")) return "这个邮箱已经注册过了，请直接登录。";
  if(msg.toLowerCase().includes("password should be at least")) return "密码至少需要 6 位。";
  return msg||"操作失败，请稍后再试。";
}

async function ensureProfile(user){

function getAvgCycleLength(){
  const starts = Object.keys(data.days).filter(k=>data.days[k].period==="start").sort();
  if(starts.length < 2) return 28;
  let diffs = [];
  for(let i=1; i<starts.length; i++){
    diffs.push((new Date(starts[i]) - new Date(starts[i-1])) / 86400000);
  }
  return Math.round(diffs.reduce((a,b)=>a+b,0) / diffs.length);
}

/* 展示用的精确平均周期（保留1位小数），日期推算仍用上面四舍五入后的整数天 */
function getAvgCycleLengthPrecise(){
  const starts = Object.keys(data.days).filter(k=>data.days[k].period==="start").sort();
  if(starts.length < 2) return 28;
  let diffs = [];
  for(let i=1; i<starts.length; i++){
    diffs.push((new Date(starts[i]) - new Date(starts[i-1])) / 86400000);
  }
  return Number((diffs.reduce((a,b)=>a+b,0) / diffs.length).toFixed(1));
}

function computeCyclePhases(){
  const phases = {};
  const starts = Object.keys(data.days).filter(k=>data.days[k].period==="start").sort();
  const avgCycle = getAvgCycleLength();

  if(starts.length < 2) return phases;

  starts.forEach((sKey, idx) => {
    const sDate = new Date(sKey+"T00:00:00");
    const nextSDate = starts[idx+1] ? new Date(starts[idx+1]+"T00:00:00") : new Date(sDate.getTime() + avgCycle*86400000);
    const cycleDays = Math.round((nextSDate - sDate) / 86400000);
    
    for(let i=0; i<cycleDays; i++){
      const curr = new Date(sDate);
      curr.setDate(curr.getDate() + i);
      const k = key(curr);

      /* 周期四阶段：按当次实际周期长度分桶
         day 0-4 姨妈期 / day 5~cycleDays-19 卵泡期 / cycleDays-18~cycleDays-12 排卵期 / 其余 黄体期 */
      let p;
      if(i < 5){
        p = "period";
      } else if(i < Math.max(5, cycleDays - 18)){
        p = "follicular";
      } else if(i <= Math.max(5, cycleDays - 12)){
        p = "ovulation";
      } else {
        p = "luteal";
      }
      phases[k] = { phase: p, isPred: false };
    }
  });

  let lastStart = new Date(starts.at(-1)+"T00:00:00");
  for(let m=1; m<=12; m++){
    let pStart = new Date(lastStart);
    pStart.setDate(pStart.getDate() + avgCycle * m);
    
    for(let i=0; i<avgCycle; i++){
      const curr = new Date(pStart);
      curr.setDate(curr.getDate() + i);
      const k = key(curr);

      if(phases[k] && !phases[k].isPred) continue;

      /* 预测周期四阶段：按历史平均周期长度分桶，逻辑与上面实际周期一致 */
      let p;
      if(i < 5){
        p = "period";
      } else if(i < Math.max(5, avgCycle - 18)){
        p = "follicular";
      } else if(i <= Math.max(5, avgCycle - 12)){
        p = "ovulation";
      } else {
        p = "luteal";
      }
      phases[k] = { phase: p, isPred: true };
    }
  }

  return phases;
}

function computeWeightDifferences(){
  const sortedDates = Object.keys(data.days)
    .filter(k => data.days[k].weight != null)
    .sort();
  
  const diffs = {};
  for(let i=0; i<sortedDates.length; i++){
    const k = sortedDates[i];
    const currW = data.days[k].weight;
    if(i === 0){
      diffs[k] = null;
    } else {
      const prevW = data.days[sortedDates[i-1]].weight;
      const diff = currW - prevW;
      diffs[k] = Number(diff.toFixed(1));
    }
  }
  return diffs;
}

function renderCalendar(){
  const y = viewDate.getFullYear(), m = viewDate.getMonth();
  document.getElementById("monthTitle").textContent = `${y}年 ${m+1}月`;
  
  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  const todayObj = new Date();
  todayObj.setHours(0,0,0,0);
  const todayStr = key(todayObj);
  
  const phases = computeCyclePhases();
  const weightDiffs = computeWeightDifferences();

  /* 星期表头改为英文三字母缩写 */
  let html = ["SUN","MON","TUE","WED","THU","FRI","SAT"].map(x=>`<div class="dow">${x}</div>`).join("");

  let cellCount = 0;
  let weekKeys = [];

  function flushWeekIfNeeded(){
    if(cellCount % 7 === 0){
      if(selectedKey && weekKeys.includes(selectedKey)){
        html += buildDetailRowHtml(selectedKey, phases, weightDiffs);
      }
      weekKeys = [];
    }
  }

  for(let i=0; i<first.getDay(); i++){
    html += `<div class="day-cell other-month"></div>`;
    cellCount++;
    weekKeys.push(null);
    flushWeekIfNeeded();
  }

  for(let d=1; d<=last.getDate(); d++){
    const dt = new Date(y, m, d);
    dt.setHours(0,0,0,0);
    const k = key(dt);
    const dayData = data.days[k] || {};
    const phaseInfo = phases[k] || {};
    
    let phaseType = phaseInfo.phase;
    if(dayData.period === "start" || dayData.period === "on") phaseType = "period";
    if(phaseType && !calFilters.cycle) phaseType = null;

    const isPred = phaseInfo.isPred;
    
    let bandClasses = phaseType ? ` ${phaseType}` : '';
    if(isPred) bandClasses += " pred";

    let weightHtml = "";
    if(calFilters.weight && dayData.weight != null){
      const formattedW = fmt1(dayData.weight);
      const diffVal = weightDiffs[k];
      let arrowHtml = `<span class="arrow-slot"></span>`;
      if(diffVal != null && diffVal > 0){
        arrowHtml = `<span class="arrow-slot arrow-up">↑</span>`;
      } else if(diffVal != null && diffVal < 0){
        arrowHtml = `<span class="arrow-slot arrow-down">↓</span>`;
      }
      weightHtml = `<div class="weight-tag">${formattedW}${arrowHtml}</div>`;
    }

    /* 排便打卡标签：右上角色块，受筛选开关控制 */
    let poopHtml = "";
    if(calFilters.poop && dayData.poops && dayData.poops.length){
      poopHtml = `<div class="poop-tag"></div>`;
    }

    /* 运动打卡标签：放在排便小圆点正下方，紧凑 8px，受筛选开关控制 */
    let exerciseTagHtml = "";
    if(calFilters.exercise && dayData.exercises && dayData.exercises.length){
      exerciseTagHtml = `<div class="exercise-tag"></div>`;
    }

    const isToday = k === todayStr;
    const isFuture = dt > todayObj;
    const isSelected = k === selectedKey;
    const dateDisplay = isToday ? "今" : d;

    html += `
      <div class="day-cell ${isToday?'today':''} ${isFuture?'future-day':''} ${isSelected?'selected':''}" onclick="selectDay('${k}')">
        ${phaseType ? `<div class="day-bg-band ${bandClasses}"></div>` : ''}
        <div class="num-wrap">${dateDisplay}</div>
        ${poopHtml}
        ${exerciseTagHtml}
        <div class="weight-slot">${weightHtml}</div>
      </div>
    `;
    cellCount++;
    weekKeys.push(k);
    flushWeekIfNeeded();
  }

  while(cellCount % 7 !== 0){
    html += `<div class="day-cell other-month"></div>`;
    cellCount++;
    weekKeys.push(null);
  }
  flushWeekIfNeeded();

  document.getElementById("calendar").innerHTML = html;
}

function buildDetailRowHtml(k, phases, weightDiffs){
  const dayData = data.days[k] || {};

  let phaseKey = null;
  if(dayData.period === "start" || dayData.period === "on"){
    phaseKey = "period";
  } else if(phases[k]){
    phaseKey = phases[k].phase;
  }
  let phaseTagHtml = "";
  if(phaseKey){
    phaseTagHtml = `<span class="tag-phase ${phaseKey}">${PHASE_LABEL[phaseKey]}</span>`;
  }

  let weightVal = "未记录", diffVal = "—";
  if(dayData.weight != null){
    weightVal = fmt1(dayData.weight) + " kg";
    const diff = weightDiffs[k];
    if(diff != null){
      diffVal = diff === 0 ? "±0 kg" : (diff > 0 ? "+" : "") + fmt1(diff) + " kg";
    } else {
      diffVal = "首次记录";
    }
  }

  const poops = dayData.poops || [];
  let poopVal = "无";
  if(poops.length){
    poopVal = poops.map(p => `${p.size} (${p.hour}:00)${p.note?` [${p.note}]`:''}`).join("，");
  }

  const exercises = dayData.exercises || [];
  let exerciseVal = "无";
  if(exercises.length){
    const totalMin = exercises.reduce((s,x)=> s + (x.minutes||0), 0);
    const allTypes = [...new Set(exercises.flatMap(x => x.types || []))].join(" · ");
    /* 备注统一去重收到末尾括号里 */
    const allNotes = [...new Set(exercises.map(x => (x.note || "").trim()).filter(Boolean))];
    const head = `${totalMin} 分钟${allTypes ? ` · ${allTypes}` : ""}`;
    exerciseVal = allNotes.length ? `${head}（${allNotes.join("；")}）` : head;
  }

  return `
    <div class="week-detail-row">
      <div class="inline-detail-card">
        <div class="inline-head">
          <div class="inline-date">
            <span>${k}</span>
            ${phaseTagHtml}
          </div>
          <button class="inline-edit-btn" onclick="event.stopPropagation(); openEditModal()">编辑当天数据</button>
        </div>

        <div class="inline-grid">
          <div class="inline-item">
            <label>体重</label>
            <val>${weightVal}</val>
          </div>
          <div class="inline-item">
            <label>变化</label>
            <val>${diffVal}</val>
          </div>
          <div class="inline-item" style="grid-column: span 2;">
            <label>排便记录</label>
            <val class="inline-poop-val">${poopVal}</val>
          </div>
          <div class="inline-item" style="grid-column: span 2;">
            <label>运动记录</label>
            <val class="inline-exercise-val">${exerciseVal}</val>
          </div>
        </div>
      </div>
    </div>
  `;
}

function buildChartSeries(){
  const allKeys = Object.keys(data.days).sort();
  if(!allKeys.length) return [];

  const startD = new Date(allKeys[0]+"T00:00:00");
  const todayD = new Date(key(new Date())+"T00:00:00");
  const endD = todayD;
  
  let rawList = [];
  let curr = new Date(startD);

  const weightDiffs = computeWeightDifferences();
  const phases = computeCyclePhases();

  while(curr <= endD){
    const k = key(curr);
    const dayData = data.days[k] || {};
    
    let phaseKey = null;
    if(dayData.period === "start" || dayData.period === "on"){
      phaseKey = "period";
    } else if(phases[k]){
      phaseKey = phases[k].phase;
    }

    rawList.push({
      date: k,
      weight: dayData.weight ?? null,
      diff: weightDiffs[k],
      poops: dayData.poops || [],
      phase: phaseKey ? PHASE_LABEL[phaseKey] : "",
      phaseKey: phaseKey || ""
    });
    curr.setDate(curr.getDate() + 1);
  }

  /* 去掉最前面还没有体重记录的日子，避免缩放时把这段空白也算进去 */
  const firstWeightIdx = rawList.findIndex(d => d.weight != null);
  if(firstWeightIdx === -1) return [];
  rawList = rawList.slice(firstWeightIdx);

  return rawList;
}

function drawMonotoneSpline(ctx, points, color) {
  if (points.length < 2) return;
  if (points.length === 2) {
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    ctx.lineTo(points[1].x, points[1].y);
    ctx.strokeStyle = color;
    ctx.lineWidth = 3.5;
    ctx.stroke();
    return;
  }

  const n = points.length;
  const dx = [];
  const dy = [];
  const m = [];

  for (let i = 0; i < n - 1; i++) {
    dx.push(points[i + 1].x - points[i].x);
    dy.push(points[i + 1].y - points[i].y);
    m.push(dy[i] / dx[i]);
  }

  const tangents = [m[0]];
  for (let i = 0; i < n - 2; i++) {
    if (m[i] * m[i + 1] <= 0) {
      tangents.push(0);
    } else {
      const common = dx[i] + dx[i + 1];
      tangents.push((3 * common) / ((common + dx[i + 1]) / m[i] + (common + dx[i]) / m[i + 1]));
    }
  }
  tangents.push(m[m.length - 1]);

  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);

  for (let i = 0; i < n - 1; i++) {
    const p0 = points[i];
    const p1 = points[i + 1];
    const t0 = tangents[i];
    const t1 = tangents[i + 1];
    const d = dx[i];

    const cp1x = p0.x + d / 3;
    const cp1y = p0.y + (t0 * d) / 3;
    const cp2x = p1.x - d / 3;
    const cp2y = p1.y - (t1 * d) / 3;

    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p1.x, p1.y);
  }

  ctx.strokeStyle = color;
  ctx.lineWidth = 3.5;
  ctx.stroke();
}

let userStep = 85;
let userZoomed = false;
const DEFAULT_VISIBLE_DAYS = 10;

function drawChart(){
  const box = document.getElementById("chartBox");
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");
  
  const dpr = window.devicePixelRatio || 1;
  const W = box.clientWidth;
  const H = box.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const series = buildChartSeries();

  const scrollTrackEl = document.getElementById("chartScrollTrack");

  if(!series.length){
    if(scrollTrackEl) scrollTrackEl.style.visibility = "hidden";
    ctx.fillStyle="#8E7A93"; ctx.font="bold 13px 'Noto Sans SC',sans-serif"; ctx.textAlign="center";
    ctx.fillText("暂无数据", W/2, H/2);
    return;
  }

  const validWeights = series.map(x=>x.weight).filter(w=>w!=null);
  if(!validWeights.length){
    if(scrollTrackEl) scrollTrackEl.style.visibility = "hidden";
    ctx.fillStyle="#8E7A93"; ctx.font="bold 13px 'Noto Sans SC',sans-serif"; ctx.textAlign="center";
    ctx.fillText("无体重数据", W/2, H/2);
    return;
  }

  const min = Math.min(...validWeights);
  const max = Math.max(...validWeights);
  const range = (max - min) || 1;

  const targetW = data.targetWeight || 50.0;
  const latestW = validWeights.at(-1);
  const targetDiff = Number((latestW - targetW).toFixed(1));

  let change30 = "—";
  if(series.length > 1){
    const latestDateObj = new Date(series.at(-1).date+"T00:00:00");
    const d30AgoObj = new Date(latestDateObj.getTime() - 30 * 86400000);
    const d30Key = key(d30AgoObj);
    
    const pastValid = series.filter(x => x.weight != null && x.date <= d30Key);
    if(pastValid.length){
      const diff30 = latestW - pastValid.at(-1).weight;
      change30 = (diff30 > 0 ? "+" : "") + fmt1(diff30) + "kg";
    }
  }

  document.getElementById("targetW").textContent = fmt1(targetW) + "kg";
  document.getElementById("targetDiffW").textContent = (targetDiff > 0 ? "+" : "") + fmt1(targetDiff) + "kg";
  document.getElementById("change30W").textContent = change30;

  const padL = 20, padR = 20, padT = 20, padB = 30;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  const scrollTrack = document.getElementById("chartScrollTrack");
  const scrollThumb = document.getElementById("chartScrollThumb");
  let scrollbarFadeTimer = null;
  function pokeScrollbar(){
    if(!scrollTrack) return;
    scrollTrack.classList.add("active");
    clearTimeout(scrollbarFadeTimer);
    scrollbarFadeTimer = setTimeout(()=> scrollTrack.classList.remove("active"), 700);
  }
  function updateScrollbar(totalW, offset, maxOffset){
    if(!scrollTrack || !scrollThumb) return;
    if(totalW <= plotW){
      scrollTrack.style.visibility = "hidden";
      return;
    }
    scrollTrack.style.visibility = "visible";
    const thumbPct = Math.max(8, Math.min(100, (plotW / totalW) * 100));
    const scrollRatio = maxOffset > 0 ? offset / maxOffset : 0;
    scrollThumb.style.width = thumbPct + "%";
    scrollThumb.style.left = (scrollRatio * (100 - thumbPct)) + "%";
  }

  if(!userZoomed){
    userStep = Math.max(15, Math.min(150, plotW / (Math.min(DEFAULT_VISIBLE_DAYS, series.length) - 1 || 1)));
  }

  const totalW = (series.length - 1) * userStep;
  const maxOffset = Math.max(0, totalW - plotW);
  let offset = maxOffset;

  /* 三个图表（体重 / 排便 / 运动）共用 selectedKey 作为跨 Tab 的选中日期；
     进入任何一个 Tab 时都尝试在当前 series 里查找 selectedKey 对应的索引；
     找不到再退回最后一天。这样在任意图表上点一下，再切到其它图表，
     仍然停在同一天，不会"被拉回到今天"。 */
  let selectedIdx = series.length - 1;
  if (selectedKey) {
    const foundIdx = series.findIndex(s => s.date === selectedKey);
    if (foundIdx >= 0) selectedIdx = foundIdx;
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    const totalW = (series.length - 1) * userStep;
    const maxOffset = Math.max(0, totalW - plotW);
    offset = Math.max(0, Math.min(offset, maxOffset));
    updateScrollbar(totalW, offset, maxOffset);

    ctx.strokeStyle="rgba(140, 120, 150, 0.16)";
    ctx.lineWidth=1.5;
    for(let i=0;i<3;i++){
      let y = padT + i * plotH / 2;
      ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    }

    let lastValidW = validWeights[0];
    const pts = series.map((e,i)=>{
      const wVal = e.weight != null ? e.weight : lastValidW;
      if(e.weight != null) lastValidW = e.weight;
      return {
        x: padL + i*userStep - offset,
        y: padT + (max - wVal)/range * plotH,
        raw: e
      };
    });

    const validPts = pts.filter(p=>p.raw.weight!=null);
    if(validPts.length > 0){
      drawMonotoneSpline(ctx, validPts, "#FF6B9B");
    }

    pts.forEach((p, idx)=>{
      if(p.x >= padL - 10 && p.x <= W - padR + 10){
        ctx.beginPath();
        if(p.raw.weight != null){
          ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
          ctx.fillStyle="#FF6B9B";
          ctx.fill();
        } else {
          ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
          ctx.strokeStyle="#BCA3C3";
          ctx.lineWidth=2;
          ctx.fillStyle="#FFFFFF";
          ctx.fill();
          ctx.stroke();
        }

        const labelInterval = Math.max(1, Math.round(60 / userStep));
        if(idx % labelInterval === 0){
          ctx.fillStyle="#8E7A93";
          ctx.font="bold 11px 'DM Sans','Noto Sans SC',sans-serif";
          ctx.textAlign="center";
          ctx.fillText(p.raw.date.slice(5), p.x, padT + plotH + 18);
        }
      }
    });

    if(selectedIdx >= 0 && pts[selectedIdx]){
      const p = pts[selectedIdx];
      if(p.x >= padL && p.x <= W - padR){
        ctx.strokeStyle="rgba(255, 107, 155, 0.4)";
        ctx.lineWidth=2;
        ctx.setLineDash([4,4]);
        ctx.beginPath();ctx.moveTo(p.x, padT);ctx.lineTo(p.x, padT+plotH);ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(p.x, p.y, 7, 0, Math.PI*2);
        ctx.fillStyle="#FFD166";
        ctx.fill();
        ctx.lineWidth=3;
        ctx.strokeStyle="#FF6B9B";
        ctx.stroke();
      }
    }
  }

  let activePointers = [];
  let prevPinchDist = null;
  let dragging = false, startX = 0;

  function getDistance(p1, p2) {
    return Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
  }

  canvas.onpointerdown = e => {
    canvas.setPointerCapture(e.pointerId);
    activePointers.push(e);
    pokeScrollbar();
    if(activePointers.length === 1){
      dragging = true; startX = e.clientX;
    }
  };

  canvas.onpointermove = e => {
    const idx = activePointers.findIndex(p => p.pointerId === e.pointerId);
    if(idx >= 0) activePointers[idx] = e;

    if (activePointers.length === 2) {
      dragging = false;
      const dist = getDistance(activePointers[0], activePointers[1]);
      if (prevPinchDist) {
        const factor = dist / prevPinchDist;
        userStep = Math.max(15, Math.min(150, userStep * factor));
        userZoomed = true;
        pokeScrollbar();
        render();
      }
      prevPinchDist = dist;
    } else if (dragging && activePointers.length === 1) {
      offset -= (e.clientX - startX);
      startX = e.clientX;
      pokeScrollbar();
      render();
    }
  };

  canvas.onpointerup = canvas.onpointercancel = e => {
    activePointers = activePointers.filter(p => p.pointerId !== e.pointerId);
    if(activePointers.length < 2) prevPinchDist = null;
    if(activePointers.length === 0){
      if(dragging){
        dragging = false;
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickedIdx = Math.round((clickX - padL + offset) / userStep);
        if(clickedIdx >= 0 && clickedIdx < series.length){
          selectedIdx = clickedIdx;
          /* 把图表上的"选中点位"写回到全局 selectedKey，
             这样切到日历 / 排便 / 运动 Tab 时能停在同一天 */
          const newKey = series[clickedIdx].date;
          if (newKey !== selectedKey) {
            selectedKey = newKey;
            renderCalendar();
            renderTrendSummary();
          }
        }
        render();
      }
    }
  };

  canvas.onwheel = e => {
    e.preventDefault();
    if (e.deltaY < 0) userStep = Math.min(150, userStep * 1.1);
    else userStep = Math.max(15, userStep * 0.9);
    userZoomed = true;
    pokeScrollbar();
    render();
  };

  render();
}

/* ===================== 排便板块（金桔色高亮） ===================== */

const POOP_LEVEL_MAP = {"小":1, "小偏中":2, "中":3, "中偏大":4, "大":5};
const POOP_LEVEL_LABELS = ["小","小偏中","中","中偏大","大"];
const POOP_DATA_CAP = 6;   /* 数据上限：累计超过 6（多日大号）按 6 显示 */
const POOP_AXIS_MAX = 7;   /* 视觉上限，比数据 cap 多 1 个单位，给 cap 天的圆点和选中标记完整显示空间 */
const POOP_AXIS_MIN = -1;  /* 视觉下限，给"未排便"层的空心圆留缓冲 */

function buildPoopChartSeries(){
  const allKeys = Object.keys(data.days).sort();
  if(!allKeys.length) return [];

  const startD = new Date(allKeys[0]+"T00:00:00");
  const todayD = new Date(key(new Date())+"T00:00:00");
  const endD = todayD;

  let rawList = [];
  let curr = new Date(startD);
  while(curr <= endD){
    const k = key(curr);
    const dayData = data.days[k] || {};
    rawList.push({
      date: k,
      weight: dayData.weight ?? null,
      poops: dayData.poops || []
    });
    curr.setDate(curr.getDate() + 1);
  }

  /* 去掉最前面还没有排便记录的日子，避免缩放时把这段空白也算进去（与体重图逻辑一致） */
  const firstPoopIdx = rawList.findIndex(d => d.poops && d.poops.length > 0);
  if(firstPoopIdx === -1) return [];
  rawList = rawList.slice(firstPoopIdx);

  return rawList;
}

function computePoopStats(series){
  if(!series.length) return {avgPerWeek:null, maxStreak:0, maxGap:0};

  const totalDays = series.length;
  const poopDays = series.filter(d => d.poops && d.poops.length > 0).length;
  const avgPerWeek = totalDays ? Number((poopDays/totalDays*7).toFixed(1)) : null;

  let maxStreak=0, curStreak=0;
  series.forEach(d=>{
    if(d.poops && d.poops.length > 0){
      curStreak++;
      if(curStreak>maxStreak) maxStreak=curStreak;
    } else {
      curStreak=0;
    }
  });

  /* 最长连续便秘天数：只统计"前后都有排便记录"之间的空档天数，
     忽略第一次记录之前、以及最近一次记录之后（尚未继续记录）的天数 */
  const poopIdxList = [];
  series.forEach((d,i)=>{ if(d.poops && d.poops.length>0) poopIdxList.push(i); });
  let maxGap = 0;
  for(let i=1; i<poopIdxList.length; i++){
    const gap = poopIdxList[i] - poopIdxList[i-1] - 1;
    if(gap > maxGap) maxGap = gap;
  }

  return {avgPerWeek, maxStreak, maxGap};
}

function dayPoopLevel(d){
  if(!d.poops || !d.poops.length) return null;
  const total = d.poops.reduce((s,x)=> s + (POOP_LEVEL_MAP[x.size] || 1), 0);
  return Math.min(POOP_DATA_CAP, total);
}

let poopUserStep = 40;
let poopUserZoomed = false;

function drawPoopChart(){
  const box = document.getElementById("poopChartBox");
  const canvas = document.getElementById("poopChart");
  const ctx = canvas.getContext("2d");

  const dpr = window.devicePixelRatio || 1;
  const W = box.clientWidth;
  const H = box.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const series = buildPoopChartSeries();
  const scrollTrackEl = document.getElementById("poopChartScrollTrack");

  const stats = computePoopStats(series);
  document.getElementById("poopAvgDays").textContent = stats.avgPerWeek != null ? stats.avgPerWeek + "天/周" : "—";
  document.getElementById("poopMaxStreak").textContent = stats.maxStreak ? stats.maxStreak + "天" : "—";
  document.getElementById("poopMaxGap").textContent = stats.maxGap ? stats.maxGap + "天" : "—";

  if(!series.length){
    if(scrollTrackEl) scrollTrackEl.style.visibility = "hidden";
    ctx.fillStyle="#8E7A93"; ctx.font="bold 13px 'Noto Sans SC',sans-serif"; ctx.textAlign="center";
    ctx.fillText("暂无数据", W/2, H/2);
    return;
  }

  const padL = 40, padR = 20, padT = 20, padB = 30;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  const max = POOP_AXIS_MAX, min = POOP_AXIS_MIN, range = POOP_AXIS_MAX - POOP_AXIS_MIN;
  const unitScale = plotH / (POOP_AXIS_MAX - POOP_AXIS_MIN);

  const poopColor = (getComputedStyle(document.documentElement).getPropertyValue('--pop-poop') || '#FF9E7D').trim();

  const scrollTrack = document.getElementById("poopChartScrollTrack");
  const scrollThumb = document.getElementById("poopChartScrollThumb");
  let scrollbarFadeTimer = null;
  function pokeScrollbar(){
    if(!scrollTrack) return;
    scrollTrack.classList.add("active");
    clearTimeout(scrollbarFadeTimer);
    scrollbarFadeTimer = setTimeout(()=> scrollTrack.classList.remove("active"), 700);
  }
  function updateScrollbar(totalW, offset, maxOffset){
    if(!scrollTrack || !scrollThumb) return;
    if(totalW <= plotW){
      scrollTrack.style.visibility = "hidden";
      return;
    }
    scrollTrack.style.visibility = "visible";
    const thumbPct = Math.max(8, Math.min(100, (plotW / totalW) * 100));
    const scrollRatio = maxOffset > 0 ? offset / maxOffset : 0;
    scrollThumb.style.width = thumbPct + "%";
    scrollThumb.style.left = (scrollRatio * (100 - thumbPct)) + "%";
  }

  const POOP_DEFAULT_VISIBLE_DAYS = 10;
  if(!poopUserZoomed){
    poopUserStep = Math.max(15, Math.min(150, plotW / (Math.min(POOP_DEFAULT_VISIBLE_DAYS, series.length) - 1 || 1)));
  }

  let offset = Math.max(0, (series.length - 1) * poopUserStep - plotW);
  let selectedIdx = series.length - 1;
  /* 进入排便 Tab 时尝试把 selectedKey 同步到当前 series 对应的那一天 */
  if (selectedKey) {
    const foundIdx = series.findIndex(s => s.date === selectedKey);
    if (foundIdx >= 0) selectedIdx = foundIdx;
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    const totalW = (series.length - 1) * poopUserStep;
    const maxOffset = Math.max(0, totalW - plotW);
    offset = Math.max(0, Math.min(offset, maxOffset));
    updateScrollbar(totalW, offset, maxOffset);

    /* 6 个层级网格线与标签（画在底层，最后不会被数据盖住，也不会被数据盖过去） */
    ctx.strokeStyle="rgba(140, 120, 150, 0.16)";
    ctx.lineWidth=1;
    ctx.font="10px 'Noto Sans SC',sans-serif";
    ctx.textAlign="left";
    for(let lvl=0; lvl<=5; lvl++){
      const y = padT + (max - lvl)/range * plotH;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W-padR, y); ctx.stroke();
    }

    /* 折线与圆点绘制裁剪：左右两侧各留 10px 余量，
       避免最新一天 / 最早一天的圆点贴边被切掉一半。
       左侧严格贴住 padL - 10，往右延伸到 W - padR + 10，让头尾圆点都能完整显示 */
    ctx.save();
    ctx.beginPath();
    ctx.rect(padL - 10, padT - 10, (W - padR + 10) - (padL - 10), plotH + 20);
    ctx.clip();

    let lastValidLevel = 0;
    const pts = series.map((e,i)=>{
      const lvl = dayPoopLevel(e);
      /* 未排便的日子 val=0，让折线在视觉上"拉到最下面"；
         但 level 仍为 null，绘制时按空心圆显示 */
      const val = lvl != null ? lvl : 0;
      return {
        x: padL + i*poopUserStep - offset,
        y: padT + (max - val)/range * plotH,
        raw: e,
        level: lvl
      };
    });

    /* 折线穿过所有点（包括未排便的日子），形成"下拉到未排便行"的视觉效果 */
    if(pts.length > 1){
      drawMonotoneSpline(ctx, pts, poopColor);
    }

    pts.forEach((p)=>{
      if(p.x >= padL - 10 && p.x <= W - padR + 10){
        ctx.beginPath();
        if(p.level != null){
          ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
          ctx.fillStyle = poopColor;
          ctx.fill();
        } else {
          ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
          ctx.strokeStyle="#BCA3C3";
          ctx.lineWidth=2;
          ctx.fillStyle="#FFFFFF";
          ctx.fill();
          ctx.stroke();
        }
      }
    });

    if(selectedIdx >= 0 && pts[selectedIdx]){
      const p = pts[selectedIdx];
      if(p.x >= padL && p.x <= W - padR){
        ctx.strokeStyle="rgba(229, 139, 90, 0.4)";
        ctx.lineWidth=2;
        ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(p.x, padT); ctx.lineTo(p.x, padT+plotH); ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(p.x, p.y, 7, 0, Math.PI*2);
        ctx.fillStyle="#FFD166";
        ctx.fill();
        ctx.lineWidth=3;
        ctx.strokeStyle=poopColor;
        ctx.stroke();
      }
    }

    ctx.restore();

    /* 纵坐标层级文字画在最上层，永远不会被折线/圆点盖住；
       统一右对齐紧贴网格线，不同字数的标签也能整齐排列，不再显得参差违和 */
    ctx.fillStyle="#8E7A93";
    ctx.font="10px 'Noto Sans SC',sans-serif";
    ctx.textAlign="right";
    const axisLabelX = padL - 8;
    /* 未排便在最底部（level 0） */
    ctx.fillText("未排便", axisLabelX, padT + (max - 0)/range * plotH + 3);
    for(let lvl=1; lvl<=5; lvl++){
      const y = padT + (max - lvl)/range * plotH;
      ctx.fillText(POOP_LEVEL_LABELS[lvl-1], axisLabelX, y+3);
    }

    /* 日期标签画在图表下方，不受裁剪影响 */
    const labelInterval = Math.max(1, Math.round(60 / poopUserStep));
    pts.forEach((p, idx)=>{
      if(p.x >= padL - 10 && p.x <= W - padR + 10 && idx % labelInterval === 0){
        ctx.fillStyle="#8E7A93";
        ctx.font="bold 11px 'DM Sans','Noto Sans SC',sans-serif";
        ctx.textAlign="center";
        ctx.fillText(p.raw.date.slice(5), p.x, padT + plotH + 18);
      }
    });
  }

  /* 单指拖动平移 + 双指捏合缩放 + 滚轮缩放（与体重图一致） */
  let activePointers = [];
  let prevPinchDist = null;
  let dragging = false, startX = 0, dragMoved = false;

  function getDistance(p1, p2) {
    return Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
  }

  canvas.onpointerdown = e => {
    canvas.setPointerCapture(e.pointerId);
    activePointers.push(e);
    pokeScrollbar();
    if(activePointers.length === 1){
      dragging = true; startX = e.clientX; dragMoved = false;
    }
  };

  canvas.onpointermove = e => {
    const idx = activePointers.findIndex(p => p.pointerId === e.pointerId);
    if(idx >= 0) activePointers[idx] = e;

    if(activePointers.length === 2){
      /* 进入双指模式就放弃单击选中 */
      dragging = false; dragMoved = true;
      const dist = getDistance(activePointers[0], activePointers[1]);
      if(prevPinchDist){
        const factor = dist / prevPinchDist;
        poopUserStep = Math.max(15, Math.min(150, poopUserStep * factor));
        poopUserZoomed = true;
        pokeScrollbar();
        render();
      }
      prevPinchDist = dist;
    } else if(activePointers.length === 1 && dragging){
      const dx = e.clientX - startX;
      if(Math.abs(dx) > 3) dragMoved = true;
      offset -= dx;
      startX = e.clientX;
      pokeScrollbar();
      render();
    }
  };

  canvas.onpointerup = canvas.onpointercancel = e => {
    activePointers = activePointers.filter(p => p.pointerId !== e.pointerId);
    if(activePointers.length < 2) prevPinchDist = null;
    if(activePointers.length === 0){
      if(dragging){
        dragging = false;
        if(!dragMoved){
          const rect = canvas.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const clickedIdx = Math.round((clickX - padL + offset) / poopUserStep);
          if(clickedIdx >= 0 && clickedIdx < series.length){
            selectedIdx = clickedIdx;
            /* 同步选中日期到全局，供日历/其它图表跟进 */
            const newKey = series[clickedIdx].date;
            if (newKey !== selectedKey) {
              selectedKey = newKey;
              renderCalendar();
              renderTrendSummary();
            }
          }
        }
        render();
      }
    }
  };

  canvas.onwheel = e => {
    e.preventDefault();
    if(e.deltaY < 0) poopUserStep = Math.min(150, poopUserStep * 1.1);
    else poopUserStep = Math.max(15, poopUserStep * 0.9);
    poopUserZoomed = true;
    pokeScrollbar();
    render();
  };

  render();
}

/* ===================== 运动板块（橄榄黄绿→果绿渐变） ===================== */

/* 运动数据 & 图表参数：
   - 数据上限与选择器一致：最多 90 分钟
   - 视觉上限留出顶部空白，让 cap 天的数据点完整显示
   - 不显示左侧纵坐标文字，因此 padL 可以很小 */
const EXERCISE_DATA_CAP = 90;     /* 数据上限 */
const EXERCISE_AXIS_MAX = 95;     /* 视觉上限 */
const EXERCISE_AXIS_MIN = 0;      /* 视觉下限 */

function buildExerciseChartSeries(){
  const allKeys = Object.keys(data.days).sort();
  if(!allKeys.length) return [];

  const startD = new Date(allKeys[0]+"T00:00:00");
  const todayD = new Date(key(new Date())+"T00:00:00");
  const endD = todayD;

  let rawList = [];
  let curr = new Date(startD);
  while(curr <= endD){
    const k = key(curr);
    const dayData = data.days[k] || {};
    rawList.push({
      date: k,
      weight: dayData.weight ?? null,
      exercises: Array.isArray(dayData.exercises) ? dayData.exercises : []
    });
    curr.setDate(curr.getDate() + 1);
  }

  /* 去掉最前面还没有运动记录的日子，避免缩放时把空白也算进去（与体重/排便一致） */
  const firstExIdx = rawList.findIndex(d => d.exercises && d.exercises.length > 0);
  if(firstExIdx === -1) return [];
  let series = rawList.slice(firstExIdx);

  /* 跨 Tab 联动：用户在体重/排便/日历里选中的那一天如果落在 series 外面
     （最常见：那天还没有运动记录，被上面的 slice 砍掉了），
     把那天作为合成记录补到 series 开头，让运动 Tab 的"选中锚点"落在用户实际选中的那天，
     而不是被甩回 series 的最后一天。*/
  if (selectedKey &&
      !series.find(s => s.date === selectedKey) &&
      selectedKey < series[0].date) {
    const k = selectedKey;
    const dayData = data.days[k] || {};
    series = [{
      date: k,
      weight: dayData.weight ?? null,
      exercises: Array.isArray(dayData.exercises) ? dayData.exercises : []
    }, ...series];
  }

  return series;
}

function computeExerciseStats(series){
  if(!series.length) return {avgDaysPerWeek:null, avgMinPerDay:null, maxStreak:0};

  const totalDays = series.length;
  const exerciseDays = series.filter(d => d.exercises && d.exercises.length > 0).length;
  let totalMin = 0;
  series.forEach(d => {
    if (d.exercises && d.exercises.length){
      d.exercises.forEach(e => { totalMin += (e.minutes || 0); });
    }
  });

  const avgDaysPerWeek = totalDays ? Number((exerciseDays / totalDays * 7).toFixed(1)) : null;
  const avgMinPerDay = exerciseDays ? Math.round(totalMin / exerciseDays) : null;

  let maxStreak = 0, curStreak = 0;
  series.forEach(d => {
    if(d.exercises && d.exercises.length > 0){
      curStreak++;
      if(curStreak > maxStreak) maxStreak = curStreak;
    } else {
      curStreak = 0;
    }
  });

  return {avgDaysPerWeek, avgMinPerDay, maxStreak};
}

function dayExerciseMin(d){
  if(!d.exercises || !d.exercises.length) return null;
  const total = d.exercises.reduce((s,x)=> s + (x.minutes||0), 0);
  return total > 0 ? total : null;
}

let exerciseUserStep = 40;
let exerciseUserZoomed = false;

function drawExerciseChart(){
  const box = document.getElementById("exerciseChartBox");
  const canvas = document.getElementById("exerciseChart");
  const ctx = canvas.getContext("2d");
  if(!box || !canvas){ return; }

  const dpr = window.devicePixelRatio || 1;
  const W = box.clientWidth;
  const H = box.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const series = buildExerciseChartSeries();
  const scrollTrackEl = document.getElementById("exerciseChartScrollTrack");

  const stats = computeExerciseStats(series);
  document.getElementById("exerciseAvgDays").textContent = stats.avgDaysPerWeek != null ? stats.avgDaysPerWeek + " 天/周" : "—";
  document.getElementById("exerciseAvgMin").textContent = stats.avgMinPerDay != null ? stats.avgMinPerDay + " 分钟/天" : "—";
  document.getElementById("exerciseMaxStreak").textContent = stats.maxStreak ? stats.maxStreak + " 天" : "—";

  if(!series.length){
    if(scrollTrackEl) scrollTrackEl.style.visibility = "hidden";
    ctx.fillStyle="#8E7A93"; ctx.font="bold 13px 'Noto Sans SC',sans-serif"; ctx.textAlign="center";
    ctx.fillText("暂无数据", W/2, H/2);
    return;
  }

  /* 左边的纵坐标文字不显示，给的 padL 足够小即可 */
  const padL = 20, padR = 20, padT = 20, padB = 30;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  /* 纵坐标上限自适应：某天运动量超过默认上限（比如叠加多项运动到 120 分钟）时，
     按实际最大值向上取整到 10 的整数倍，并留一点顶部余量，避免数据点被裁掉 */
  const dataMaxMin = series.reduce((m, e) => {
    const v = dayExerciseMin(e);
    return v != null && v > m ? v : m;
  }, 0);
  const axisMax = Math.max(EXERCISE_AXIS_MAX, Math.ceil((dataMaxMin + 5) / 10) * 10);
  const max = axisMax, min = EXERCISE_AXIS_MIN, range = axisMax - EXERCISE_AXIS_MIN;
  const unitScale = plotH / range;
  const gridStep = 10;
  const gridLevels = Math.floor(max / gridStep);

  const exerciseColor = (getComputedStyle(document.documentElement).getPropertyValue('--pop-exercise-2') || '#9BD9A1').trim();
  const exerciseColorLight = (getComputedStyle(document.documentElement).getPropertyValue('--pop-exercise-1') || '#62C6A5').trim();

  const scrollTrack = document.getElementById("exerciseChartScrollTrack");
  const scrollThumb = document.getElementById("exerciseChartScrollThumb");
  let scrollbarFadeTimer = null;
  function pokeScrollbar(){
    if(!scrollTrack) return;
    scrollTrack.classList.add("active");
    clearTimeout(scrollbarFadeTimer);
    scrollbarFadeTimer = setTimeout(()=> scrollTrack.classList.remove("active"), 700);
  }
  function updateScrollbar(totalW, offset, maxOffset){
    if(!scrollTrack || !scrollThumb) return;
    if(totalW <= plotW){
      scrollTrack.style.visibility = "hidden";
      return;
    }
    scrollTrack.style.visibility = "visible";
    const thumbPct = Math.max(8, Math.min(100, (plotW / totalW) * 100));
    const scrollRatio = maxOffset > 0 ? offset / maxOffset : 0;
    scrollThumb.style.width = thumbPct + "%";
    scrollThumb.style.left = (scrollRatio * (100 - thumbPct)) + "%";
  }

  const EXERCISE_DEFAULT_VISIBLE_DAYS = 10;
  if(!exerciseUserZoomed){
    exerciseUserStep = Math.max(15, Math.min(150, plotW / (Math.min(EXERCISE_DEFAULT_VISIBLE_DAYS, series.length) - 1 || 1)));
  }

  let offset = Math.max(0, (series.length - 1) * exerciseUserStep - plotW);
  let selectedIdx = series.length - 1;
  /* 进入运动 Tab 时尝试把 selectedKey 同步到当前 series 对应的那一天 */
  if (selectedKey) {
    const foundIdx = series.findIndex(s => s.date === selectedKey);
    if (foundIdx >= 0) selectedIdx = foundIdx;
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    const totalW = (series.length - 1) * exerciseUserStep;
    const maxOffset = Math.max(0, totalW - plotW);
    offset = Math.max(0, Math.min(offset, maxOffset));
    updateScrollbar(totalW, offset, maxOffset);

    /* 横向网格线：每 10 分钟一道，给"0、10、20、...、90"参考线；
       左侧的文字标签刻意不画，让整个图表更干净 */
    ctx.strokeStyle = "rgba(140, 120, 150, 0.16)";
    ctx.lineWidth = 1;
    for(let lvl=0; lvl<=gridLevels; lvl++){
      const y = padT + (max - lvl*gridStep)/range * plotH;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    }

    ctx.save();

      const v = min != null ? min : 0;
      return {
        x: padL + i*exerciseUserStep - offset,

        raw: e,
        minutes: min
      };
    });

    /* 折线穿过所有点（包括未运动的日子），形成下拉到 0 的视觉效果 */
    if(pts.length > 1){

    pts.forEach((p) => {
      if(p.x >= padL - 10 && p.x <= W - padR + 10){

          ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
          ctx.strokeStyle="#BCA3C3";
          ctx.lineWidth=2;
          ctx.fillStyle="#FFFFFF";
          ctx.fill();
          ctx.stroke();

    if(selectedIdx >= 0 && pts[selectedIdx]){

        ctx.strokeStyle="rgba(98, 198, 165, 0.4)";

        ctx.beginPath(); ctx.moveTo(p.x, padT); ctx.lineTo(p.x, padT+plotH); ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(p.x, p.y, 7, 0, Math.PI*2);
        ctx.fillStyle="#FFD166";
        ctx.fill();
        ctx.lineWidth=3;
        ctx.strokeStyle=exerciseColor;
        ctx.stroke();
      }
    }

    ctx.restore();

    /* 日期标签画在图表下方，不受裁剪影响 */
    const labelInterval = Math.max(1, Math.round(60 / exerciseUserStep));
    pts.forEach((p, idx) => {

      }
    });
  }

  /* 单指拖动平移 + 双指捏合缩放 + 滚轮缩放（与排便/体重图一致） */
  let activePointers = [];
  let prevPinchDist = null;
  let dragging = false, startX = 0, dragMoved = false;

  function getDistance(p1, p2) {
    return Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
  }

  canvas.onpointerdown = e => {
    canvas.setPointerCapture(e.pointerId);
    activePointers.push(e);
    pokeScrollbar();
    if(activePointers.length === 1){
      dragging = true; startX = e.clientX; dragMoved = false;
    }
  };

  canvas.onpointermove = e => {
    const idx = activePointers.findIndex(p => p.pointerId === e.pointerId);
    if(idx >= 0) activePointers[idx] = e;

    if(activePointers.length === 2){
      dragging = false; dragMoved = true;
      const dist = getDistance(activePointers[0], activePointers[1]);
      if(prevPinchDist){
        const factor = dist / prevPinchDist;
        exerciseUserStep = Math.max(15, Math.min(150, exerciseUserStep * factor));
        exerciseUserZoomed = true;
        pokeScrollbar();
        render();
      }
      prevPinchDist = dist;
    } else if(activePointers.length === 1 && dragging){
      const dx = e.clientX - startX;
      if(Math.abs(dx) > 3) dragMoved = true;
      offset -= dx;
      startX = e.clientX;
      pokeScrollbar();
      render();
    }
  };

  canvas.onpointerup = canvas.onpointercancel = e => {
    activePointers = activePointers.filter(p => p.pointerId !== e.pointerId);
    if(activePointers.length < 2) prevPinchDist = null;
    if(activePointers.length === 0){
      if(dragging){
        dragging = false;
        if(!dragMoved){
          const rect = canvas.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const clickedIdx = Math.round((clickX - padL + offset) / exerciseUserStep);
          if(clickedIdx >= 0 && clickedIdx < series.length){
            selectedIdx = clickedIdx;
            /* 同步选中日期到全局，供日历/其它图表跟进 */
            const newKey = series[clickedIdx].date;
            if (newKey !== selectedKey) {
              selectedKey = newKey;
              renderCalendar();
              renderTrendSummary();
            }
          }
        }
        render();
      }
    }
  };

  canvas.onwheel = e => {
    e.preventDefault();
    if(e.deltaY < 0) exerciseUserStep = Math.min(150, exerciseUserStep * 1.1);
    else exerciseUserStep = Math.max(15, exerciseUserStep * 0.9);
    exerciseUserZoomed = true;
    pokeScrollbar();
    render();
  };

  render();
}

const PHASE_LABEL = {

const PHASE_ADVICE = {

function buildTodayTip(){
  const todayKey = key(new Date());
  const todayData = data.days[todayKey] || {};
  const starts = Object.keys(data.days).filter(k => data.days[k].period === "start").sort();
  const parts = [];

  /* ===== 1. 周期阶段（仅 ≥2 次经期记录才显示）=====
     根据"距离上次经期第一天的天数"按周期长度分桶：
       - day 0-4                         → period 姨妈期
       - day 5  ~ avgCycle-19            → follicular 卵泡期
       - day avgCycle-18 ~ avgCycle-12    → ovulation 排卵期（拓宽为7天，覆盖排卵前后浮肿胀痛的体感范围）
       - day avgCycle-11 ~                → luteal 黄体期
     周期长度未到 → 跟最后一天落点一致，黄体期 */
  if(starts.length >= 2){
    const avgCycle = getAvgCycleLength();
    const lastStartDate = new Date(starts.at(-1) + "T00:00:00");
    const todayDate = new Date(todayKey + "T00:00:00");
    const daysSince = Math.round((todayDate - lastStartDate) / 86400000);
    if(daysSince >= 0){
      let phase = null;
      let phaseStart = 0;
      const ovulationStart = Math.max(5, avgCycle - 18);
      const ovulationEnd = Math.max(5, avgCycle - 12);
      if(daysSince < 5){ phase = "period"; phaseStart = 0; }
      else if(daysSince < ovulationStart){ phase = "follicular"; phaseStart = 5; }
      else if(daysSince <= ovulationEnd){ phase = "ovulation"; phaseStart = ovulationStart; }
      else { phase = "luteal"; phaseStart = ovulationEnd + 1; }
      const dayInPhase = daysSince - phaseStart + 1;
      parts.push({ text: `今天是${PHASE_LABEL[phase]}第${dayInPhase}天，${PHASE_ADVICE[phase][Math.floor(Math.random()*PHASE_ADVICE[phase].length)]}`, punct: "。" });
    }
  }

  /* ===== 2. 体重情况：改成严格"整整两天前"才比较，
     避免断记好几天后被误判成"这两天体重变化"====== */
  const sortedW = Object.keys(data.days).filter(k => data.days[k].weight != null).sort();
  if(sortedW.length){
    const latestK = sortedW.at(-1);
    const latestW = data.days[latestK].weight;
    const twoAgoDate = new Date(latestK+"T00:00:00");
    twoAgoDate.setDate(twoAgoDate.getDate() - 2);
    const twoAgoKey = key(twoAgoDate);
    if(data.days[twoAgoKey] && data.days[twoAgoKey].weight != null){
      const pastW = data.days[twoAgoKey].weight;
      const diff = Number((latestW - pastW).toFixed(1));
      if(diff > 0) parts.push({ text: `这两天体重上升了${diff}kg`, punct: "，" });
      else if(diff < 0) parts.push({ text: `这两天体重下降了${Math.abs(diff)}kg`, punct: "，" });
      else parts.push({ text: `这两天体重很稳定`, punct: "，" });
    }
  }

  /* ===== 3. 排便 / 便秘情况 ===== */
  const poopSeries = buildPoopChartSeries();
  if(poopSeries.length){
    const lastHasPoop = poopSeries.at(-1).poops && poopSeries.at(-1).poops.length > 0;
    let streak = 0;
    for(let i=poopSeries.length-1; i>=0; i--){
      const has = poopSeries[i].poops && poopSeries[i].poops.length > 0;
      if(has === lastHasPoop) streak++; else break;
    }
    parts.push({ text: lastHasPoop ? `已连续排便${streak}天` : `已经${streak}天没有排便`, punct: "。" });
  }

  /* ===== 4. 鼓励语打底（必然是数组最后一项）===== */
  const encourages = [
    "今天也要元气满满哦",
    "照顾好自己，慢慢来",
    "身体的每一点变化都值得被记录",
    "坚持记录，你已经很棒啦",
    "多喝水，肠胃会感谢你的",
    "别太苛求自己，稳稳前进就很好",
    "早点休息，身体会记得你的好",
    "今天也辛苦啦，记得犒赏一下自己",
    "小小的坚持，会带来大大的改变",
    "深呼吸，一切都在慢慢变好",
    "你已经做得很好了",
    "累了就歇一会儿，别硬撑",
    "你的努力，身体都记得",
    "今天也是照顾好自己的一天",
    "偶尔偷懒也没关系，明天继续就好",
    "给自己一个大大的拥抱",
    "慢慢来，一切都来得及"
  ];
  parts.push({ text: encourages[Math.floor(Math.random()*encourages.length)], punct: "" });

  /* 每一项自带该用的标点（不再依赖数组下标猜内容类型，避免某项缺失时
     后面几项集体错位、导致结尾出现"逗号/句号紧贴～"的问题）；
     最后一项固定是鼓励语，强制清空标点，只留最终的"～"。 */
  let tip = "";
  parts.forEach((item, i) => {
    const isLast = (i === parts.length - 1);
    tip += item.text + (isLast ? "" : item.punct);
  });
  return tip + "～";
}

/* 把当前所有记录整理成给 AI 看的摘要文本 */
function buildAIDataSummary(){
  const todayKey = key(new Date());
  const allKeys = Object.keys(data.days).sort();
  if(!allKeys.length) return null;

  const lines = [];

  // 周期
  const starts = allKeys.filter(k => data.days[k].period === "start");
  if(starts.length >= 2){
    const avgPrecise = getAvgCycleLengthPrecise();
    const avgCycle = getAvgCycleLength();
    const lastStart = starts.at(-1);
    const daysSince = Math.round((new Date(todayKey+"T00:00:00") - new Date(lastStart+"T00:00:00")) / 86400000);
    lines.push(`【月经周期】共记录 ${starts.length} 次经期开始，平均周期 ${avgPrecise} 天；最近一次经期开始于 ${lastStart}，距今 ${daysSince} 天。`);
    const recentDiffs = [];
    for(let i = Math.max(1, starts.length - 6); i < starts.length; i++){
      recentDiffs.push(Math.round((new Date(starts[i]+"T00:00:00") - new Date(starts[i-1]+"T00:00:00")) / 86400000));
    }
    if(recentDiffs.length) lines.push(`最近几次周期长度（天）：${recentDiffs.join("、")}。`);
    // 当前周期阶段（与今日提示同一套分桶逻辑），方便 AI 针对性给出情绪/身体感受相关的建议
    if(daysSince >= 0){
      let phase = null, phaseStart = 0;
      const ovulationStart = Math.max(5, avgCycle - 18);
      const ovulationEnd = Math.max(5, avgCycle - 12);
      if(daysSince < 5){ phase = "period"; phaseStart = 0; }
      else if(daysSince < ovulationStart){ phase = "follicular"; phaseStart = 5; }
      else if(daysSince <= ovulationEnd){ phase = "ovulation"; phaseStart = ovulationStart; }
      else { phase = "luteal"; phaseStart = ovulationEnd + 1; }
      const dayInPhase = daysSince - phaseStart + 1;
      lines.push(`【当前周期阶段】今天正处于${PHASE_LABEL[phase]}第 ${dayInPhase} 天。`);
    }
  } else if(starts.length === 1){
    lines.push(`【月经周期】目前只记录了 1 次经期开始（${starts[0]}），周期数据还不够计算规律。`);
  } else {
    lines.push(`【月经周期】暂无经期记录。`);
  }

  // 体重
  const weightKeys = allKeys.filter(k => data.days[k].weight != null);
  if(weightKeys.length){
    const latestK = weightKeys.at(-1);
    const latestW = data.days[latestK].weight;
    let line = `【体重】最新记录 ${latestW}kg（${latestK}），目标体重 ${data.targetWeight || 50}kg。`;
    const d30 = new Date(latestK+"T00:00:00"); d30.setDate(d30.getDate() - 30);
    const pastK = weightKeys.filter(k => new Date(k+"T00:00:00") <= d30).at(-1);
    if(pastK){
      const diff = Number((latestW - data.days[pastK].weight).toFixed(1));
      line += ` 近30天变化：${diff > 0 ? "+" : ""}${diff}kg。`;
    }
    lines.push(line);
  } else {
    lines.push(`【体重】暂无记录。`);
  }

  // 排便
  const poopSeries = buildPoopChartSeries();
  if(poopSeries.length){
    const s = computePoopStats(poopSeries);
    lines.push(`【排便】近期平均每周约 ${s.avgPerWeek ?? "—"} 次，最长连续排便 ${s.maxStreak} 天，最长连续未排便（便秘）${s.maxGap} 天。`);
  } else {
    lines.push(`【排便】暂无记录。`);
  }

  // 运动
  const exSeries = buildExerciseChartSeries();
  if(exSeries.length){
    const s = computeExerciseStats(exSeries);
    lines.push(`【运动】平均每周运动 ${s.avgDaysPerWeek ?? "—"} 天，运动日平均 ${s.avgMinPerDay ?? "—"} 分钟，最长连续运动 ${s.maxStreak} 天。`);
  } else {
    lines.push(`【运动】暂无记录。`);
  }

  return lines.join("\n");
}
