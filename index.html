<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9f8">
<title>Piiisuke — Personal Body Log</title>
<style>
:root{
  --bg-gradient: linear-gradient(170deg, #f7f9f8 0%, #eef2f0 100%);
  --card-bg: rgba(255, 255, 255, 0.88);
  --card-border: rgba(225, 232, 228, 0.8);
  --text-main: #2d3436;
  --text-muted: #889290;
  
  --rose: #e8889a;            /* 统一柔粉色 */
  --rose-bg: rgba(232, 136, 154, 0.20);
  --purple: #9f86c0;
  --purple-bg: rgba(159, 134, 192, 0.20);
  --brown: #b07d5b;
  
  --chart-line: #e8889a;      /* 趋势线统一使用粉色 */
  --diff-down: #48bb78;
  --diff-up: #e53e3e;
  --diff-zero: #a0aab0;

  --shadow: 0 10px 30px rgba(160, 175, 170, 0.12);
  --radius: 20px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background: var(--bg-gradient);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Noto Sans SC", sans-serif;
  letter-spacing: .01em;
  min-height: 100vh;
}
.wrap{max-width:600px;margin:auto;padding:20px 16px 80px}

/* Header */
.brand{display:flex;align-items:center;gap:12px;margin:8px 4px 16px}
.brand-mark{
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;
  background:#2d3436;color:#fff;
  font-size:16px;font-weight:800;
}
h1{font-size:20px;line-height:1;margin:0;font-weight:700;color:#2d3436}
.sub{color:var(--text-muted);font-size:10px;letter-spacing:.12em;margin:3px 0 0}

/* Top Navigation Tabs */
.nav-tabs{
  display:flex;
  background:rgba(230, 236, 233, 0.6);
  padding:4px;
  border-radius:14px;
  margin-bottom:16px;
  gap:4px;
}
.tab-btn{
  flex:1;
  border:0;
  background:transparent;
  padding:8px 0;
  font-size:13px;
  font-weight:600;
  color:var(--text-muted);
  border-radius:10px;
  cursor:pointer;
  transition:all .2s ease;
}
.tab-btn.active{
  background:#ffffff;
  color:var(--text-main);
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

/* Card Style */
.card{
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 20px 18px;
  box-shadow: var(--shadow);
}
.tab-content{display:none}
.tab-content.active{display:block}

/* Toolbar & Legend */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.toolbar button{
  width:32px;height:32px;background:#ffffff;color:#555;
  border:1px solid #e2e8e5;border-radius:50%;font-size:16px;
  cursor:pointer;display:grid;place-items:center;
}
.month{font-weight:700;font-size:16px;color:#2d3436}
.legend{display:flex;gap:14px;color:var(--text-muted);font-size:11px;margin-bottom:14px;justify-content:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend span:before{content:"";width:8px;height:8px;border-radius:50%;display:inline-block}
.legend .leg-period:before{background:var(--rose)}
.legend .leg-ovulation:before{background:var(--purple)}
.legend .leg-poop:before{background:var(--brown)}

/* Calendar Grid */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;position:relative}
.dow{text-align:center;color:#a0aab0;font-size:11px;font-weight:600;padding:4px 0}
.day-cell{
  position:relative;
  height:62px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:4px;
  cursor:pointer;
  user-select:none;
}

.day-bg-band{
  position:absolute;
  top:2px;bottom:2px;left:0;right:0;
  z-index:1;
  pointer-events:none;
}
.day-bg-band.period{background:var(--rose-bg)}
.day-bg-band.ovulation{background:var(--purple-bg)}

.day-bg-band.pred{opacity:0.65;}
.day-bg-band.pred.period{border:1px dashed var(--rose);background:rgba(232, 136, 154, 0.1)}
.day-bg-band.pred.ovulation{border:1px dashed var(--purple);background:rgba(159, 134, 192, 0.1)}

.day-bg-band.band-start{border-top-left-radius:10px;border-bottom-left-radius:10px;left:2px}
.day-bg-band.band-end{border-top-right-radius:10px;border-bottom-right-radius:10px;right:2px}

.num-wrap{
  position:relative;
  z-index:2;
  width:24px;
  height:24px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:600;
  color:#4a5568;
}
.day-cell.today .num-wrap{background:#2d3436;color:#fff}
.day-cell.other-month{opacity:0.25}

.cell-info{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-top:2px;
  line-height:1.1;
}
.weight-tag{
  font-size:9px;
  color:#5a6578;
  font-weight:500;
  transform:scale(0.9);
  white-space:nowrap;
}
.weight-diff{font-size:8px;margin-left:1px}
.weight-diff.down{color:var(--diff-down)}
.weight-diff.up{color:var(--diff-up)}
.weight-diff.zero{color:var(--diff-zero)}

.poop-dots{font-size:7px;line-height:1;color:var(--brown);letter-spacing:-1px;margin-top:1px}

/* Top Detail Card on Chart */
.chart-top-card{
  background:#ffffff;
  border:1px solid #e2e8e5;
  border-radius:14px;
  padding:12px 16px;
  margin-bottom:14px;
  min-height:68px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:4px;
}
.top-card-row1{display:flex;justify-content:space-between;align-items:baseline}
.top-card-row2{display:flex;gap:12px;font-size:11px;color:var(--text-muted)}

.chart-top-card .date-val{font-size:14px;font-weight:700;color:#2d3436}
.chart-top-card .weight-val{font-size:17px;font-weight:700;color:var(--rose)}
.chart-top-card .diff-val{font-size:12px;margin-left:4px;font-weight:600}

.tag-phase{
  display:inline-block;
  padding:1px 6px;
  border-radius:4px;
  font-size:10px;
  font-weight:600;
}
.tag-phase.period{background:var(--rose-bg);color:var(--rose)}
.tag-phase.ovulation{background:var(--purple-bg);color:var(--purple)}

.chart-container{width:100%;height:230px;position:relative;touch-action:none}
canvas{width:100%;height:100%;display:block}

.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:#f8faf9;border:1px solid #eaefe2;border-radius:12px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:15px;color:#2d3436;margin-top:2px}
.stat span{font-size:10px;color:var(--text-muted)}

/* Cycle Prediction List */
.notice{background:#f8faf9;border:1px solid #eae2e5;border-radius:14px;padding:14px;font-size:13px;line-height:1.6;color:#4a5568}
.prediction-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
  max-height:260px;
  overflow-y:auto;
  padding-right:2px;
}
.pred-item{
  background:#ffffff;
  border:1px solid #eef2f0;
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
  display:flex;
  justify-content:space-between;
}
.pred-item .m-label{color:var(--text-muted)}
.pred-item .d-label{color:var(--rose);font-weight:600;font-family:monospace}

/* Backup */
.backup-box{margin-top:20px}
.backup{display:flex;gap:10px}
.backup button{
  flex:1;padding:10px;border-radius:12px;
  background:#ffffff;border:1px solid #e2e8e5;
  color:#4a5568;font-size:12px;font-weight:500;
  cursor:pointer;
}

/* Drawer / Modal Sheet */
.drawer-backdrop{
  position:fixed;inset:0;background:rgba(45, 52, 54, 0.35);backdrop-filter:blur(4px);
  z-index:100;display:none;align-items:flex-end;
}
.drawer-backdrop.open{display:flex}
.drawer{
  width:100%;max-width:600px;margin:auto;background:#ffffff;
  border-radius:22px 22px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,0.1);max-height:85vh;overflow-y:auto;
  animation:slideUp .2s cubic-bezier(0.16,1,0.3,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.drawer-handle{width:36px;height:4px;border-radius:99px;background:#e2e8e5;margin:12px auto 4px}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 14px;border-bottom:1px solid #f0f4f2}
.drawer-head h2{margin:0;font-size:17px;color:#2d3436}
.close-btn{width:26px;height:26px;border-radius:50%;background:#f0f4f2;color:#777;border:0;font-size:14px;cursor:pointer;display:grid;place-items:center}
.drawer-body{padding:16px 20px 30px}

.field-group{margin-bottom:14px}
.field-group label{display:block;color:var(--text-muted);font-size:12px;margin-bottom:6px}
.field-group input,.field-group select{
  width:100%;border:1px solid #e2e8e5;border-radius:10px;padding:10px 12px;
  background:#f8faf9;color:#2d3436;font-size:14px;outline:none;
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:16px}
.btn-primary{background:#2d3436;color:#ffffff;border:0;padding:11px;border-radius:10px;font-weight:600;flex:1;cursor:pointer}
.btn-danger{background:#fff0f2;color:var(--rose);border:1px solid #fce4e8;padding:11px;border-radius:10px;cursor:pointer;font-weight:600}
.poop-list{margin-top:14px;border-top:1px solid #f0f4f2;padding-top:12px}
.poop-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px;border-bottom:1px solid #f5f8f6}
.del-btn{background:none;border:0;color:#a0aab0;font-size:12px;cursor:pointer}

.footer{color:#a0aab0;font-size:10px;text-align:center;margin-top:24px}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <span class="brand-mark">P</span>
    <div>
      <h1>Piiisuke</h1>
      <p class="sub">BODY & CYCLE TRACKER</p>
    </div>
  </div>

  <!-- Top Navigation Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('calTab')">日历视图</button>
    <button class="tab-btn" onclick="switchTab('chartTab')">体重趋势</button>
    <button class="tab-btn" onclick="switchTab('predTab')">生理期预测</button>
  </div>

  <!-- Tab 1: 日历视图 -->
  <div id="calTab" class="tab-content active">
    <div class="card">
      <div class="toolbar">
        <button onclick="changeMonth(-1)">‹</button>
        <div class="month" id="monthTitle"></div>
        <button onclick="changeMonth(1)">›</button>
      </div>
      <div class="legend">
        <span class="leg-period">姨妈期</span>
        <span class="leg-ovulation">排卵期</span>
        <span class="leg-poop">排便</span>
      </div>
      <div class="cal-grid" id="calendar"></div>
    </div>
  </div>

  <!-- Tab 2: 体重趋势模块 -->
  <div id="chartTab" class="tab-content">
    <div class="card">
      <!-- 顶部交互数据面板 -->
      <div class="chart-top-card">
        <div class="top-card-row1">
          <div class="date-val" id="topCardDate">请滑动或点击查看</div>
          <div>
            <span class="weight-val" id="topCardWeight">— kg</span>
            <span class="diff-val" id="topCardDiff"></span>
          </div>
        </div>
        <div class="top-card-row2">
          <div id="topCardPhase"></div>
          <div id="topCardPoop"></div>
        </div>
      </div>

      <!-- 图表画布 (支持触控滑动 & 双指聚拢缩放) -->
      <div class="chart-container" id="chartBox">
        <canvas id="chart"></canvas>
      </div>

      <!-- 底部统计数据 -->
      <div class="statgrid">
        <div class="stat"><span id="avgW">—</span><b>平均</b></div>
        <div class="stat"><span id="minW">—</span><b>最低</b></div>
        <div class="stat"><span id="maxW">—</span><b>最高</b></div>
      </div>
    </div>
  </div>

  <!-- Tab 3: 未来 12 个月预测 -->
  <div id="predTab" class="tab-content">
    <div class="card">
      <div class="notice">
        <div id="predSummary">正在分析周期历史...</div>
        <div class="prediction-grid" id="predictionList"></div>
      </div>
    </div>
  </div>

  <!-- 数据备份 -->
  <div class="backup-box">
    <div class="backup">
      <button onclick="exportData()">导出 JSON 数据</button>
      <button onclick="document.getElementById('file').click()">导入 JSON 数据</button>
      <input id="file" type="file" accept=".json" hidden onchange="importData(event)">
    </div>
  </div>

  <div class="footer">仅供个人数据记录与健康观察，不替代医疗诊断。</div>
</div>

<!-- 录入抽屉 Modal -->
<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer(event)">
  <div class="drawer" onclick="event.stopPropagation()">
    <div class="drawer-handle"></div>
    <div class="drawer-head">
      <h2 id="drawerDate">2026-08-14</h2>
      <button class="close-btn" onclick="hideDrawer()">✕</button>
    </div>
    <div class="drawer-body">
      <div class="grid-2">
        <div class="field-group">
          <label>当日体重 (kg)</label>
          <input id="weight" type="number" step="0.1" placeholder="例如 52.3">
        </div>
        <div class="field-group">
          <label>姨妈状态</label>
          <select id="period">
            <option value="">无</option>
            <option value="start">姨妈第一天</option>
            <option value="on">姨妈期</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" onclick="saveDaily()">保存记录</button>
        <button class="btn-danger" onclick="clearDaily()">清空当天</button>
      </div>

      <div class="poop-list">
        <label style="color:var(--text-muted);font-size:12px;display:block;margin-bottom:8px">排便记录</label>
        <div class="grid-2">
          <div class="field-group">
            <select id="poopHour"></select>
          </div>
          <div class="field-group">
            <select id="poopSize">
              <option value="小">小 (●)</option>
              <option value="小偏中">小偏中 (●○)</option>
              <option value="中">中 (●●)</option>
              <option value="中偏大">中偏大 (●●○)</option>
              <option value="大">大 (●●●)</option>
            </select>
          </div>
        </div>
        <div class="field-group">
          <input id="poopNote" placeholder="备注（如：开塞露、硬）">
        </div>
        <button class="btn-primary" style="width:100%;padding:8px;font-size:13px;background:#f0f4f2;color:#2d3436" onclick="addPoop()">添加一次排便</button>
        <div id="poopContainer"></div>
      </div>
    </div>
  </div>
</div>

<script>
const KEY="bodyDiaryV3";
let data=JSON.parse(localStorage.getItem(KEY)||'{"days":{}}');
let selectedKey = "";
let viewDate = new Date();

function pad(n){return String(n).padStart(2,"0")}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function formatSlash(d){return d.getFullYear()+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate())}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function dayObj(k){return data.days[k] ||= {poops:[]}}

function switchTab(tabId){
  document.querySelectorAll('.tab-btn').forEach((btn, idx)=>{
    btn.classList.toggle('active', ['calTab','chartTab','predTab'][idx] === tabId);
  });
  document.querySelectorAll('.tab-content').forEach(el=>{
    el.classList.toggle('active', el.id === tabId);
  });
  if(tabId === 'chartTab') drawChart();
}

function sizeToDots(size){
  switch(size){
    case "小": return "●";
    case "小偏中": return "●○";
    case "中": return "●●";
    case "中偏大": return "●●○";
    case "大": return "●●●";
    default: return "●";
  }
}

function sizeRank(size){
  const ranks = {"小":1, "小偏中":2, "中":3, "中偏大":4, "大":5};
  return ranks[size] || 1;
}

function getAvgCycleLength(){
  const starts = Object.keys(data.days).filter(k=>data.days[k].period==="start").sort();
  if(starts.length < 2) return 28;
  let diffs = [];
  for(let i=1; i<starts.length; i++){
    diffs.push((new Date(starts[i]) - new Date(starts[i-1])) / 86400000);
  }
  return Math.round(diffs.reduce((a,b)=>a+b,0) / diffs.length);
}

// 推算周期 (姨妈期/排卵期)
function computeCyclePhases(){
  const phases = {};
  const starts = Object.keys(data.days).filter(k=>data.days[k].period==="start").sort();
  const avgCycle = getAvgCycleLength();

  if(!starts.length) return phases;

  starts.forEach((sKey, idx) => {
    const sDate = new Date(sKey+"T00:00:00");
    const nextSDate = starts[idx+1] ? new Date(starts[idx+1]+"T00:00:00") : new Date(sDate.getTime() + avgCycle*86400000);
    const cycleDays = Math.round((nextSDate - sDate) / 86400000);
    
    for(let i=0; i<cycleDays; i++){
      const curr = new Date(sDate);
      curr.setDate(curr.getDate() + i);
      const k = key(curr);

      let p = null;
      if(i < 5){
        p = "period";
      } else if(i >= cycleDays - 19 && i <= cycleDays - 13){
        p = "ovulation";
      }
      if(p) phases[k] = { phase: p, isPred: false };
    }
  });

  let lastStart = new Date(starts.at(-1)+"T00:00:00");
  for(let m=1; m<=12; m++){
    let pStart = new Date(lastStart);
    pStart.setDate(pStart.getDate() + avgCycle * m);
    
    for(let i=0; i<avgCycle; i++){
      const curr = new Date(pStart);
      curr.setDate(curr.getDate() + i);
      const k = key(curr);

      if(phases[k] && !phases[k].isPred) continue;

      let p = null;
      if(i < 5){
        p = "period";
      } else if(i >= avgCycle - 19 && i <= avgCycle - 13){
        p = "ovulation";
      }
      if(p) phases[k] = { phase: p, isPred: true };
    }
  }

  return phases;
}

// 体重相较上一有记录日期的增减
function computeWeightDifferences(){
  const sortedDates = Object.keys(data.days)
    .filter(k => data.days[k].weight != null)
    .sort();
  
  const diffs = {};
  for(let i=0; i<sortedDates.length; i++){
    const k = sortedDates[i];
    const currW = data.days[k].weight;
    if(i === 0){
      diffs[k] = null;
    } else {
      const prevW = data.days[sortedDates[i-1]].weight;
      const diff = currW - prevW;
      diffs[k] = Number(diff.toFixed(1));
    }
  }
  return diffs;
}

function init(){
  const hSel = document.getElementById("poopHour");
  hSel.innerHTML = "";
  for(let h=0;h<24;h++) hSel.innerHTML+=`<option value="${h}">${h}:00</option>`;
  
  const today = new Date();
  viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
  renderCalendar();
  drawChart();
  prediction();
}

function changeMonth(n){
  viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+n, 1);
  renderCalendar();
}

function renderCalendar(){
  const y = viewDate.getFullYear(), m = viewDate.getMonth();
  document.getElementById("monthTitle").textContent = `${y}年 ${m+1}月`;
  
  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  const todayStr = key(new Date());
  
  const phases = computeCyclePhases();
  const weightDiffs = computeWeightDifferences();

  let html = ["日","一","二","三","四","五","六"].map(x=>`<div class="dow">${x}</div>`).join("");
  
  for(let i=0; i<first.getDay(); i++){
    html += `<div class="day-cell other-month"></div>`;
  }

  for(let d=1; d<=last.getDate(); d++){
    const dt = new Date(y, m, d);
    const k = key(dt);
    const dayData = data.days[k] || {};
    const phaseInfo = phases[k] || {};
    
    let phaseType = phaseInfo.phase;
    if(dayData.period === "start" || dayData.period === "on") phaseType = "period";

    const isPred = phaseInfo.isPred;

    const prevKey = key(new Date(y, m, d-1));
    const nextKey = key(new Date(y, m, d+1));
    const prevPhase = (phases[prevKey]||{}).phase;
    const nextPhase = (phases[nextKey]||{}).phase;
    
    let bandClasses = phaseType ? ` ${phaseType}` : '';
    if(isPred) bandClasses += " pred";
    if(prevPhase !== phaseType) bandClasses += " band-start";
    if(nextPhase !== phaseType) bandClasses += " band-end";

    // 体重差值
    let weightHtml = "";
    if(dayData.weight != null){
      const diffVal = weightDiffs[k];
      let diffStr = "";
      if(diffVal != null){
        if(diffVal === 0){
          diffStr = `<span class="weight-diff zero">(±0)</span>`;
        } else {
          const sign = diffVal > 0 ? "+" : "";
          const cls = diffVal > 0 ? "up" : "down";
          diffStr = `<span class="weight-diff ${cls}">(${sign}${diffVal})</span>`;
        }
      }
      weightHtml = `<div class="weight-tag">${dayData.weight}${diffStr}</div>`;
    }

    // 排便
    let poopHtml = "";
    if(dayData.poops && dayData.poops.length){
      let maxPoop = dayData.poops.reduce((prev, curr) => sizeRank(curr.size) > sizeRank(prev.size) ? curr : prev, dayData.poops[0]);
      poopHtml = `<div class="poop-dots">${sizeToDots(maxPoop.size)}</div>`;
    }

    const isToday = k === todayStr;

    html += `
      <div class="day-cell ${isToday?'today':''}" onclick="openDrawer('${k}')">
        ${phaseType ? `<div class="day-bg-band ${bandClasses}"></div>` : ''}
        <div class="num-wrap">${d}</div>
        <div class="cell-info">
          ${weightHtml}
          ${poopHtml}
        </div>
      </div>
    `;
  }
  document.getElementById("calendar").innerHTML = html;
}

/* 抽屉 Modal */
function openDrawer(k){
  selectedKey = k;
  document.getElementById("drawerDate").textContent = k;
  const dayData = data.days[k] || {};
  
  document.getElementById("weight").value = dayData.weight ?? "";
  document.getElementById("period").value = dayData.period || "";
  
  renderPoops();
  document.getElementById("drawerBackdrop").classList.add("open");
}

function hideDrawer(){
  document.getElementById("drawerBackdrop").classList.remove("open");
}

function closeDrawer(e){
  if(e.target === document.getElementById("drawerBackdrop")) hideDrawer();
}

function saveDaily(){
  const x = dayObj(selectedKey);
  const w = document.getElementById("weight").value;
  x.weight = w === "" ? null : Number(w);
  if(x.weight === null) delete x.weight;
  
  x.period = document.getElementById("period").value;
  if(!x.period) delete x.period;

  save();
  renderCalendar();
  drawChart();
  prediction();
  hideDrawer();
}

function clearDaily(){
  if(confirm("确定清空当天的记录吗？")){
    delete data.days[selectedKey];
    save();
    renderCalendar();
    drawChart();
    prediction();
    hideDrawer();
  }
}

function addPoop(){
  const x = dayObj(selectedKey);
  x.poops ||= [];
  x.poops.push({
    hour: Number(document.getElementById("poopHour").value),
    size: document.getElementById("poopSize").value,
    note: document.getElementById("poopNote").value.trim()
  });
  x.poops.sort((a,b)=>a.hour-b.hour);
  document.getElementById("poopNote").value="";
  save();
  renderCalendar();
  renderPoops();
}

function removePoop(i){
  data.days[selectedKey].poops.splice(i,1);
  save();
  renderCalendar();
  renderPoops();
}

function renderPoops(){
  const p = (data.days[selectedKey]||{}).poops || [];
  const container = document.getElementById("poopContainer");
  if(!p.length){
    container.innerHTML = `<div style="color:var(--text-muted);font-size:12px;padding:8px 0">无排便记录</div>`;
    return;
  }
  container.innerHTML = p.map((x,i)=>`
    <div class="poop-item">
      <span>${x.hour}:00 · ${x.size} [${sizeToDots(x.size)}] ${x.note?` (${x.note})`:''}</span>
      <button class="del-btn" onclick="removePoop(${i})">删除</button>
    </div>
  `).join("");
}

/* 构建连续按日序列 */
function buildChartSeries(){
  const allKeys = Object.keys(data.days).sort();
  if(!allKeys.length) return [];

  const startD = new Date(allKeys[0]+"T00:00:00");
  const endD = new Date(allKeys.at(-1)+"T00:00:00");
  
  let rawList = [];
  let curr = new Date(startD);

  const weightDiffs = computeWeightDifferences();
  const phases = computeCyclePhases();

  while(curr <= endD){
    const k = key(curr);
    const dayData = data.days[k] || {};
    
    let phaseText = "";
    if(dayData.period === "start" || dayData.period === "on"){
      phaseText = "姨妈期";
    } else if(phases[k]){
      if(phases[k].phase === "period") phaseText = "姨妈期";
      else if(phases[k].phase === "ovulation") phaseText = "排卵期";
    }

    rawList.push({
      date: k,
      weight: dayData.weight ?? null,
      diff: weightDiffs[k],
      poops: dayData.poops || [],
      phase: phaseText
    });
    curr.setDate(curr.getDate() + 1);
  }

  return rawList;
}

/* 图表绘制 (纯平滑线 + 拖拽 + 双指聚拢缩放) */
let userStep = 42; // 点之间的初始像素间距

function drawChart(){
  const box = document.getElementById("chartBox");
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");
  
  const dpr = window.devicePixelRatio || 1;
  const W = box.clientWidth;
  const H = box.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const series = buildChartSeries();

  if(!series.length){
    ctx.fillStyle="#a0aab0";
    ctx.font="12px sans-serif";
    ctx.textAlign="center";
    ctx.fillText("暂无数据", W/2, H/2);
    return;
  }

  const validWeights = series.map(x=>x.weight).filter(w=>w!=null);
  if(!validWeights.length){
    ctx.fillStyle="#a0aab0";
    ctx.font="12px sans-serif";
    ctx.textAlign="center";
    ctx.fillText("无体重数据", W/2, H/2);
    return;
  }

  const min = Math.min(...validWeights);
  const max = Math.max(...validWeights);
  const range = (max - min) || 1;

  // 底部计算模块
  document.getElementById("avgW").textContent = (validWeights.reduce((a,b)=>a+b,0)/validWeights.length).toFixed(1)+"kg";
  document.getElementById("minW").textContent = min.toFixed(1)+"kg";
  document.getElementById("maxW").textContent = max.toFixed(1)+"kg";

  const padL = 20, padR = 20, padT = 20, padB = 30;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  let offset = (series.length - 1) * userStep - plotW;
  offset = Math.max(0, offset);

  let selectedIdx = series.length - 1;

  // 更新顶部交互 Card 说明文字
  function updateTopCard(p){
    document.getElementById("topCardDate").textContent = p.date.replace(/-/g,"/");
    
    // 体重 & 差值
    if(p.weight != null){
      document.getElementById("topCardWeight").textContent = p.weight + " kg";
      if(p.diff != null){
        if(p.diff === 0){
          document.getElementById("topCardDiff").textContent = "(±0)";
          document.getElementById("topCardDiff").style.color = "var(--diff-zero)";
        } else {
          const sign = p.diff > 0 ? "+" : "";
          document.getElementById("topCardDiff").textContent = `(${sign}${p.diff} kg)`;
          document.getElementById("topCardDiff").style.color = p.diff > 0 ? "var(--diff-up)" : "var(--diff-down)";
        }
      } else {
        document.getElementById("topCardDiff").textContent = "";
      }
    } else {
      document.getElementById("topCardWeight").textContent = "未记录";
      document.getElementById("topCardDiff").textContent = "";
    }

    // 周期文字说明
    const phaseEl = document.getElementById("topCardPhase");
    if(p.phase){
      const cls = p.phase === "姨妈期" ? "period" : "ovulation";
      phaseEl.innerHTML = `<span class="tag-phase ${cls}">${p.phase}</span>`;
    } else {
      phaseEl.innerHTML = "";
    }

    // 排便说明
    const poopEl = document.getElementById("topCardPoop");
    if(p.poops && p.poops.length){
      poopEl.textContent = "排便: " + p.poops.map(x=>`${x.hour}h(${x.size})`).join(" ");
    } else {
      poopEl.textContent = "未排便";
    }
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    const totalW = (series.length - 1) * userStep;
    const maxOffset = Math.max(0, totalW - plotW);
    offset = Math.max(0, Math.min(offset, maxOffset));

    // 网格背景
    ctx.strokeStyle="#edf2f0";
    ctx.lineWidth=1;
    for(let i=0;i<3;i++){
      let y = padT + i * plotH / 2;
      ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    }

    // 计算点坐标
    let lastValidW = validWeights[0];
    const pts = series.map((e,i)=>{
      const wVal = e.weight != null ? e.weight : lastValidW;
      if(e.weight != null) lastValidW = e.weight;
      return {
        x: padL + i*userStep - offset,
        y: padT + (max - wVal)/range * plotH,
        raw: e
      };
    });

    // 纯平滑粉色折线 (Smooth Bezier)
    const validPts = pts.filter(p=>p.raw.weight!=null);
    if(validPts.length > 0){
      ctx.beginPath();
      if(validPts.length > 2){
        ctx.moveTo(validPts[0].x, validPts[0].y);
        for (let i = 0; i < validPts.length - 1; i++) {
          const xc = (validPts[i].x + validPts[i + 1].x) / 2;
          const yc = (validPts[i].y + validPts[i + 1].y) / 2;
          ctx.quadraticCurveTo(validPts[i].x, validPts[i].y, xc, yc);
        }
        ctx.lineTo(validPts[validPts.length - 1].x, validPts[validPts.length - 1].y);
      } else {
        validPts.forEach((p, idx)=>{
          if(idx===0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
      }

      ctx.strokeStyle="#e8889a"; // 低饱和粉色
      ctx.lineWidth=2.5;
      ctx.stroke();
    }

    // 绘制节点 (空心 vs 实心圈)
    pts.forEach((p, idx)=>{
      if(p.x >= padL - 10 && p.x <= W - padR + 10){
        ctx.beginPath();
        if(p.raw.weight != null){
          ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
          ctx.fillStyle="#e8889a";
          ctx.fill();
        } else {
          ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
          ctx.strokeStyle="#a0aab0";
          ctx.lineWidth=1.5;
          ctx.fillStyle="#ffffff";
          ctx.fill();
          ctx.stroke();
        }

        // X轴刻度
        const labelInterval = Math.max(1, Math.round(50 / userStep));
        if(idx % labelInterval === 0 || idx === selectedIdx){
          ctx.fillStyle="#a0aab0";
          ctx.font="10px sans-serif";
          ctx.textAlign="center";
          ctx.fillText(p.raw.date.slice(5), p.x, padT + plotH + 18);
        }
      }
    });

    // 高亮选择线
    if(selectedIdx >= 0 && pts[selectedIdx]){
      const p = pts[selectedIdx];
      if(p.x >= padL && p.x <= W - padR){
        ctx.strokeStyle="rgba(232, 136, 154, 0.4)";
        ctx.lineWidth=1;
        ctx.setLineDash([3,3]);
        ctx.beginPath();ctx.moveTo(p.x, padT);ctx.lineTo(p.x, padT+plotH);ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();ctx.arc(p.x, p.y, 6, 0, Math.PI*2);ctx.fillStyle="#2d3436";ctx.fill();
        updateTopCard(p.raw);
      }
    }
  }

  // 手势缩放与拖拽控制
  let activePointers = [];
  let prevPinchDist = null;
  let dragging = false, startX = 0;

  function getDistance(p1, p2) {
    return Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
  }

  canvas.onpointerdown = e => {
    canvas.setPointerCapture(e.pointerId);
    activePointers.push(e);
    if(activePointers.length === 1){
      dragging = true; startX = e.clientX;
    }
  };

  canvas.onpointermove = e => {
    // 更新 Pointer 坐标
    const idx = activePointers.findIndex(p => p.pointerId === e.pointerId);
    if(idx >= 0) activePointers[idx] = e;

    if (activePointers.length === 2) {
      // 双指聚拢/拉开 缩放
      dragging = false;
      const dist = getDistance(activePointers[0], activePointers[1]);
      if (prevPinchDist) {
        const factor = dist / prevPinchDist;
        userStep = Math.max(12, Math.min(100, userStep * factor));
        render();
      }
      prevPinchDist = dist;
    } else if (dragging && activePointers.length === 1) {
      offset -= (e.clientX - startX);
      startX = e.clientX;
      render();
    }
  };

  canvas.onpointerup = canvas.onpointercancel = e => {
    activePointers = activePointers.filter(p => p.pointerId !== e.pointerId);
    if(activePointers.length < 2) prevPinchDist = null;
    if(activePointers.length === 0){
      if(dragging){
        dragging = false;
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickedIdx = Math.round((clickX - padL + offset) / userStep);
        if(clickedIdx >= 0 && clickedIdx < series.length) selectedIdx = clickedIdx;
        render();
      }
    }
  };

  // 支持滚轮缩放 (PC体验)
  canvas.onwheel = e => {
    e.preventDefault();
    if (e.deltaY < 0) userStep = Math.min(100, userStep * 1.1);
    else userStep = Math.max(12, userStep * 0.9);
    render();
  };

  render();
}

function prediction(){
  const starts = Object.keys(data.days).filter(k=>data.days[k].period==="start").sort();
  const summaryEl = document.getElementById("predSummary");
  const listEl = document.getElementById("predictionList");
  
  if(starts.length < 2){
    summaryEl.innerHTML = "标记 2 次及以上“姨妈第一天”，即可精准预测。";
    listEl.innerHTML = "";
    return;
  }

  const avg = getAvgCycleLength();
  summaryEl.innerHTML = `根据历史记录，您的平均周期为 <b>${avg} 天</b>。未来 12 个月预计日期：`;

  let lastDate = new Date(starts.at(-1)+"T00:00:00");
  let listHtml = "";

  for(let i=1; i<=12; i++){
    let nextDate = new Date(lastDate);
    nextDate.setDate(nextDate.getDate() + Math.round(avg * i));
    
    let yearM = `${nextDate.getFullYear()}/${pad(nextDate.getMonth()+1)}`;
    let fullD = formatSlash(nextDate);
    
    listHtml += `
      <div class="pred-item">
        <span class="m-label">${yearM}</span>
        <span class="d-label">${fullD}</span>
      </div>
    `;
  }
  listEl.innerHTML = listHtml;
}

function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `piisuke_backup_${key(new Date())}.json`;
  a.click();
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if(!parsed.days) throw new Error();
      data = parsed;
      save();
      init();
      alert("导入成功！");
    } catch(err) {
      alert("导入失败：格式不正确。");
    }
  };
  reader.readAsText(file);
}
