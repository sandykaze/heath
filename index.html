      })
    });
  }catch(networkErr){
    /* Gemini 官方接口一般允许浏览器直接跨域调用，这里大概率是网络本身的问题
       （断网、被拦截等），前端拿不到更具体的原因，只能给出这个排查方向 */
    throw new Error("请求没有发出去，可能是网络问题，请检查网络连接后重试");
  }

  if(!response.ok){
    let msg = `请求失败（${response.status}）`;
    try{
      const errData = await response.json();
      if(errData?.error?.message) msg = errData.error.message;
    }catch(e){}
    throw new Error(msg);
  }

  const dataResp = await response.json();
  const finishReason = dataResp.candidates?.[0]?.finishReason;
  /* Gemini 3 系列会先在 parts 里返回一段内部"思考"文本（thought: true），
     这段思考通常是英文、不是最终答案，必须过滤掉，只保留正式回答的 part */
  const text = (dataResp.candidates?.[0]?.content?.parts || [])
    .filter(p => !p.thought)
    .map(p => p.text || "")
    .join("")
    .trim();
  if(!text){
    if(finishReason === "MAX_TOKENS") throw new Error("AI 思考占用过多，正文还没生成完就被截断了，请重试一次");
    throw new Error("AI 没有返回内容，请稍后再试（可能是被安全策略拦截，可换个说法或稍后重试）");
  }
  return text;
}

/* AI 返回的原始文本里，用 [[给老公的话]] 这一行把「给自己」和「给老公」两部分隔开，
   这里拆开成 {self, husband}；如果没找到标记（比如老模型/老缓存数据），就整段当作给自己的内容。 */
function splitAIResponse(raw){
  const text = String(raw || "");
  const marker = /\n{0,2}\[\[给老公的话\]\]\n{0,2}/;
  const m = text.match(marker);
  if(!m) return { self: text.trim(), husband: "" };
  const idx = m.index;
  return {
    self: text.slice(0, idx).trim(),
    husband: text.slice(idx + m[0].length).trim()
  };
}

function renderAIInsight(text, meta){
  const body = document.getElementById("aiInsightBody");
  const metaEl = document.getElementById("aiInsightMeta");
  const husbandSection = document.getElementById("aiHusbandSection");
  const husbandBody = document.getElementById("aiHusbandBody");

  const { self, husband } = splitAIResponse(text);

  if(body){ body.innerHTML = ""; body.textContent = self; }
  if(metaEl) metaEl.textContent = meta || "";

  if(husbandSection && husbandBody){
    if(husband){
      husbandBody.textContent = husband;
      husbandSection.style.display = "";
    } else {
      husbandBody.textContent = "";
      husbandSection.style.display = "none";
    }
  }
}

function renderAIInsightError(msg){
  const body = document.getElementById("aiInsightBody");
  if(!body) return;
  body.innerHTML = `<span class="ai-insight-error">生成失败：${msg}</span>`;
  const husbandSection = document.getElementById("aiHusbandSection");
  if(husbandSection) husbandSection.style.display = "none";
}

/* 把给老公的那部分文字复制到剪贴板，方便直接转发给老公看 */
function copyHusbandText(){
  const body = document.getElementById("aiHusbandBody");
  const text = body ? body.textContent.trim() : "";
  if(!text) return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=> alert("已复制～发给老公看看吧"))
      .catch(()=> alert("复制失败，长按文字手动复制一下吧"));
  } else {
    alert("当前环境不支持一键复制，长按文字手动复制一下吧");
  }
}

/* 展示缓存中的上一次结果（切换到周期 Tab 时调用，不消耗额外 API 调用） */
function loadCachedAIInsight(){
  const titleEl = document.getElementById("aiInsightTitle");
  if(titleEl) titleEl.textContent = getAITitle();

  let cache = null;
  try{ cache = JSON.parse(localStorage.getItem(AI_CACHE_STORAGE) || "null"); }catch(e){}
  if(cache && cache.text){
    const d = new Date(cache.ts);
    renderAIInsight(cache.text, `上次生成于 ${key(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`);
  }
}

/* ===================== AI 建议云端同步 + 历史记录 =====================
   登录状态下，每次生成的 AI 建议会额外写一行到 Supabase 的 ai_insights 表里
   （而不是覆盖），这样：
   1）换设备登录同一账号时，也能看到最近一次生成的建议；
   2）「🕘 历史」按钮可以拉出过去生成过的所有条目。
   需要在 Supabase 项目里建好这张表（一次性操作，SQL 见下方 AI_INSIGHTS_TABLE_SQL 注释）：

   create table if not exists public.ai_insights (
     id uuid primary key default gen_random_uuid(),
     user_id uuid not null references auth.users(id) on delete cascade,
     text text not null,
     model text,
     created_at timestamptz not null default now()
   );
   alter table public.ai_insights enable row level security;
   create policy "ai_insights_select_own" on public.ai_insights
     for select using (auth.uid() = user_id);
   create policy "ai_insights_insert_own" on public.ai_insights
     for insert with check (auth.uid() = user_id);
   create policy "ai_insights_delete_own" on public.ai_insights
     for delete using (auth.uid() = user_id);
*/

/* 生成成功后，若已登录，把这条建议写入云端历史（不影响本地缓存逻辑） */
async function saveAIInsightToCloud(text, model){
  if(!cloudUserId) return;
  try{
    const {error} = await supabaseClient.from("ai_insights").insert({
      user_id: cloudUserId,
      text,
      model: model || null
    });
    if(error) console.warn("AI 建议云端保存失败:", error);
  }catch(err){
    console.warn("AI 建议云端保存失败:", err);
  }
}

/* 登录 / 换设备打开 App 时，拉取云端最近一条建议，让「当前建议」跨终端一致 */
async function loadLatestCloudAIInsight(){
  if(!cloudUserId) return;
  try{
    const {data:rows, error} = await supabaseClient.from("ai_insights")
      .select("text,model,created_at")
      .eq("user_id", cloudUserId)
      .order("created_at", {ascending:false})
      .limit(1);
    if(error){ console.warn("读取云端 AI 建议失败:", error); return; }
    const latest = rows && rows[0];
    if(!latest) return;

    let localCache = null;
    try{ localCache = JSON.parse(localStorage.getItem(AI_CACHE_STORAGE) || "null"); }catch(e){}
    const cloudTs = new Date(latest.created_at).getTime();
    /* 只有云端这条比本地缓存新（比如在别的设备上生成过），才覆盖当前显示 */
    if(!localCache || cloudTs > localCache.ts){
      localStorage.setItem(AI_CACHE_STORAGE, JSON.stringify({text:latest.text, ts:cloudTs, sig:null}));
      const d = new Date(cloudTs);
      renderAIInsight(latest.text, `上次生成于 ${key(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`);
    }
  }catch(err){
    console.warn("读取云端 AI 建议失败:", err);
  }
}

function openAIHistory(){
  const overlay = document.getElementById("aiHistoryOverlay");
  const listEl = document.getElementById("aiHistoryList");
  if(!overlay || !listEl) return;
  overlay.classList.add("active");

  if(!cloudUserId){
    listEl.innerHTML = `<div class="ai-history-empty-hint">登录账号后，这里会显示你在任意设备上生成过的历史建议。当前未登录，只能看到本机最近一条：</div>`;
    let cache = null;
    try{ cache = JSON.parse(localStorage.getItem(AI_CACHE_STORAGE) || "null"); }catch(e){}
    if(cache && cache.text){
      const d = new Date(cache.ts);
      listEl.innerHTML += `
        <div class="ai-history-item">
          <div class="ai-history-item-meta"><span>${key(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}</span></div>
          <div class="ai-history-item-text">${escapeHtml(historyDisplayText(cache.text))}</div>
        </div>`;
    }
    return;
  }

  listEl.innerHTML = `<div class="ai-insight-empty">加载中…</div>`;
  supabaseClient.from("ai_insights")
    .select("id,text,model,created_at")
    .eq("user_id", cloudUserId)
    .order("created_at", {ascending:false})
    .limit(50)
    .then(({data:rows, error})=>{
      if(error){
        listEl.innerHTML = `<span class="ai-insight-error">加载历史失败：${escapeHtml(error.message||"")}</span>`;
        return;
      }
      if(!rows || !rows.length){
        listEl.innerHTML = `<div class="ai-history-empty-hint">还没有生成过 AI 建议，去周期页点「↻」生成第一条吧～</div>`;
        return;
      }
      listEl.innerHTML = rows.map(r=>{
        const d = new Date(r.created_at);
        return `
          <div class="ai-history-item" onclick="this.querySelector('.ai-history-item-text').classList.toggle('clamped')">
            <div class="ai-history-item-meta"><span>${key(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}</span><span>${escapeHtml(r.model||"")}</span></div>
            <div class="ai-history-item-text clamped">${escapeHtml(historyDisplayText(r.text))}</div>
          </div>`;
      }).join("");
    });
}

function closeAIHistory(){
  document.getElementById("aiHistoryOverlay")?.classList.remove("active");
}

/* 历史列表里把「给老公的话」用友好的分隔文字接在后面显示，而不是显示原始的 [[给老公的话]] 标记 */
function historyDisplayText(raw){
  const { self, husband } = splitAIResponse(raw);
  if(!husband) return self;
  return `${self}\n\n💌 给老公的悄悄话\n${husband}`;
}

function escapeHtml(str){
  return String(str||"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

async function generateAIInsight(forceNew){
  const btn = document.getElementById("aiInsightRefreshBtn");
  const apiKey = getAIApiKey();

  if(!apiKey){
    const setNow = confirm("还没有设置 Gemini API Key，要现在设置吗？");
    if(setNow) openAISettings();
    return;
  }

  const summary = buildAIDataSummary();
  if(!summary){
    renderAIInsightError("还没有任何记录，先去记几天数据再来吧～");
    return;
  }

  if(btn){ btn.classList.add("loading"); btn.disabled = true; }
  const body = document.getElementById("aiInsightBody");
  if(body) body.innerHTML = `<span class="ai-insight-empty">AI 正在根据你的数据思考中…</span>`;
  const husbandSection = document.getElementById("aiHusbandSection");
  if(husbandSection) husbandSection.style.display = "none";

  try{
    const text = await callGeminiAI(summary);
    const now = Date.now();
    localStorage.setItem(AI_CACHE_STORAGE, JSON.stringify({ text, ts: now, sig: summary.length }));
    renderAIInsight(text, `刚刚生成 · ${getAIModel()}`);
    saveAIInsightToCloud(text, getAIModel());
  }catch(err){
    renderAIInsightError(err.message || "网络异常，请稍后重试");
  }finally{
    if(btn){ btn.classList.remove("loading"); btn.disabled = false; }
  }
}

function jumpToDate(k){

  viewDate = new Date(d.getFullYear(), d.getMonth(), 1);
  selectedKey = k;
  switchTab('calTab');
  renderCalendar();
  setTimeout(()=>{
    const el = document.querySelector('.day-cell.selected');
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, 60);
}

function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `piisuke_backup_${key(new Date())}.json`;
  a.click();
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if(!parsed.days) throw new Error();
      data = parsed;
      save();
      init();
      alert("导入成功！");
    } catch(err) {
      alert("导入失败：格式不正确。");
    }
  };
  reader.readAsText(file);
}
