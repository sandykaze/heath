<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f5">
<title>Piisuke — Personal Body Log</title>
<style>
:root{
  --bg:#f5f5f2;--card:#ffffff;--text:#171717;--muted:#8a8a84;--line:#e9e9e5;
  --pink:#e88a9b;--pink-soft:#fae9ed;--blue:#7399d1;--blue-soft:#edf3fb;
  --green:#72a486;--green-soft:#edf6f0;--brown:#a9785f;--brown-soft:#f5ede8;
  --shadow:0 12px 40px rgba(30,30,25,.055)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans SC",sans-serif;letter-spacing:.01em}
.wrap{max-width:820px;margin:auto;padding:28px 18px 80px}
.brand{display:flex;align-items:center;gap:12px;margin:4px 2px 24px}
.brand-mark{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#171717;color:white;font-size:16px;font-weight:700;letter-spacing:.08em}
h1{font-size:27px;line-height:1;margin:0;font-weight:800;letter-spacing:.18em}
.sub{color:var(--muted);font-size:10px;letter-spacing:.18em;margin:5px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.toolbar button,.ghost{width:36px;height:36px;background:#f3f3ef;color:#333;border-radius:50%;padding:0;font-size:20px}
.month{font-weight:750;font-size:17px;letter-spacing:.04em}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin:14px 0 10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend span:before{content:"";width:7px;height:7px;border-radius:50%;display:inline-block}
.legend span:nth-child(1):before{background:var(--blue)}
.legend span:nth-child(2):before{background:var(--pink)}
.legend span:nth-child(3):before{background:var(--green)}
.legend span:nth-child(4):before{background:var(--brown)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;color:#aaa;font-size:10px;padding:5px 0}
.day{min-height:82px;border:1px solid #f0f0ed;border-radius:13px;padding:7px;background:#fff;position:relative;overflow:hidden;transition:.15s}
.day:hover{background:#fafaf7}
.day.empty{background:#fafaf8;border-color:transparent}
.day.sel{outline:2px solid #171717;outline-offset:-2px}
.num{font-size:11px;font-weight:700;color:#777}
.marks{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.w{background:var(--blue)}.dot.p{background:var(--pink)}.dot.b{background:var(--brown)}.dot.o{background:var(--green)}
.dot.big{width:10px;height:10px}
.dot-label{font-size:9px;color:#999;margin-left:2px}
.section-title{font-weight:750;font-size:14px;margin-bottom:12px}
.selected-date{color:#777;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}
.field select,.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafaf8;color:#222;outline:none}
.field select:focus,.field input:focus{border-color:#bbb}
.actions{display:flex;gap:8px;margin-top:12px}
.primary{background:#171717;color:white;padding:12px 16px;border-radius:12px;font-weight:650;flex:1}
.danger{background:#f2f0ed;color:#777;padding:12px 16px;border-radius:12px}
.log{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.logrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13px;border-bottom:1px solid #f3f2ef}.del{background:none;color:#aaa;font-size:11px}
canvas{width:100%;height:220px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f7f4;border-radius:14px;padding:11px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}
.notice{background:#f7f7f4;border-radius:14px;padding:13px;font-size:13px;line-height:1.7}
.backup{display:flex;gap:8px;flex-wrap:wrap}.backup button{padding:10px 13px;border-radius:12px;background:#f2f0ed;color:#555}
.footer{color:#aaa;font-size:10px;text-align:center;margin-top:24px;letter-spacing:.04em}
@media(max-width:420px){.wrap{padding:22px 12px 70px}.day{min-height:68px;padding:6px}.marks{gap:4px;margin-top:5px}.grid{grid-template-columns:1fr}.card{border-radius:18px;padding:15px}}

/* Piisuke premium night palette */
:root{
 --bg:#111314;--card:#191c1d;--card2:#202425;--text:#f2f0eb;--muted:#8d918e;--line:#2a2e2e;
 --rose:#d98a98;--sage:#9bb8a3;--sand:#c8a789;--ice:#8ca9c8;--gold:#c6ad78;
 --shadow:0 18px 60px rgba(0,0,0,.28)
}
body{background:radial-gradient(circle at 50% -10%,#242829 0,#111314 44%,#0e1011 100%);color:var(--text)}
.wrap{max-width:820px;padding:30px 18px 90px}
.brand{margin:4px 2px 26px}.brand-mark{background:#eee9df;color:#171717}
h1{font-size:28px;letter-spacing:.02em;font-weight:700}.sub{color:#707674}
.card{background:rgba(25,28,29,.94);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.calendar-card{padding:16px}.toolbar button,.ghost{background:#242829;color:#ddd}
.month{color:#eee}.legend{color:#8c918f}.legend span:before{width:6px;height:6px}
.legend span:nth-child(1):before{background:var(--ice)}.legend span:nth-child(2):before{background:var(--rose)}.legend span:nth-child(3):before{background:var(--sand)}.legend span:nth-child(4):before{background:var(--sage)}
.dow{color:#656b69}.day{background:#1a1d1e;border-color:#292d2e}.day.empty{background:#161819;border-color:transparent}.day:hover{background:#202425}.day.sel{outline:1px solid #e7e2d8}
.num{color:#8d918f}.marks{gap:5px}.dot{width:7px;height:7px;box-shadow:0 0 0 2px rgba(255,255,255,.025)}.dot.w{background:var(--ice)}.dot.p{background:var(--rose)}.dot.b{background:var(--sand)}.dot.o{background:var(--sage)}
.today-bar{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 12px}.eyebrow{font-size:9px;letter-spacing:.18em;color:#6f7572;margin-bottom:4px}.selected-date{font-size:18px;color:#eee;font-weight:650}
.open-drawer{background:#eee9df;color:#171717;border-radius:999px;padding:11px 17px;font-weight:700}
.section-title{color:#e8e5df}.chart-hint{float:right;font-size:10px;color:#666c69;font-weight:400}
.stat{background:#202425}.stat b{color:#eee}.stat span{color:#777d7a}
.notice{background:#202425;color:#c6cac7}.backup button{background:#242829;color:#bbb}
.footer{color:#555b59}
canvas{cursor:grab}canvas:active{cursor:grabbing}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.56);backdrop-filter:blur(8px);z-index:50;display:none;align-items:flex-end}
.drawer-backdrop.open{display:flex}
.drawer{width:100%;max-width:820px;margin:auto;background:#181b1c;border:1px solid #303535;border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -20px 70px rgba(0,0,0,.4);max-height:88vh;overflow:auto;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.drawer-handle{width:42px;height:4px;border-radius:99px;background:#555b59;margin:10px auto}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;padding:4px 20px 15px;border-bottom:1px solid var(--line)}.drawer-head h2{margin:0;font-size:21px}.close-drawer{width:34px;height:34px;border-radius:50%;background:#262a2b;color:#bbb;font-size:22px}
.drawer-body{padding:18px 20px 30px}.field label{color:#777d7a}.field select,.field input{background:#202425;border-color:#303535;color:#eee}.field select:focus,.field input:focus{border-color:#646b68}
.primary{background:#eee9df;color:#171717}.danger{background:#272b2c;color:#999}.log{border-color:#2c3030}.logrow{border-color:#292d2e}
@media(max-width:420px){.wrap{padding:22px 12px 70px}.card{border-radius:20px}.drawer{border-radius:25px 25px 0 0}}

</style>
</head>
<body>
<div class="wrap">
<div class="brand"><span class="brand-mark">P</span><div><h1>Piisuke</h1><p class="sub">PERSONAL BODY LOG · 2026</p></div></div>

<div class="card calendar-card">
  <div class="toolbar">
    <button onclick="changeMonth(-1)">‹</button><div class="month" id="monthTitle"></div><button onclick="changeMonth(1)">›</button>
  </div>
  <div class="legend"><span>体重</span><span>姨妈</span><span>排便</span><span>排卵</span></div>
  <div class="cal" id="calendar"></div>
</div>

<div class="today-bar"><div><div class="eyebrow">TODAY</div><div class="selected-date" id="selDate"></div></div><button class="open-drawer" onclick="openDrawer()">＋ 记录</button></div>
  <div class="section-title">Calendar</div>
  <div class="grid">
    <div class="field"><label>⚖️ 早上体重</label><input id="weight" type="number" step="0.1" min="20" max="200" placeholder="例如 52.3"></div>
    <div class="field"><label>🌸 姨妈</label><select id="period"><option value="">未记录</option><option value="start">姨妈第一天</option><option value="on">姨妈期</option></select></div>
    <div class="field"><label>🥚 排卵期</label><select id="ovulation"><option value="">未记录</option><option value="on">排卵期</option><option value="peak">预计排卵日</option></select></div>
  </div>
  <div class="actions"><button class="primary" onclick="saveDaily()">保存当天</button><button class="danger" onclick="clearDaily()">清空当天</button></div>
  <div class="log">
    <div class="section-title">💩 排便记录</div>
    <div class="grid">
      <div class="field"><label>时间（小时）</label><select id="poopHour"></select></div>
      <div class="field"><label>大小</label><select id="poopSize"><option>小</option><option>小偏中</option><option>中</option><option>中偏大</option><option>大</option></select></div>
    </div>
    <div class="field" style="margin-top:9px"><label>备注（可选）</label><input id="poopNote" placeholder="例如：开塞露、硬"></div>
    <div class="actions"><button class="primary" onclick="addPoop()">＋添加一次排便</button></div>
    <div id="poopList"></div>
  </div>
</div>

<div class="card">
  <div class="section-title">Weight trend <span class="chart-hint">左右拖动 · 点选查看</span></div>
  <div class="statgrid"><div class="stat"><b id="avgW">—</b><span>记录平均</span></div><div class="stat"><b id="minW">—</b><span>最低</span></div><div class="stat"><b id="maxW">—</b><span>最高</span></div></div>
  <canvas id="chart" width="700" height="220"></canvas>
</div>

<div class="card">
  <div class="section-title">🔮 姨妈 / 排卵预测</div>
  <div class="notice" id="prediction"></div>
</div>

<div class="card">
  <div class="section-title">💾 数据备份</div>
  <div class="backup">
    <button onclick="exportData()">导出数据</button>
    <button onclick="document.getElementById('file').click()">导入数据</button>
    <input id="file" type="file" accept=".json" hidden onchange="importData(event)">
  </div>
</div>
<div class="footer">本页面仅用于个人记录与趋势观察，不构成医疗建议。</div>
</div>

<script>
const KEY="bodyDiaryV1";
let data=JSON.parse(localStorage.getItem(KEY)||'{"days":{},"periods":[]}');
let selected=new Date(); selected.setHours(0,0,0,0);
let view=new Date(selected.getFullYear(),selected.getMonth(),1);

function pad(n){return String(n).padStart(2,"0")}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function dayObj(k){return data.days[k] ||= {poops:[]}}
function init(){
 for(let h=0;h<24;h++) document.getElementById("poopHour").innerHTML+=`<option value="${h}">${h}点</option>`;
 render(); loadSelected(); drawChart(); prediction();
}
function changeMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}
function render(){
 const y=view.getFullYear(),m=view.getMonth(), first=new Date(y,m,1), last=new Date(y,m+1,0);
 document.getElementById("monthTitle").textContent=`${y}年${m+1}月`;
 let html=["日","一","二","三","四","五","六"].map(x=>`<div class="dow">${x}</div>`).join("");
 for(let i=0;i<first.getDay();i++) html+=`<div class="day empty"></div>`;
 for(let d=1;d<=last.getDate();d++){
   const dt=new Date(y,m,d),k=key(dt),x=data.days[k]||{}, po=x.poops||[];
   let marks="";
   if(x.weight!=null) marks+=`<span class="dot w" title="体重 ${x.weight}kg"></span>`;
   if(x.period) marks+=`<span class="dot p" title="${x.period==="start"?"姨妈第一天":"姨妈期"}"></span>`;
   if(x.ovulation) marks+=`<span class="dot o" title="排卵期"></span>`;
   if(po.length) marks+=`<span class="dot b big" title="排便 ${po.length}次"></span>`;
   html+=`<div class="day ${k===key(selected)?"sel":""}" onclick="selectDay('${k}')"><div class="num">${d}</div><div class="marks">${marks}</div></div>`;
 }
 document.getElementById("calendar").innerHTML=html;
}
function selectDay(k){selected=new Date(k+"T00:00:00");view=new Date(selected.getFullYear(),selected.getMonth(),1);render();loadSelected()}
function loadSelected(){
 const k=key(selected),x=data.days[k]||{};
 document.getElementById("selDate").textContent=`${selected.getMonth()+1}月${selected.getDate()}日`;
 document.getElementById("weight").value=x.weight??"";
 document.getElementById("period").value=x.period||"";
 document.getElementById("ovulation").value=x.ovulation||"";
 renderPoops();
}
function saveDaily(){
 const k=key(selected),x=dayObj(k),w=document.getElementById("weight").value;
 x.weight=w===""?null:Number(w); if(x.weight===null) delete x.weight;
 x.period=document.getElementById("period").value;
 x.ovulation=document.getElementById("ovulation").value;
 if(!x.period) delete x.period;if(!x.ovulation) delete x.ovulation;
 save();render();drawChart();prediction();
}
function clearDaily(){if(confirm("确定清空这一天的全部记录吗？")){delete data.days[key(selected)];save();loadSelected();render();drawChart();prediction()}}
function addPoop(){
 const x=dayObj(key(selected));x.poops ||= [];
 x.poops.push({hour:Number(document.getElementById("poopHour").value),size:document.getElementById("poopSize").value,note:document.getElementById("poopNote").value.trim()});
 x.poops.sort((a,b)=>a.hour-b.hour);document.getElementById("poopNote").value="";save();render();loadSelected();
}
function removePoop(i){data.days[key(selected)].poops.splice(i,1);save();render();loadSelected()}
function renderPoops(){
 const p=(data.days[key(selected)]||{}).poops||[];
 document.getElementById("poopList").innerHTML=p.length?p.map((x,i)=>`<div class="logrow"><span>💩 ${x.hour}点 · ${x.size}${x.note?` · ${x.note}`:""}</span><button class="del" onclick="removePoop(${i})">删除</button></div>`).join(""):`<div style="color:#aaa;font-size:12px;padding:8px 0">今天还没有排便记录</div>`;
}
function weights(){
 return Object.entries(data.days).filter(([k,x])=>x.weight!=null).sort((a,b)=>a[0].localeCompare(b[0]));
}
function drawChart(){
 const c=document.getElementById("chart"),ctx=c.getContext("2d"),W=c.width,H=c.height,arr=weights();
 ctx.clearRect(0,0,W,H); if(!arr.length)return;
 const vals=arr.map(x=>x[1].weight),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;
 let offset=0,dragging=false,lastX=0,selectedIdx=-1;
 function paint(){
   ctx.clearRect(0,0,W,H);
   const padL=20,padR=12,padT=18,padB=28,plotW=W-padL-padR,plotH=H-padT-padB;
   ctx.strokeStyle="#2b3030";ctx.lineWidth=1;
   for(let i=0;i<3;i++){let yy=padT+i*plotH/2;ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke()}
   const step=Math.max(26,plotW/Math.max(1,arr.length-1)), total=(arr.length-1)*step, maxOffset=Math.max(0,total-plotW);
   offset=Math.max(0,Math.min(offset,maxOffset));
   const pts=arr.map((e,i)=>({x:padL+i*step-offset,y:padT+(max-e[1].weight)/range*plotH,k:e[0],v:e[1].weight}));
   ctx.beginPath();let started=false;
   pts.forEach(p=>{if(p.x<padL-20||p.x>W+20)return;if(!started){ctx.moveTo(p.x,p.y);started=true}else ctx.lineTo(p.x,p.y)});
   ctx.strokeStyle="#8ca9c8";ctx.lineWidth=2.5;ctx.stroke();
   pts.forEach(p=>{if(p.x>=padL-5&&p.x<=W+5){ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,Math.PI*2);ctx.fillStyle="#8ca9c8";ctx.fill()}});
   if(selectedIdx>=0){const p=pts[selectedIdx];if(p&&p.x>=padL&&p.x<=W-padR){ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fillStyle="#eee9df";ctx.fill();ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fillStyle="#8ca9c8";ctx.fill();ctx.fillStyle="#eee9df";ctx.font="12px sans-serif";ctx.textAlign="center";ctx.fillText(`${p.k.slice(5)}  ·  ${p.v.toFixed(1)} kg`,p.x,Math.max(13,p.y-13));}}
   ctx.fillStyle="#666c69";ctx.font="10px sans-serif";ctx.textAlign="left";ctx.fillText(arr[0][0].slice(5),padL,H-7);ctx.textAlign="right";ctx.fillText(arr.at(-1)[0].slice(5),W-padR,H-7);
 }
 function nearest(x){let step=Math.max(26,(W-32)/Math.max(1,arr.length-1));let idx=Math.round((x-20+offset)/step);return Math.max(0,Math.min(arr.length-1,idx))}
 c.onpointerdown=e=>{dragging=true;lastX=e.offsetX;c.setPointerCapture(e.pointerId)}
 c.onpointermove=e=>{if(dragging){offset-=e.offsetX-lastX;lastX=e.offsetX;paint()}}
 c.onpointerup=e=>{dragging=false;selectedIdx=nearest(e.offsetX);paint()}
 c.onpointercancel=()=>dragging=false;
 paint();
 const vals2=vals;document.getElementById("avgW").textContent=(vals2.reduce((a,b)=>a+b,0)/vals2.length).toFixed(1)+"kg";document.getElementById("minW").textContent=min.toFixed(1)+"kg";document.getElementById("maxW").textContent=max.toFixed(1)+"kg";
}

function periodStarts(){
 let a=[];
 for(const [k,x] of Object.entries(data.days)) if(x.period==="start")a.push(k);
 return a.sort();
}
function prediction(){
 const ps=periodStarts();if(ps.length<2){document.getElementById("prediction").innerHTML="记录至少 2 次姨妈第一天后，就可以根据你的实际周期计算预测。";return}
 let dif=[];for(let i=1;i<ps.length;i++)dif.push((new Date(ps[i])-new Date(ps[i-1]))/86400000);
 const avg=dif.reduce((a,b)=>a+b,0)/dif.length,last=new Date(ps.at(-1)+"T00:00:00");
 const next=new Date(last);next.setDate(next.getDate()+Math.round(avg));
 const ov=new Date(next);ov.setDate(ov.getDate()-14);
 document.getElementById("prediction").innerHTML=`你的历史周期平均约 <b>${avg.toFixed(1)} 天</b>（${dif.map(x=>x.toFixed(0)).join("、")} 天）。<br>下一次姨妈预计：<b>${next.getMonth()+1}月${next.getDate()}日前后</b><br>预计排卵日：<b>${ov.getMonth()+1}月${ov.getDate()}日前后</b><br><span style="color:#998d88">预测会随着你继续记录而自动更新，实际周期可能有波动。</span>`;
}

function openDrawer(){
  document.getElementById("drawerDate").textContent=`${selected.getFullYear()} · ${selected.getMonth()+1}月${selected.getDate()}日`;
  document.getElementById("drawerBackdrop").classList.add("open");
  document.body.style.overflow="hidden";
  loadSelected();
}
function closeDrawer(e){
  if(e && e.target!==document.getElementById("drawerBackdrop")) return;
  document.getElementById("drawerBackdrop").classList.remove("open");
  document.body.style.overflow="";
}

function exportData(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="身体日记备份.json";a.click();URL.revokeObjectURL(a.href)
}
function importData(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.days)throw 0;data=x;save();render();loadSelected();drawChart();prediction();alert("导入成功")}catch{alert("文件格式不正确")}};r.readAsText(f)
}

// 预置用户提供的数据
const preset={
"2026-01-16":{period:"start"},"2026-02-12":{period:"start"},"2026-03-13":{period:"start"},"2026-04-11":{period:"start"},"2026-05-08":{period:"start"},"2026-06-06":{period:"start"},"2026-07-05":{period:"start"},"2026-08-02":{period:"start"},
"2026-07-06":{weight:52.1,poops:[{hour:8,size:"小"},{hour:13,size:"小小"},{hour:18,size:"小偏中"}]},
"2026-07-07":{weight:52.2,poops:[{hour:11,size:"中"}]},
"2026-07-08":{weight:52.2},"2026-07-09":{weight:52.4},
