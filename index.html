<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111314">
<title>Piiisuke — Personal Body Log</title>
<style>
:root{
  --bg:#111314;--card:#191c1d;--card2:#202425;--text:#f2f0eb;--muted:#8d918e;--line:#2a2e2e;
  --rose:#e08295;--rose-bg:rgba(224,130,149,0.22);
  --purple:#a78bfa;--purple-bg:rgba(167,139,250,0.18);
  --brown:#c8a789;--ice:#8ca9c8;--gold:#d4af37;
  --shadow:0 18px 60px rgba(0,0,0,.35);
  --radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:radial-gradient(circle at 50% -10%,#242829 0,#111314 44%,#0e1011 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Noto Sans SC",sans-serif;
  letter-spacing:.01em;
  min-height:100vh;
}
.wrap{max-width:600px;margin:auto;padding:20px 16px 80px}
.brand{display:flex;align-items:center;gap:12px;margin:8px 4px 20px}
.brand-mark{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#eee9df;color:#171717;font-size:16px;font-weight:800}
h1{font-size:24px;line-height:1;margin:0;font-weight:700;letter-spacing:.02em}
.sub{color:#707674;font-size:10px;letter-spacing:.15em;margin:4px 0 0}

.card{background:rgba(25,28,29,.95);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0;box-shadow:var(--shadow)}

/* Header & Month Nav */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.toolbar button{width:32px;height:32px;background:#242829;color:#ddd;border:0;border-radius:50%;font-size:18px;cursor:pointer;display:grid;place-items:center}
.month{font-weight:700;font-size:17px;color:#eee}
.legend{display:flex;gap:16px;color:var(--muted);font-size:11px;margin-bottom:12px;justify-content:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend span:before{content:"";width:8px;height:8px;border-radius:50%;display:inline-block}
.legend .leg-period:before{background:var(--rose)}
.legend .leg-ovulation:before{background:var(--purple)}
.legend .leg-poop:before{background:var(--brown)}

/* Calendar Grid */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;position:relative}
.dow{text-align:center;color:#656b69;font-size:11px;font-weight:600;padding:6px 0}
.day-cell{
  position:relative;
  height:58px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:4px;
  cursor:pointer;
  user-select:none;
}
.day-bg-band{
  position:absolute;
  top:2px;bottom:2px;left:0;right:0;
  z-index:1;
  pointer-events:none;
}
.day-bg-band.period{background:var(--rose-bg)}
.day-bg-band.ovulation{background:var(--purple-bg)}
.day-bg-band.band-start{border-top-left-radius:12px;border-bottom-left-radius:12px;left:2px}
.day-bg-band.band-end{border-top-right-radius:12px;border-bottom-right-radius:12px;right:2px}

.num-wrap{
  position:relative;
  z-index:2;
  width:26px;
  height:26px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:500;
  color:#ccc;
}
.day-cell.today .num-wrap{background:var(--gold);color:#111;font-weight:700}
.day-cell.other-month{opacity:0.25}

.indicators{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1px;
  margin-top:2px;
  height:20px;
}
.dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.dot.period-dot{background:var(--rose)}
.poop-dots{font-size:8px;line-height:1;color:var(--brown);letter-spacing:-1px}

/* Stats & Chart */
.section-title{font-weight:700;font-size:15px;color:#e8e5df;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.chart-hint{font-size:11px;color:#666c69;font-weight:400}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:#202425;border-radius:14px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:16px;color:#eee;margin-top:2px}
.stat span{font-size:10px;color:#777d7a}
.chart-container{width:100%;height:180px;position:relative;touch-action:none}
canvas{width:100%;height:100%;display:block}

/* Prediction & Future List */
.notice{background:#202425;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.6;color:#c6cac7}
.prediction-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
  max-height:220px;
  overflow-y:auto;
  padding-right:4px;
}
.pred-item{
  background:#181b1c;
  border:1px solid #2a2e2e;
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
  display:flex;
  justify-content:space-between;
}
.pred-item .m-label{color:#8d918e}
.pred-item .d-label{color:#e08295;font-weight:600}

/* Backup */
.backup{display:flex;gap:10px}
.backup button{flex:1;padding:10px;border-radius:12px;background:#242829;border:1px solid var(--line);color:#bbb;font-size:12px;cursor:pointer}

/* Drawer / Modal Bottom Sheet */
.drawer-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);
  z-index:100;display:none;align-items:flex-end;
}
.drawer-backdrop.open{display:flex}
.drawer{
  width:100%;max-width:600px;margin:auto;background:#181b1c;
  border:1px solid #303535;border-bottom:0;border-radius:24px 24px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.5);max-height:85vh;overflow-y:auto;
  animation:slideUp .2s cubic-bezier(0.16,1,0.3,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.drawer-handle{width:36px;height:4px;border-radius:99px;background:#444948;margin:10px auto 4px}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 14px;border-bottom:1px solid var(--line)}
.drawer-head h2{margin:0;font-size:18px;color:#eee}
.close-btn{width:28px;height:28px;border-radius:50%;background:#262a2b;color:#bbb;border:0;font-size:18px;cursor:pointer;display:grid;place-items:center}
.drawer-body{padding:16px 20px 30px}

.field-group{margin-bottom:14px}
.field-group label{display:block;color:#8d918e;font-size:12px;margin-bottom:6px}
.field-group input,.field-group select{
  width:100%;border:1px solid #303535;border-radius:12px;padding:10px 12px;background:#202425;color:#eee;font-size:14px;outline:none;
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:18px}
.btn-primary{background:#eee9df;color:#171717;border:0;padding:12px;border-radius:12px;font-weight:600;flex:1;cursor:pointer}
.btn-danger{background:#272b2c;color:#e08295;border:0;padding:12px;border-radius:12px;cursor:pointer}
.poop-list{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.poop-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px;border-bottom:1px solid #232728}
.del-btn{background:none;border:0;color:#777;font-size:12px;cursor:pointer}

.footer{color:#555b59;font-size:10px;text-align:center;margin-top:24px}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <span class="brand-mark">P</span>
    <div>
      <h1>Piiisuke</h1>
      <p class="sub">BODY & CYCLE TRACKER</p>
    </div>
  </div>

  <!-- 1. 日历卡片 -->
  <div class="card">
    <div class="toolbar">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="month" id="monthTitle"></div>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="legend">
      <span class="leg-period">姨妈期</span>
      <span class="leg-ovulation">排卵期</span>
      <span class="leg-poop">排便 (●/○)</span>
    </div>
    <div class="cal-grid" id="calendar"></div>
  </div>

  <!-- 2. 体重趋势 -->
  <div class="card">
    <div class="section-title">
      体重趋势 <span class="chart-hint">左右滑动滚动 · 点击查看点</span>
    </div>
    <div class="statgrid">
      <div class="stat"><span id="avgW">—</span><b>平均</b></div>
      <div class="stat"><span id="minW">—</span><b>最低</b></div>
      <div class="stat"><span id="maxW">—</span><b>最高</b></div>
    </div>
    <div class="chart-container" id="chartBox">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <!-- 3. 未来 12 个月生理期预测 -->
  <div class="card">
    <div class="section-title"> 预测未来 12 个月姨妈期</div>
    <div class="notice">
      <div id="predSummary">正在分析周期历史...</div>
      <div class="prediction-grid" id="predictionList"></div>
    </div>
  </div>

  <!-- 4. 备份 -->
  <div class="card">
    <div class="section-title"> 数据备份</div>
    <div class="backup">
      <button onclick="exportData()">导出 JSON</button>
      <button onclick="document.getElementById('file').click()">导入 JSON</button>
      <input id="file" type="file" accept=".json" hidden onchange="importData(event)">
    </div>
  </div>

  <div class="footer">仅供个人数据记录与健康观察，不替代医疗诊断。</div>
</div>

<!-- 5. 底部抽屉 (Modal Bottom Sheet) -->
<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer(event)">
  <div class="drawer" onclick="event.stopPropagation()">
    <div class="drawer-handle"></div>
    <div class="drawer-head">
      <h2 id="drawerDate">2026-08-14</h2>
      <button class="close-btn" onclick="hideDrawer()">✕</button>
    </div>
    <div class="drawer-body">
      <div class="grid-2">
        <div class="field-group">
          <label>⚖️ 晨起体重 (kg)</label>
          <input id="weight" type="number" step="0.1" placeholder="例如 52.3">
        </div>
        <div class="field-group">
          <label>🌸 姨妈状态</label>
          <select id="period">
            <option value="">无</option>
            <option value="start">姨妈第一天</option>
            <option value="on">姨妈期</option>
          </select>
        </div>
      </div>
      
      <div class="field-group">
        <label>🥚 排卵状态</label>
        <select id="ovulation">
          <option value="">自动/无</option>
          <option value="on">排卵期</option>
          <option value="peak">预测排卵日</option>
        </select>
      </div>

      <div class="actions">
        <button class="btn-primary" onclick="saveDaily()">保存今日数据</button>
        <button class="btn-danger" onclick="clearDaily()">清空当天</button>
      </div>

      <div class="poop-list">
        <label style="color:#8d918e;font-size:12px;display:block;margin-bottom:8px">💩 排便记录</label>
        <div class="grid-2">
          <div class="field-group">
            <select id="poopHour"></select>
          </div>
          <div class="field-group">
            <select id="poopSize">
              <option value="小">小 (●)</option>
              <option value="小偏中">小偏中 (●○)</option>
              <option value="中">中 (●●)</option>
              <option value="中偏大">中偏大 (●●○)</option>
              <option value="大">大 (●●●)</option>
            </select>
          </div>
        </div>
        <div class="field-group">
          <input id="poopNote" placeholder="备注（如：开塞露、硬）">
        </div>
        <button class="btn-primary" style="width:100%;padding:8px;font-size:13px" onclick="addPoop()">＋ 添加一次排便</button>
        <div id="poopContainer"></div>
      </div>
    </div>
  </div>
</div>

<script>
const KEY="bodyDiaryV3";
let data=JSON.parse(localStorage.getItem(KEY)||'{"days":{}}');
let selectedKey = "";
let viewDate = new Date();

function pad(n){return String(n).padStart(2,"0")}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function dayObj(k){return data.days[k] ||= {poops:[]}}

// 转换大小为实心/空心圆点标记
function sizeToDots(size){
  switch(size){
    case "小": return "●";
    case "小偏中": return "●○";
    case "中": return "●●";
    case "中偏大": return "●●○";
    case "大": return "●●●";
    default: return "●";
  }
}

// 评分用于选取当天最大体量进行日历展示
function sizeRank(size){
  const ranks = {"小":1, "小偏中":2, "中":3, "中偏大":4, "大":5};
  return ranks[size] || 1;
}

function init(){
  const hSel = document.getElementById("poopHour");
  hSel.innerHTML = "";
  for(let h=0;h<24;h++) hSel.innerHTML+=`<option value="${h}">${h}:00</option>`;
  
  const today = new Date();
  viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
  renderCalendar();
  drawChart();
  prediction();
}

function changeMonth(n){
  viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+n, 1);
  renderCalendar();
}

// 计算预计排卵窗口
function getOvulationDays(){
  const ovSet = new Set();
  const starts = Object.keys(data.days).filter(k=>data.days[k].period==="start").sort();
  starts.forEach(sKey=>{
    const d = new Date(sKey+"T00:00:00");
    for(let i=10; i<=16; i++){
      const ovD = new Date(d);
      ovD.setDate(ovD.getDate() + i);
      ovSet.add(key(ovD));
    }
  });
  return ovSet;
}

function renderCalendar(){
  const y = viewDate.getFullYear(), m = viewDate.getMonth();
  document.getElementById("monthTitle").textContent = `${y}年 ${m+1}月`;
  
  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  const todayStr = key(new Date());
  const autoOvulation = getOvulationDays();

  let html = ["日","一","二","三","四","五","六"].map(x=>`<div class="dow">${x}</div>`).join("");
  
  for(let i=0; i<first.getDay(); i++){
    html += `<div class="day-cell other-month"></div>`;
  }

  for(let d=1; d<=last.getDate(); d++){
    const dt = new Date(y, m, d);
    const k = key(dt);
    const dayData = data.days[k] || {};
    
    const isPeriod = dayData.period === "start" || dayData.period === "on";
    const isOvulation = dayData.ovulation === "on" || dayData.ovulation === "peak" || autoOvulation.has(k);
    
    const prevKey = key(new Date(y, m, d-1));
    const nextKey = key(new Date(y, m, d+1));
    const prevPeriod = (data.days[prevKey]||{}).period;
    const nextPeriod = (data.days[nextKey]||{}).period;
    
    let bandClasses = "";
    if(isPeriod){
      bandClasses += " period";
      if(!prevPeriod) bandClasses += " band-start";
      if(!nextPeriod) bandClasses += " band-end";
    } else if(isOvulation){
      bandClasses += " ovulation";
      if(!autoOvulation.has(prevKey) && !(data.days[prevKey]||{}).ovulation) bandClasses += " band-start";
      if(!autoOvulation.has(nextKey) && !(data.days[nextKey]||{}).ovulation) bandClasses += " band-end";
    }

    // 表达排便与生理期标记
    let dots = "";
    if(isPeriod) dots += `<span class="dot period-dot"></span>`;
    
    if(dayData.poops && dayData.poops.length){
      // 找出体量最大的排便呈现点阵
      let maxPoop = dayData.poops.reduce((prev, curr) => sizeRank(curr.size) > sizeRank(prev.size) ? curr : prev, dayData.poops[0]);
      dots += `<span class="poop-dots">${sizeToDots(maxPoop.size)}</span>`;
    }

    const isToday = k === todayStr;

    html += `
      <div class="day-cell ${isToday?'today':''}" onclick="openDrawer('${k}')">
        ${(isPeriod || isOvulation) ? `<div class="day-bg-band ${bandClasses}"></div>` : ''}
        <div class="num-wrap">${d}</div>
        <div class="indicators">${dots}</div>
      </div>
    `;
  }
  document.getElementById("calendar").innerHTML = html;
}

/* 抽屉逻辑 */
function openDrawer(k){
  selectedKey = k;
  document.getElementById("drawerDate").textContent = k;
  const dayData = data.days[k] || {};
  
  document.getElementById("weight").value = dayData.weight ?? "";
  document.getElementById("period").value = dayData.period || "";
  document.getElementById("ovulation").value = dayData.ovulation || "";
  
  renderPoops();
  document.getElementById("drawerBackdrop").classList.add("open");
}

function hideDrawer(){
  document.getElementById("drawerBackdrop").classList.remove("open");
}

function closeDrawer(e){
  if(e.target === document.getElementById("drawerBackdrop")) hideDrawer();
}

function saveDaily(){
  const x = dayObj(selectedKey);
  const w = document.getElementById("weight").value;
  x.weight = w === "" ? null : Number(w);
  if(x.weight === null) delete x.weight;
  
  x.period = document.getElementById("period").value;
  x.ovulation = document.getElementById("ovulation").value;
  if(!x.period) delete x.period;
  if(!x.ovulation) delete x.ovulation;

  save();
  renderCalendar();
  drawChart();
  prediction();
  hideDrawer();
}

function clearDaily(){
  if(confirm("确定清空当天的记录吗？")){
    delete data.days[selectedKey];
    save();
    renderCalendar();
    drawChart();
    prediction();
    hideDrawer();
  }
}

function addPoop(){
  const x = dayObj(selectedKey);
  x.poops ||= [];
  x.poops.push({
    hour: Number(document.getElementById("poopHour").value),
    size: document.getElementById("poopSize").value,
    note: document.getElementById("poopNote").value.trim()
  });
  x.poops.sort((a,b)=>a.hour-b.hour);
  document.getElementById("poopNote").value="";
  save();
  renderCalendar();
  renderPoops();
}

function removePoop(i){
  data.days[selectedKey].poops.splice(i,1);
  save();
  renderCalendar();
  renderPoops();
}

function renderPoops(){
  const p = (data.days[selectedKey]||{}).poops || [];
  const container = document.getElementById("poopContainer");
  if(!p.length){
    container.innerHTML = `<div style="color:#666;font-size:12px;padding:8px 0">无排便记录</div>`;
    return;
  }
  container.innerHTML = p.map((x,i)=>`
    <div class="poop-item">
      <span>💩 ${x.hour}:00 · ${x.size} [${sizeToDots(x.size)}] ${x.note?` (${x.note})`:''}</span>
      <button class="del-btn" onclick="removePoop(${i})">删除</button>
    </div>
  `).join("");
}

/* 体重曲线绘制 */
function drawChart(){
  const box = document.getElementById("chartBox");
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");
  
  const dpr = window.devicePixelRatio || 1;
  const W = box.clientWidth;
  const H = box.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const arr = Object.entries(data.days)
    .filter(([k,x])=>x.weight != null)
    .sort((a,b)=>a[0].localeCompare(b[0]));

  if(!arr.length){
    ctx.fillStyle="#666";
    ctx.font="12px sans-serif";
    ctx.textAlign="center";
    ctx.fillText("暂无体重数据", W/2, H/2);
    document.getElementById("avgW").textContent = "—";
    document.getElementById("minW").textContent = "—";
    document.getElementById("maxW").textContent = "—";
    return;
  }

  const vals = arr.map(x=>x[1].weight);
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const range = (max - min) || 1;

  document.getElementById("avgW").textContent = (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)+"kg";
  document.getElementById("minW").textContent = min.toFixed(1)+"kg";
  document.getElementById("maxW").textContent = max.toFixed(1)+"kg";

  let offset = 0, dragging = false, startX = 0, selectedIdx = -1;
  const padL = 25, padR = 25, padT = 20, padB = 25;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const step = Math.max(36, plotW / Math.max(1, arr.length - 1));
  const totalW = (arr.length - 1) * step;
  const maxOffset = Math.max(0, totalW - plotW);

  function render(){
    ctx.clearRect(0,0,W,H);
    offset = Math.max(0, Math.min(offset, maxOffset));

    ctx.strokeStyle="#262a2b";
    ctx.lineWidth=1;
    for(let i=0;i<3;i++){
      let y = padT + i * plotH / 2;
      ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    }

    const pts = arr.map((e,i)=>({
      x: padL + i*step - offset,
      y: padT + (max - e[1].weight)/range * plotH,
      date: e[0],
      val: e[1].weight
    }));

    ctx.beginPath();
    let started = false;
    pts.forEach(p=>{
      if(p.x < padL - 40 || p.x > W + 40) return;
      if(!started){ ctx.moveTo(p.x, p.y); started=true; }
      else { ctx.lineTo(p.x, p.y); }
    });
    ctx.strokeStyle="#8ca9c8";
    ctx.lineWidth=2;
    ctx.stroke();

    pts.forEach((p)=>{
      if(p.x >= padL - 5 && p.x <= W - padR + 5){
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fillStyle="#8ca9c8";
        ctx.fill();
      }
    });

    if(selectedIdx >= 0 && pts[selectedIdx]){
      const p = pts[selectedIdx];
      if(p.x >= padL && p.x <= W - padR){
        ctx.beginPath();ctx.arc(p.x, p.y, 5, 0, Math.PI*2);ctx.fillStyle="#eee9df";ctx.fill();
        ctx.fillStyle="#eee9df";ctx.font="11px sans-serif";ctx.textAlign="center";
        ctx.fillText(`${p.date.slice(5)} : ${p.val}kg`, p.x, Math.max(12, p.y - 10));
      }
    }
  }

  canvas.onpointerdown = e => {
    dragging = true; startX = e.clientX;
    canvas.setPointerCapture(e.pointerId);
  };
  canvas.onpointermove = e => {
    if(dragging){
      offset -= (e.clientX - startX);
      startX = e.clientX;
      render();
    }
  };
  canvas.onpointerup = e => {
    dragging = false;
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const idx = Math.round((clickX - padL + offset) / step);
    if(idx >= 0 && idx < arr.length) selectedIdx = idx;
    render();
  };
  canvas.onpointercancel = () => dragging = false;

  render();
}

/* 预测未来 12 个月生理期 */
function prediction(){
  const starts = Object.keys(data.days).filter(k=>data.days[k].period==="start").sort();
  const summaryEl = document.getElementById("predSummary");
  const listEl = document.getElementById("predictionList");
  
  if(starts.length < 2){
    summaryEl.innerHTML = "标记 2 次及以上“姨妈第一天”，即可计算未来预测。";
    listEl.innerHTML = "";
    return;
  }

  let diffs = [];
  for(let i=1; i<starts.length; i++){
    diffs.push((new Date(starts[i]) - new Date(starts[i-1])) / 86400000);
  }
  const avg = diffs.reduce((a,b)=>a+b,0) / diffs.length;
  summaryEl.innerHTML = `根据历史记录，您的平均周期为 <b>${avg.toFixed(1)} 天</b>。未来 12 个月预计时间如下：`;

  let lastDate = new Date(starts.at(-1)+"T00:00:00");
  let listHtml = "";

  for(let i=1; i<=12; i++){
    let nextDate = new Date(lastDate);
    nextDate.setDate(nextDate.getDate() + Math.round(avg * i));
    let y = nextDate.getFullYear();
    let m = pad(nextDate.getMonth()+1);
    let d = pad(nextDate.getDate());
    
    listHtml += `
      <div class="pred-item">
        <span class="m-label">${y}年${m}月</span>
        <span class="d-label">${m}月${d}日前后</span>
      </div>
    `;
  }
  listEl.innerHTML = listHtml;
}

function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `piisuke_backup_${key(new Date())}.json`;
  a.click();
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if(!parsed.days) throw new Error();
      data = parsed;
      save();
      init();
      alert("导入成功！");
    } catch(err) {
      alert("导入失败：格式不正确。");
    }
  };
  reader.readAsText(file);
}
