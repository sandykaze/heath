<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f5">
<title>身体日记｜体重 · 姨妈 · 排便</title>
<style>
:root{--bg:#fff9f7;--card:#fff;--text:#332b2a;--muted:#887d79;--line:#eee3df;--pink:#ef8fa0;--pink2:#fde7eb;--blue:#8caedb;--blue2:#eaf2fb;--green:#86b99b;--green2:#e9f5ed;--brown:#b98970;--shadow:0 6px 22px #7b5b5120}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
button,input,select{font:inherit} button{border:0;cursor:pointer}.wrap{max-width:760px;margin:auto;padding:16px 14px 70px}
h1{font-size:25px;margin:8px 2px 4px}.sub{color:var(--muted);font-size:13px;margin:0 2px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0;box-shadow:var(--shadow)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px}.toolbar button,.ghost{background:#f5efed;color:#554a47;border-radius:12px;padding:9px 12px}
.month{font-weight:750;font-size:18px}.legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:12px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;color:var(--muted);font-size:11px;padding:4px 0}.day{min-height:78px;border:1px solid var(--line);border-radius:10px;padding:5px;background:#fff;position:relative;overflow:hidden}.day.empty{background:#faf7f6}.day.sel{outline:2px solid var(--pink)}.num{font-size:12px;font-weight:700}.marks{font-size:11px;line-height:1.45;margin-top:3px}.w{color:#5e7da8}.p{color:#d96f83}.b{color:#8d604b}.o{color:#6a9b7c}.dots{margin-top:3px;color:#999}
.section-title{font-weight:750;margin-bottom:10px}.selected-date{color:var(--pink);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field select,.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}
.actions{display:flex;gap:8px;margin-top:12px}.primary{background:var(--pink);color:white;padding:11px 15px;border-radius:12px;font-weight:700;flex:1}.danger{background:#f7e9e6;color:#9a5e54;padding:11px 15px;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:#f6f1ef;border-radius:999px;padding:7px 10px;font-size:12px}.chip.pink{background:var(--pink2);color:#b95266}.chip.blue{background:var(--blue2);color:#58759c}.chip.green{background:var(--green2);color:#547c62}
.log{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.logrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px}.del{background:none;color:#b99b93;font-size:12px}
canvas{width:100%;height:220px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#faf5f3;border-radius:13px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.notice{background:#fff4f0;border-radius:12px;padding:11px;font-size:13px;line-height:1.5}.backup{display:flex;gap:8px;flex-wrap:wrap}.backup button{padding:10px 12px;border-radius:12px;background:#f3eeec}.footer{color:#aaa;font-size:11px;text-align:center;margin-top:20px}
@media(max-width:420px){.day{min-height:69px;padding:4px}.marks{font-size:10px}.grid{grid-template-columns:1fr}.stat b{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🌷 我的身体日记</h1>
<p class="sub">体重 · 姨妈 · 排卵 · 排便｜数据保存在本机浏览器</p>

<div class="card">
  <div class="toolbar">
    <button onclick="changeMonth(-1)">‹</button><div class="month" id="monthTitle"></div><button onclick="changeMonth(1)">›</button>
  </div>
  <div class="legend"><span>⚖️体重</span><span>🌸姨妈</span><span>💩便便</span><span>🥚排卵</span></div>
  <div class="cal" id="calendar"></div>
</div>

<div class="card">
  <div class="section-title">当天记录 · <span class="selected-date" id="selDate"></span></div>
  <div class="grid">
    <div class="field"><label>⚖️ 早上体重</label><input id="weight" type="number" step="0.1" min="20" max="200" placeholder="例如 52.3"></div>
    <div class="field"><label>🌸 姨妈</label><select id="period"><option value="">未记录</option><option value="start">姨妈第一天</option><option value="on">姨妈期</option></select></div>
    <div class="field"><label>🥚 排卵期</label><select id="ovulation"><option value="">未记录</option><option value="on">排卵期</option><option value="peak">预计排卵日</option></select></div>
  </div>
  <div class="actions"><button class="primary" onclick="saveDaily()">保存当天</button><button class="danger" onclick="clearDaily()">清空当天</button></div>
  <div class="log">
    <div class="section-title">💩 排便记录</div>
    <div class="grid">
      <div class="field"><label>时间（小时）</label><select id="poopHour"></select></div>
      <div class="field"><label>大小</label><select id="poopSize"><option>小</option><option>小偏中</option><option>中</option><option>中偏大</option><option>大</option></select></div>
    </div>
    <div class="field" style="margin-top:9px"><label>备注（可选）</label><input id="poopNote" placeholder="例如：开塞露、硬"></div>
    <div class="actions"><button class="primary" onclick="addPoop()">＋添加一次排便</button></div>
    <div id="poopList"></div>
  </div>
</div>

<div class="card">
  <div class="section-title">📈 体重趋势</div>
  <div class="statgrid"><div class="stat"><b id="avgW">—</b><span>记录平均</span></div><div class="stat"><b id="minW">—</b><span>最低</span></div><div class="stat"><b id="maxW">—</b><span>最高</span></div></div>
  <canvas id="chart" width="700" height="220"></canvas>
</div>

<div class="card">
  <div class="section-title">🔮 姨妈 / 排卵预测</div>
  <div class="notice" id="prediction"></div>
</div>

<div class="card">
  <div class="section-title">💾 数据备份</div>
  <div class="backup">
    <button onclick="exportData()">导出数据</button>
    <button onclick="document.getElementById('file').click()">导入数据</button>
    <input id="file" type="file" accept=".json" hidden onchange="importData(event)">
  </div>
</div>
<div class="footer">本页面仅用于个人记录与趋势观察，不构成医疗建议。</div>
</div>

<script>
const KEY="bodyDiaryV1";
let data=JSON.parse(localStorage.getItem(KEY)||'{"days":{},"periods":[]}');
let selected=new Date(); selected.setHours(0,0,0,0);
let view=new Date(selected.getFullYear(),selected.getMonth(),1);

function pad(n){return String(n).padStart(2,"0")}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function dayObj(k){return data.days[k] ||= {poops:[]}}
function init(){
 for(let h=0;h<24;h++) document.getElementById("poopHour").innerHTML+=`<option value="${h}">${h}点</option>`;
 render(); loadSelected(); drawChart(); prediction();
}
function changeMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}
function render(){
 const y=view.getFullYear(),m=view.getMonth(), first=new Date(y,m,1), last=new Date(y,m+1,0);
 document.getElementById("monthTitle").textContent=`${y}年${m+1}月`;
 let html=["日","一","二","三","四","五","六"].map(x=>`<div class="dow">${x}</div>`).join("");
 for(let i=0;i<first.getDay();i++) html+=`<div class="day empty"></div>`;
 for(let d=1;d<=last.getDate();d++){
   const dt=new Date(y,m,d),k=key(dt),x=data.days[k]||{}, po=x.poops||[];
   let marks="";
   if(x.weight!=null) marks+=`<div class="w">⚖️${x.weight}</div>`;
   if(x.period) marks+=`<div class="p">🌸${x.period==="start"?"首日":"姨妈"}</div>`;
   if(x.ovulation) marks+=`<div class="o">🥚</div>`;
   if(po.length) marks+=`<div class="b">💩${po.length}次</div>`;
   html+=`<div class="day ${k===key(selected)?"sel":""}" onclick="selectDay('${k}')"><div class="num">${d}</div><div class="marks">${marks}</div></div>`;
 }
 document.getElementById("calendar").innerHTML=html;
}
function selectDay(k){selected=new Date(k+"T00:00:00");view=new Date(selected.getFullYear(),selected.getMonth(),1);render();loadSelected()}
function loadSelected(){
 const k=key(selected),x=data.days[k]||{};
 document.getElementById("selDate").textContent=`${selected.getMonth()+1}月${selected.getDate()}日`;
 document.getElementById("weight").value=x.weight??"";
 document.getElementById("period").value=x.period||"";
 document.getElementById("ovulation").value=x.ovulation||"";
 renderPoops();
}
function saveDaily(){
 const k=key(selected),x=dayObj(k),w=document.getElementById("weight").value;
 x.weight=w===""?null:Number(w); if(x.weight===null) delete x.weight;
 x.period=document.getElementById("period").value;
 x.ovulation=document.getElementById("ovulation").value;
 if(!x.period) delete x.period;if(!x.ovulation) delete x.ovulation;
 save();render();drawChart();prediction();
}
function clearDaily(){if(confirm("确定清空这一天的全部记录吗？")){delete data.days[key(selected)];save();loadSelected();render();drawChart();prediction()}}
function addPoop(){
 const x=dayObj(key(selected));x.poops ||= [];
 x.poops.push({hour:Number(document.getElementById("poopHour").value),size:document.getElementById("poopSize").value,note:document.getElementById("poopNote").value.trim()});
 x.poops.sort((a,b)=>a.hour-b.hour);document.getElementById("poopNote").value="";save();render();loadSelected();
}
function removePoop(i){data.days[key(selected)].poops.splice(i,1);save();render();loadSelected()}
function renderPoops(){
 const p=(data.days[key(selected)]||{}).poops||[];
 document.getElementById("poopList").innerHTML=p.length?p.map((x,i)=>`<div class="logrow"><span>💩 ${x.hour}点 · ${x.size}${x.note?` · ${x.note}`:""}</span><button class="del" onclick="removePoop(${i})">删除</button></div>`).join(""):`<div style="color:#aaa;font-size:12px;padding:8px 0">今天还没有排便记录</div>`;
}
function weights(){
 return Object.entries(data.days).filter(([k,x])=>x.weight!=null).sort((a,b)=>a[0].localeCompare(b[0]));
}
function drawChart(){
 const c=document.getElementById("chart"),ctx=c.getContext("2d"),w=c.width,h=c.height;
 ctx.clearRect(0,0,w,h);let arr=weights();if(!arr.length)return;
 const vals=arr.map(x=>x[1].weight),min=Math.min(...vals),max=Math.max(...vals),padY=25,padX=35;
 ctx.strokeStyle="#eadfdb";ctx.lineWidth=1;
 for(let i=0;i<4;i++){let yy=padY+i*(h-2*padY)/3;ctx.beginPath();ctx.moveTo(padX,yy);ctx.lineTo(w-10,yy);ctx.stroke();ctx.fillStyle="#998d88";ctx.font="11px sans-serif";ctx.fillText((max-(max-min)*i/3).toFixed(1),2,yy+4)}
 if(arr.length===1){ctx.fillStyle="#ef8fa0";ctx.beginPath();ctx.arc(w/2,h/2,4,0,7);ctx.fill();return}
 ctx.beginPath();arr.forEach((e,i)=>{let x=padX+i*(w-padX-10)/(arr.length-1),y=padY+(max-e[1].weight)/(max-min||1)*(h-2*padY);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle="#ef8fa0";ctx.lineWidth=3;ctx.stroke();
 const vals2=vals;document.getElementById("avgW").textContent=(vals2.reduce((a,b)=>a+b,0)/vals2.length).toFixed(1)+"kg";document.getElementById("minW").textContent=min.toFixed(1)+"kg";document.getElementById("maxW").textContent=max.toFixed(1)+"kg";
}
function periodStarts(){
 let a=[];
 for(const [k,x] of Object.entries(data.days)) if(x.period==="start")a.push(k);
 return a.sort();
}
function prediction(){
 const ps=periodStarts();if(ps.length<2){document.getElementById("prediction").innerHTML="记录至少 2 次姨妈第一天后，就可以根据你的实际周期计算预测。";return}
 let dif=[];for(let i=1;i<ps.length;i++)dif.push((new Date(ps[i])-new Date(ps[i-1]))/86400000);
 const avg=dif.reduce((a,b)=>a+b,0)/dif.length,last=new Date(ps.at(-1)+"T00:00:00");
 const next=new Date(last);next.setDate(next.getDate()+Math.round(avg));
 const ov=new Date(next);ov.setDate(ov.getDate()-14);
 document.getElementById("prediction").innerHTML=`你的历史周期平均约 <b>${avg.toFixed(1)} 天</b>（${dif.map(x=>x.toFixed(0)).join("、")} 天）。<br>下一次姨妈预计：<b>${next.getMonth()+1}月${next.getDate()}日前后</b><br>预计排卵日：<b>${ov.getMonth()+1}月${ov.getDate()}日前后</b><br><span style="color:#998d88">预测会随着你继续记录而自动更新，实际周期可能有波动。</span>`;
}
function exportData(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="身体日记备份.json";a.click();URL.revokeObjectURL(a.href)
}
function importData(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.days)throw 0;data=x;save();render();loadSelected();drawChart();prediction();alert("导入成功")}catch{alert("文件格式不正确")}};r.readAsText(f)
}

// 预置用户提供的数据
const preset={
"2026-01-16":{period:"start"},"2026-02-12":{period:"start"},"2026-03-13":{period:"start"},"2026-04-11":{period:"start"},"2026-05-08":{period:"start"},"2026-06-06":{period:"start"},"2026-07-05":{period:"start"},"2026-08-02":{period:"start"},
"2026-07-06":{weight:52.1,poops:[{hour:8,size:"小"},{hour:13,size:"小小"},{hour:18,size:"小偏中"}]},
"2026-07-07":{weight:52.2,poops:[{hour:11,size:"中"}]},
"2026-07-08":{weight:52.2},"2026-07-09":{weight:52.4},
"2026-07-10":{weight:52.6,poops:[{hour:10,size:"小偏中"}]},
"2026-07-11":{weight:52.5,poops:[{hour:9,size:"中"},{hour:10,size:"大"}]},
"2026-07-12":{weight:52.2,poops:[{hour:10,size:"中"}]},
"2026-07-13":{weight:51.9},"2026-07-14":{weight:52.2},
"2026-07-15":{weight:52.5,poops:[{hour:10,size:"大"}]},
"2026-07-16":{weight:52.6},"2026-07-17":{weight:52.8,poops:[{hour:7,size:"大"}]},
"2026-07-18":{weight:52.7,poops:[{hour:17,size:"中"}]},
"2026-07-19":{weight:52.5,poops:[{hour:11,size:"中"}]},
"2026-07-20":{weight:52.1},"2026-07-21":{weight:51.9},"2026-07-22":{weight:52.6},"2026-07-23":{weight:52.4},
"2026-07-24":{weight:52.1,poops:[{hour:7,size:"大"}]},
"2026-07-25":{weight:51.9,poops:[{hour:12,size:"大"}]},
"2026-07-26":{weight:52.0,poops:[{hour:11,size:"中"}]},
"2026-07-27":{weight:51.8},"2026-07-28":{weight:52.2},"2026-07-29":{weight:52.4,poops:[{hour:10,size:"中"}]},
"2026-07-30":{weight:52.2,poops:[{hour:7,size:"中"}]},
"2026-07-31":{weight:52.3,poops:[{hour:11,size:"中"}]},
"2026-08-01":{weight:52.3,poops:[{hour:15,size:"小偏中"}]},
"2026-08-02":{weight:52.1,poops:[{hour:10,size:"大"}],period:"start"},
"2026-08-03":{weight:51.9},"2026-08-04":{weight:52.1},
"2026-08-05":{weight:52.3,poops:[{hour:15,size:"中偏大"}]},
"2026-08-09":{poops:[{hour:12,size:"大"}]},
"2026-08-12":{weight:52.4},
"2026-08-16":{weight:52.3,poops:[{hour:20,size:"硬",note:"晚上开塞露"}]},
"2026-08-17":{weight:52.3}
};
for(const [k,v] of Object.entries(preset)) data.days[k] ||= v;
save();init();
</script>
</body>
</html>
