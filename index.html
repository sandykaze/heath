<style>
/* 🎨 极具活力与治愈感的多巴胺糖果配色体系 */
:root {
  /* 基础背景：渐变亮黄/柠檬糖暖色 */
  --bg-gradient: linear-gradient(135deg, #FFF0F5 0%, #FFFAEB 50%, #E8F0FE 100%);
  --card-bg: rgba(255, 255, 255, 0.60);
  --card-border: rgba(255, 255, 255, 0.32);

  /* 毛玻璃质感 */
  --glass-bg: rgba(255, 255, 255, 0.5);
  --glass-bg-strong: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(255, 255, 255, 0.32);
  --glass-shadow: 0 8px 32px rgba(120, 90, 130, 0.10);
  
  /* 多巴胺核心高亮配色 */
  --pop-pink: #FF6B9B;      /* 主视觉/活力粉 */
  --pop-purple: #9D4EDD;    /* 薰衣草紫/排卵期 */
  --pop-yellow: #FFD166;    /* 明黄/卡片强调/今日 */
  --pop-green: #06D6A0;     /* 罗勒绿/体重下降 */
  --pop-orange: #FF8811;    /* 落日橙/体重上升 */
  --pop-blue: #118AB2;      /* 薄荷蓝/按钮 hover */

  /* 文字颜色：高对比度、不闷沉的浓郁墨紫与明亮字调 */
  --text-main: #3D2B42;     
  --text-muted: #8E7A93;
  --text-light: #BCA3C3;

  /* 姨妈期与排卵期柔和高亮底色（姨妈期加深，与边框/背景形成区分） */
  --rose: var(--pop-pink);
  --rose-bg: rgba(255, 107, 155, 0.22);
  --purple: var(--pop-purple);
  --purple-bg: rgba(157, 78, 221, 0.18);
  --poop-gray: #D4A373;

  /* 数据对比色 */
  --diff-down: var(--pop-green);
  --diff-up: var(--pop-orange);
  --diff-zero: #A09383;

  /* 高级偏粉色调，用于生理期预测等需要区别于亮粉的强调色 */
  --rose-mauve: #B8557A;

  /* 多巴胺糖果感阴影与大圆角 */
  --shadow-soft: 0 16px 40px rgba(120, 90, 130, 0.10);
  --shadow-hover: 0 10px 26px rgba(120, 90, 130, 0.12);
  --radius-lg: 28px;
  --radius-md: 20px;
  --radius-sm: 12px;

  /* 统一字体：西文用 Fredoka 撑起圆润气质，中文交给 Noto Sans SC 保持大气整洁，两者字重呼应 */
  /* 统一字体：中文用 Noto Sans SC 保证清爽好读；数字单独换成 DM Sans——
     几何感更强、字形修长挺拔，质感比圆润的 Poppins 更高级冷静，混入的中文（如"天"）
     仍自动落回 Noto Sans SC，不会出现整段文字字体不统一的问题 */
  --font-main: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-num: 'DM Sans', 'Noto Sans SC', sans-serif;
  --font-brand: 'Fredoka', 'Noto Sans SC', sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{
  margin:0;
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-main);
  font-family: var(--font-main);
  letter-spacing: .02em;
  min-height: 100vh;
}
.wrap{max-width:580px;margin:auto;padding:24px 18px 80px}

/* Header 页头品牌区域：左侧 Logo，右侧集成账号状态 */
.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:12px 4px 24px;
}
.brand-left{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}
.brand-mark{
  flex-shrink:0;
  width:48px;height:48px;border-radius:18px;
  display:grid;place-items:center;
  background: linear-gradient(135deg, #FF6B9B 0%, #FF8811 100%);
  color:#FFFFFF;
  font-size:24px;font-weight:700;
  font-family:var(--font-brand);
  box-shadow:0 8px 18px rgba(255, 107, 155, 0.4);
  transform: rotate(-3deg);
}
h1{font-size:26px;line-height:1;margin:0;font-weight:700;color:var(--text-main);letter-spacing:0.02em;font-family:var(--font-brand);}
.sub{color:var(--pop-pink);font-size:11px;letter-spacing:.18em;margin:6px 0 0;font-weight:600;font-family:var(--font-brand);}

/* Account 账号信息：集成在页头右上角的小组件 */
.account-mini{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:5px;
  flex-shrink:0;
}
.account-status{font-size:10.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px;font-weight:600;}
.account-status.logged{color:var(--pop-pink);}
.account-btn{
  border:0;
  background: linear-gradient(135deg, #FF6B9B, #9D4EDD);
  color:#fff;
  border-radius:10px;padding:5px 12px;
  font-size:11px;font-weight:700;cursor:pointer;
  white-space:nowrap;
  box-shadow: 0 3px 10px rgba(255, 107, 155, 0.28);
  transition:all .2s ease;
}
.account-btn:hover{transform: scale(1.05); box-shadow: 0 5px 14px rgba(157, 78, 221, 0.35);}

/* Top Navigation Tabs 顶部分段导航 */
.nav-tabs{
  display:flex;
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  padding:6px;
  border-radius:var(--radius-lg);
  margin-bottom:22px;
  gap:6px;
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
}
.tab-btn{
  flex:1;
  border:0;
  background:transparent;
  padding:12px 0;
  font-size:14px;
  font-weight:700;
  color:var(--text-muted);
  border-radius:var(--radius-md);
  cursor:pointer;
  transition:all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
 .tab-btn.active{
  background: var(--pop-pink);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: #FFFFFF;
  box-shadow: 0 6px 18px rgba(255, 107, 155, 0.22);
  transform: scale(1.02);
}

/* Card Style 卡片全构架 */
.card{
  background: var(--card-bg);
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: 24px 16px;
  box-shadow: var(--shadow-soft);
}
.tab-content{display:none}
.tab-content.active{display:block}

/* Toolbar & Legend 日历顶部工具栏 */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.toolbar button{
  width:38px;height:38px;background:var(--glass-bg);color:var(--pop-pink);
  backdrop-filter: blur(12px);-webkit-backdrop-filter: blur(12px);
  border:1px solid var(--glass-border);border-radius:50%;font-size:18px;font-weight:bold;
  cursor:pointer;display:grid;place-items:center;
  box-shadow:0 4px 10px rgba(120, 90, 130, 0.12);
  transition:all .2s ease;
}
.toolbar button:hover{background:var(--pop-pink);color:#FFF;transform:scale(1.1);}
.month{font-weight:700;font-size:20px;color:var(--text-main);letter-spacing:0.01em;font-family:var(--font-num);font-variant-numeric: tabular-nums;}

.legend{display:flex;gap:16px;color:var(--text-muted);font-size:12px;margin-bottom:20px;justify-content:center;font-weight:600;flex-wrap:wrap;}
.legend label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;transition:opacity .2s ease;}
.legend label:has(input:not(:checked)){opacity:.45;}
.legend input[type="checkbox"]{
  appearance:none;-webkit-appearance:none;
  width:14px;height:14px;
  border:2px solid #E8DEF8;
  border-radius:5px;
  margin:0;
  cursor:pointer;
  position:relative;
  background:#FFFFFF;
  transition:all .15s ease;
}
.legend .leg-period input[type="checkbox"]:checked{background:var(--pop-pink);border-color:var(--pop-pink);}
.legend .leg-ovulation input[type="checkbox"]:checked{background:var(--pop-purple);border-color:var(--pop-purple);}
.legend .leg-poop input[type="checkbox"]:checked{background:linear-gradient(135deg, #FF6B9B, #FF8811);border-color:#FF8811;}
.legend .leg-weight input[type="checkbox"]:checked{background:#54524F;border-color:#54524F;}
.legend input[type="checkbox"]:checked:after{
  content:"✓";
  position:absolute;inset:0;
  display:grid;place-items:center;
  color:#FFFFFF;font-size:10px;font-weight:800;
}

/* Calendar Grid 日历独立卡片小格子网格 */
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  position:relative;
}
/* 英文缩写表头样式 */
.dow{
  text-align:center;
  color:var(--text-muted);
  font-size:11px;
  font-weight:700;
  padding:2px 0 6px;
  letter-spacing:.08em;
  font-family: var(--font-main);
  text-transform: uppercase;
}

.day-cell{
  position:relative;
  height:58px;
  background: rgba(255, 255, 255, 0.42);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: var(--radius-sm);
  box-shadow: 0 3px 10px rgba(120, 90, 130, 0.05);
  cursor:pointer;
  user-select:none;
  transition:all .2s ease;
  overflow:hidden;
}
.day-cell:hover{
  border-color: rgba(255, 107, 155, 0.35);
  background: rgba(255, 255, 255, 0.72);
  transform: translateY(-2px);
}
.day-cell:active{transform: scale(0.96);}

/* 今天以后的日期稍微淡化显示 */
.day-cell.future-day{
  opacity: 0.55;
  background: rgba(255, 255, 255, 0.28);
  border-color: rgba(255, 255, 255, 0.5);
}
.day-cell.future-day:hover{
  transform: none;
  background: rgba(255, 255, 255, 0.28);
  border-color: rgba(255, 255, 255, 0.5);
}

.day-cell.other-month{
  opacity:0.25;
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  pointer-events: none;
}

.week-detail-row{
  grid-column: 1 / -1;
  overflow:hidden;
  animation: detailExpand .25s ease;
}
@keyframes detailExpand{
  from{ opacity:0; transform:translateY(-8px); }
  to{ opacity:1; transform:translateY(0); }
}

/* 经期/排卵期在小格子内的独立半透明遮罩与正确外边框颜色 */
.day-bg-band{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  border-radius:10px;
}
.day-bg-band.period{
  background:var(--rose-bg);
}
.day-bg-band.ovulation{
  background:var(--purple-bg);
}
/* 预测中的姨妈/排卵期不再画边框，仅用更淡的底色区分 */
.day-bg-band.pred.period{background:rgba(255, 107, 155, 0.16)}
.day-bg-band.pred.ovulation{background:rgba(157, 78, 221, 0.1)}

/* 左上角日期数字样式（突出品质感） */
.num-wrap{
  position:absolute;
  top:4px;
  left:4px;
  z-index:2;
  width:22px;
  height:22px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:700;
  font-family: var(--font-main);
  color:var(--text-main);
  transition: all 0.2s ease;
}
.day-cell.selected{
  border-color: var(--pop-pink) !important;
  box-shadow: 0 4px 14px rgba(255, 107, 155, 0.25);
}
.day-cell.selected .num-wrap{
  background: var(--pop-pink) !important;
  color: #FFFFFF !important;
}

.day-cell.today:not(.selected) .num-wrap{
  background: var(--pop-yellow);
  color: var(--text-main);
  box-shadow:0 2px 6px rgba(255, 209, 102, 0.6);
}

/* 排便打卡标签：右上角小圆点，渐变色 */
.poop-tag{
  position:absolute;
  top:6px;
  right:6px;
  z-index:2;
  width:10px;
  height:10px;
  border-radius:50%;
  background: linear-gradient(135deg, #FF6B9B, #FF8811);
  pointer-events:none;
}

/* 右下角体重数值与箭头样式（区分字体调性） */
.weight-slot{
  position:absolute;
  bottom:5px;
  right:5px;
  z-index:2;
  display:flex;
  align-items:center;
}
.weight-tag{
  font-size:10.5px;
  color:#523B58;
  font-weight:600;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  white-space:nowrap;
  letter-spacing:-0.02em;
}
.arrow-up{color:var(--diff-up);font-size:9px;font-weight:bold;margin-left:1px;}
.arrow-down{color:var(--diff-down);font-size:9px;font-weight:bold;margin-left:1px;}
.arrow-slot{
  display:inline-block;
  width:8px;
  margin-left:1px;
  text-align:center;
  line-height:1;
}

/* 详情抽屉卡片 */
.inline-detail-card {
  margin-top: 12px;
  background: var(--glass-bg);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  box-shadow: var(--shadow-hover);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.inline-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px dashed rgba(184, 85, 122, 0.25);
  padding-bottom: 10px;
}
.inline-date { font-size: 15px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px;}
.inline-edit-btn {
  background: linear-gradient(135deg, #FFD166, #FF8811);
  border: 0; padding: 6px 14px; border-radius: 10px;
  font-size: 12px; font-weight: 700; color: #FFF; cursor: pointer;
  box-shadow: 0 3px 8px rgba(255, 136, 17, 0.3);
  transition: transform .2s;
}
.inline-edit-btn:hover { transform: scale(1.05); }

.inline-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; background: rgba(255, 255, 255, 0.5); padding: 12px; border-radius: 14px;
}
.inline-item { display: flex; flex-direction: column; gap: 2px; }
.inline-item label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
.inline-item val { font-size: 14px; font-weight: 700; color: var(--text-main); font-family: var(--font-num); font-variant-numeric: tabular-nums;}
.inline-poop-val { font-size: 13px !important; font-weight: 600 !important; color: var(--text-main) !important; line-height: 1.45; }

/* 弹窗样式表 */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(61, 43, 66, 0.4);
  backdrop-filter: blur(6px);
  display:flex; align-items:flex-end; justify-content:center;
  z-index:1000;
  opacity:0; pointer-events:none;
  transition:opacity .25s ease;
}
.modal-overlay.active{opacity:1; pointer-events:auto;}
.modal-panel{
  background:rgba(255, 255, 255, 0.78);
  backdrop-filter: blur(28px) saturate(140%);
  -webkit-backdrop-filter: blur(28px) saturate(140%);
  border: 1px solid var(--glass-border);
  border-bottom: none;
  width:100%; max-width:580px;
  border-radius:28px 28px 0 0;
  padding:26px 22px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 40px rgba(120, 90, 130, 0.18);
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(0.16, 1, 0.3, 1);
  max-height:85vh;
  overflow-y:auto;
}
.modal-overlay.active .modal-panel{transform:translateY(0);}
.modal-header{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:18px;
}
.modal-header span{font-size:18px;font-weight:700;color:var(--text-main)}
.modal-close{
  background:rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border:1px solid var(--glass-border); width:32px; height:32px; border-radius:50%;
  font-size:16px; color:var(--pop-pink); font-weight:bold; cursor:pointer; display:grid; place-items:center;
}

/* 图表顶部数据预览卡 */
.chart-top-card{
  padding:4px 2px 14px;
  margin-bottom:6px;
  min-height:60px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:6px;
  border-bottom:1px dashed rgba(140, 120, 150, 0.18);
}
.top-card-row1{display:flex;justify-content:space-between;align-items:center}
.top-card-date-wrap{display:flex;align-items:center;gap:8px}
.top-card-row2{display:flex;align-items:center;font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}

.chart-top-card .date-val{font-size:19px;font-weight:700;color:var(--text-main);font-family:var(--font-num);font-variant-numeric: tabular-nums;}
.chart-top-card .weight-val{font-size:19px;font-weight:700;color:var(--pop-pink);font-family:var(--font-num);font-variant-numeric: tabular-nums;}
.chart-top-card .weight-val.muted{font-weight:500;color:var(--text-muted);}
.chart-top-card .diff-val{font-size:13px;margin-left:4px;font-weight:700;font-family:var(--font-num);font-variant-numeric: tabular-nums;}

.tag-phase{
  display:inline-block;
  padding:4px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:700;
}
.tag-phase.period{background:var(--rose-bg);color:var(--pop-pink)}
.tag-phase.ovulation{background:var(--purple-bg);color:var(--pop-purple)}

.chart-container{width:100%;height:260px;position:relative;touch-action:none}
canvas{width:100%;height:100%;display:block}

/* 图表下方的可拖动位置提示条：默认淡出，交互时淡入 */
.chart-scrollbar-track{
  position:relative;
  height:4px;
  border-radius:2px;
  background:#FFE5EC;
  margin:10px 20px 0;
  opacity:0.25;
  transition:opacity .35s ease;
}
.chart-scrollbar-track.active{opacity:1;}
.chart-scrollbar-thumb{
  position:absolute;
  top:0;left:0;
  height:100%;
  min-width:8%;
  border-radius:2px;
  background:linear-gradient(90deg, var(--pop-pink), var(--pop-orange));
}

.zoom-hint{
  text-align:center;
  font-size:12px;
  color:var(--text-muted);
  margin-top:10px;
  margin-bottom:18px;
  font-weight:600;
}

/* 底部数据网格 */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.stat{background:var(--glass-bg);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:12px;text-align:center;}
.stat b{display:block;font-size:17px;color:var(--pop-pink);margin-top:4px;font-weight:700;font-family:var(--font-num);font-variant-numeric: tabular-nums;}
.stat span{font-size:11px;color:var(--text-muted);font-weight:600;}
.stat-editable{cursor:pointer;}

.notice{padding:2px 2px 4px;font-size:13px;line-height:1.6;color:var(--text-main);font-weight:600;}
.notice b{color:var(--pop-pink);}
.prediction-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}
.pred-item{
  padding:6px;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.pred-item .d-label{
  color:var(--text-muted);
  font-size:14px;
  font-weight:700;
  font-family:var(--font-num);
  font-variant-numeric: tabular-nums;
  display:inline-flex;
  align-items:center;
  padding:10px 16px 10px 18px;
  border-radius:999px;
  background: var(--glass-bg);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border:1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
}
.pred-item:hover .d-label,
.pred-item:active .d-label{
  background: var(--glass-bg-strong);
  transform: scale(1.05);
  box-shadow: 0 10px 26px rgba(120, 90, 130, 0.16);
}
.d-arrow{
  margin-left:5px;
  font-weight:700;
  font-size:13px;
  color:var(--pop-pink);
  opacity:0.55;
  transition: transform .18s ease;
}
.pred-item:hover .d-arrow,
.pred-item:active .d-arrow{
  transform: translateX(2px);
  opacity:0.85;
}
.pred-hint{
  display:block;
  margin-top:6px;
  font-size:11px;
  font-weight:600;
  color:var(--text-muted);
}

/* 备份控制与表单 */
.backup-box{margin-top:24px}
.backup{display:flex;gap:12px}
.backup button{
  flex:1;padding:12px;border-radius:16px;
  background:var(--glass-bg);backdrop-filter: blur(12px);-webkit-backdrop-filter: blur(12px);
  border:1px solid var(--glass-border);
  color:var(--pop-pink);font-size:13px;font-weight:700;
  cursor:pointer;box-shadow: 0 4px 12px rgba(120, 90, 130, 0.08);
  transition: all .2s;
}
.backup button:hover{background:var(--glass-bg-strong); transform:scale(1.02);}

.field-group{margin-bottom:14px}
.field-group label{display:block;color:var(--text-muted);font-size:12px;font-weight:600;margin-bottom:6px}
.field-group input,.field-group select{
  width:100%;border:1px solid var(--glass-border);border-radius:12px;padding:10px 12px;
  background:rgba(255, 255, 255, 0.5);color:var(--text-main);font-size:14px;outline:none;
  font-family: inherit; font-weight:600;
}
.field-group input:focus,.field-group select:focus{border-color:var(--pop-pink);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:18px}
.btn-primary{
  background: linear-gradient(135deg, #FF6B9B, #FF8811);
  color:#FFFFFF;border:0;padding:12px;border-radius:14px;font-weight:700;flex:1;cursor:pointer;
  box-shadow:0 4px 12px rgba(255, 107, 155, 0.3);
}
.btn-secondary{
  background:#F4F0FF;color:var(--pop-purple);border:2px solid #E8DEF8;padding:12px;border-radius:14px;font-weight:700;flex:1;cursor:pointer
}
.btn-danger{
  background:rgba(255, 255, 255, 0.5);color:var(--pop-pink);border:1px solid var(--glass-border);padding:12px;border-radius:14px;cursor:pointer;font-weight:700
}

.poop-list{margin-top:18px;border-top:1px dashed rgba(255, 107, 155, 0.2);padding-top:16px}
.poop-section-title{color:var(--text-muted);font-size:12px;font-weight:700;display:block;margin-bottom:10px;}
.poop-add-divider{border-top:1px dashed rgba(255, 107, 155, 0.2);margin:16px 0;}
.poop-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px;border-bottom:1px solid rgba(255, 255, 255, 0.5)}
.poop-item .poop-record-text{color:var(--text-main);font-weight:600;}
.del-btn{background:none;border:0;color:var(--pop-pink);font-size:12px;font-weight:700;cursor:pointer}

.footer{color:var(--text-muted);font-size:12px;text-align:center;margin-top:32px;font-weight:600;}

/* 登录/注册弹窗 */
.auth-overlay{position:fixed;inset:0;background:rgba(61, 43, 66, 0.4);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1200;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.auth-overlay.active{opacity:1;pointer-events:auto;}
.auth-panel{width:100%;max-width:380px;background:rgba(255, 255, 255, 0.78);backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);border:1px solid var(--glass-border);border-radius:28px;padding:26px 24px;box-shadow:0 20px 50px rgba(120, 90, 130, 0.18);}
.auth-title{font-size:20px;font-weight:700;margin:0 0 4px;color:var(--text-main);}
.auth-sub{font-size:12px;color:var(--text-muted);margin:0 0 18px;line-height:1.5;font-weight:600;}
.auth-field{margin-bottom:14px;}
.auth-field label{display:block;font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:6px;}
.auth-field input{width:100%;padding:10px 12px;border:1px solid var(--glass-border);border-radius:12px;outline:none;font-size:14px;background:rgba(255, 255, 255, 0.5);font-family:inherit;}
.auth-field input:focus{border-color:var(--pop-pink);background:#fff;}
.auth-actions{display:flex;gap:10px;margin-top:18px;}
.auth-actions button{flex:1;padding:12px;border:0;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;}
.auth-primary{background: linear-gradient(135deg, #FF6B9B, #9D4EDD);color:#fff;box-shadow: 0 4px 12px rgba(255, 107, 155, 0.3);}
.auth-secondary{background:#FFF0F5;color:var(--pop-pink);}
.auth-message{font-size:12px;line-height:1.5;color:var(--text-muted);margin-top:12px;min-height:16px;font-weight:600;}
.auth-message.error{color:var(--pop-pink);}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <div class="brand-left">
      <span class="brand-mark">P</span>
      <div>
        <h1>Piiisuke</h1>
        <p class="sub">BODY & CYCLE TRACKER</p>
      </div>
    </div>
    <div class="account-mini">
      <span class="account-status" id="accountStatus" title="未登录 · 数据目前保存在本机">未登录</span>
      <button class="account-btn" id="accountBtn" onclick="openAuth()">登录</button>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('calTab')">日历打卡</button>
    <button class="tab-btn" onclick="switchTab('chartTab')">体重趋势</button>
    <button class="tab-btn" onclick="switchTab('predTab')">周期预测</button>
  </div>

  <div id="calTab" class="tab-content active">
    <div class="card">
      <div class="toolbar">
        <button onclick="changeMonth(-1)">‹</button>
        <div class="month" id="monthTitle"></div>
        <button onclick="changeMonth(1)">›</button>
      </div>
      <div class="legend">
        <label class="leg-period"><input type="checkbox" checked onchange="toggleFilter('period', this.checked)">姨妈期</label>
        <label class="leg-ovulation"><input type="checkbox" checked onchange="toggleFilter('ovulation', this.checked)">排卵期</label>
        <label class="leg-poop"><input type="checkbox" checked onchange="toggleFilter('poop', this.checked)">排便</label>
        <label class="leg-weight"><input type="checkbox" checked onchange="toggleFilter('weight', this.checked)">体重</label>
      </div>
      <div class="cal-grid" id="calendar"></div>
    </div>
  </div>

  <div class="modal-overlay" id="editModalOverlay" onclick="closeEditModal()">
    <div class="modal-panel" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span id="modalDateText">2026-08-15</span>
        <button class="modal-close" onclick="closeEditModal()">✕</button>
      </div>

      <div class="inline-edit-panel active" style="border-top:0;padding-top:0;margin-top:0;">
        <div class="grid-2">
          <div class="field-group">
            <label>体重 (kg)</label>
            <select id="weightSelect"></select>
          </div>
          <div class="field-group">
            <label>姨妈状态</label>
            <select id="period">
              <option value="">无</option>
              <option value="start">姨妈第一天</option>
              <option value="on">姨妈期</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button class="btn-primary" onclick="saveDaily()">保存修改</button>
          <button class="btn-danger" onclick="clearDaily()">清空当天</button>
        </div>

        <div class="poop-list">
          <label class="poop-section-title">已记录的排便</label>
          <div id="poopContainer"></div>

          <div class="poop-add-divider"></div>
          <label class="poop-section-title">新增排便记录</label>
          <div class="grid-2">
            <div class="field-group">
              <select id="poopHour"></select>
            </div>
            <div class="field-group">
              <select id="poopSize">
                <option value="小">小</option>
                <option value="小偏中">小偏中</option>
                <option value="中">中</option>
                <option value="中偏大">中偏大</option>
                <option value="大">大</option>
              </select>
            </div>
          </div>
          <div class="field-group">
            <input id="poopNote" placeholder="备注（如：硬、拉稀、开塞露）">
          </div>
          <button class="btn-secondary" style="width:100%;padding:10px;font-size:13px;" onclick="addPoop()">添加一次排便</button>
        </div>
      </div>
    </div>
  </div>

  <div id="chartTab" class="tab-content">
    <div class="card">
      <div class="chart-top-card">
        <div class="top-card-row1">
          <div class="top-card-date-wrap">
            <span class="date-val" id="topCardDate">滑动或点击点位查看</span>
            <span id="topCardPhase"></span>
          </div>
          <div>
            <span class="weight-val" id="topCardWeight">— kg</span>
            <span class="diff-val" id="topCardDiff"></span>
          </div>
        </div>
        <div class="top-card-row2">
          <span id="topCardPoop">当日排便：—</span>
        </div>
      </div>

      <div class="chart-container" id="chartBox">
        <canvas id="chart"></canvas>
      </div>
      <div class="chart-scrollbar-track" id="chartScrollTrack">
        <div class="chart-scrollbar-thumb" id="chartScrollThumb"></div>
      </div>

      <div class="statgrid">
        <div class="stat stat-editable" onclick="setTargetWeight()"><b id="targetW">—</b><span>目标体重</span></div>
        <div class="stat"><b id="targetDiffW">—</b><span>距离目标</span></div>
        <div class="stat"><b id="change30W">—</b><span>30天变化</span></div>
      </div>
    </div>
  </div>

  <div id="predTab" class="tab-content">
    <div class="card">
      <div class="notice">
        <div id="predSummary">正在分析周期历史...</div>
        <div class="prediction-grid" id="predictionList"></div>
      </div>
    </div>
  </div>

  <div class="auth-overlay" id="authOverlay" onclick="closeAuth()">
    <div class="auth-panel" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <h2 class="auth-title" id="authTitle">登录屁屁记</h2>
          <p class="auth-sub" id="authSub">登录后我们下一步会把你的记录同步到云端。</p>
        </div>
        <button class="modal-close" onclick="closeAuth()">✕</button>

function queueCloudSync(){

async function syncSnapshotToCloud(snapshot){
  if(!cloudUserId) return;
  const rows=Object.entries(snapshot.days||{}).map(([date,d])=>({
    user_id:cloudUserId,
    record_date:date,
    weight:d?.weight==null?null:Number(d.weight),
    period:d?.period||null,
    poops:Array.isArray(d?.poops)?d.poops:[]
  }));

  if(rows.length){
    const {error}=await supabaseClient.from("body_records").upsert(rows,{onConflict:"user_id,record_date"});
    if(error) throw error;
  }

  const {data:remoteRows,error:readError}=await supabaseClient
    .from("body_records").select("record_date").eq("user_id",cloudUserId);
  if(readError) throw readError;
  const keep=new Set(rows.map(r=>r.record_date));
  const stale=(remoteRows||[]).map(r=>r.record_date).filter(d=>!keep.has(d));
  if(stale.length){
    const {error}=await supabaseClient.from("body_records")
      .delete().eq("user_id",cloudUserId).in("record_date",stale);
    if(error) throw error;
  }

  const {error:profileError}=await supabaseClient.from("profiles").upsert({
    id:cloudUserId,
    username:(snapshot.username||"") || undefined,
    target_weight:Number(snapshot.targetWeight||50)
  });
  if(profileError) console.warn("目标体重同步失败:",profileError);
}

async function loadCloudData(user){
  if(!user) return;
  cloudUserId=user.id;
  await ensureProfile(user);

  const {data:rows,error}=await supabaseClient.from("body_records")
    .select("record_date,weight,period,poops")
    .eq("user_id",user.id)
    .order("record_date");
  if(error) throw error;

  const {data:profile}=await supabaseClient.from("profiles")
    .select("target_weight").eq("id",user.id).maybeSingle();

  const localHasData=Object.keys(data.days||{}).length>0;
  const cloudHasData=(rows||[]).length>0;

  if(!cloudHasData && localHasData){
    cloudLoaded=true;
    await syncSnapshotToCloud(data);
    return;
  }

  if(cloudHasData){
    const days={};
    for(const r of rows){
      const d={poops:Array.isArray(r.poops)?r.poops:[]};
      if(r.weight!=null) d.weight=Number(r.weight);
      if(r.period) d.period=r.period;
      if(!d.poops.length) delete d.poops;
      days[r.record_date]=d;
    }
    data={
      targetWeight: profile?.target_weight==null ? 50 : Number(profile.target_weight),
      days
    };
    localStorage.setItem(KEY,JSON.stringify(data));
  }else if(profile?.target_weight!=null){
    data.targetWeight=Number(profile.target_weight);
    localStorage.setItem(KEY,JSON.stringify(data));
  }

  cloudLoaded=true;
  renderCalendar();
  drawChart();
  prediction();
}

function getAvgCycleLength(){
  const starts = Object.keys(data.days).filter(k=>data.days[k].period==="start").sort();
  if(starts.length < 2) return 28;
  let diffs = [];
  for(let i=1; i<starts.length; i++){
    diffs.push((new Date(starts[i]) - new Date(starts[i-1])) / 86400000);
  }
  return Math.round(diffs.reduce((a,b)=>a+b,0) / diffs.length);
}

function computeCyclePhases(){
  const phases = {};
  const starts = Object.keys(data.days).filter(k=>data.days[k].period==="start").sort();
  const avgCycle = getAvgCycleLength();

  if(starts.length < 2) return phases;

  starts.forEach((sKey, idx) => {
    const sDate = new Date(sKey+"T00:00:00");
    const nextSDate = starts[idx+1] ? new Date(starts[idx+1]+"T00:00:00") : new Date(sDate.getTime() + avgCycle*86400000);
    const cycleDays = Math.round((nextSDate - sDate) / 86400000);
    
    for(let i=0; i<cycleDays; i++){
      const curr = new Date(sDate);
      curr.setDate(curr.getDate() + i);
      const k = key(curr);

      let p = null;
      if(i < 5){
        p = "period";
      } else if(i >= Math.max(1, cycleDays - 16) && i <= Math.max(1, cycleDays - 14)){
        /* 最容易受孕的3天：按历史周期长度动态定位在预计排卵日前后 */
        p = "ovulation";
      }
      if(p) phases[k] = { phase: p, isPred: false };
    }
  });

  let lastStart = new Date(starts.at(-1)+"T00:00:00");
  for(let m=1; m<=12; m++){
    let pStart = new Date(lastStart);
    pStart.setDate(pStart.getDate() + avgCycle * m);
    
    for(let i=0; i<avgCycle; i++){
      const curr = new Date(pStart);
      curr.setDate(curr.getDate() + i);
      const k = key(curr);

      if(phases[k] && !phases[k].isPred) continue;

      let p = null;
      if(i < 5){
        p = "period";
      } else if(i >= Math.max(1, avgCycle - 16) && i <= Math.max(1, avgCycle - 14)){
        /* 预测排卵期：根据历史平均周期，显示最容易受孕的3天 */
        p = "ovulation";
      }
      if(p) phases[k] = { phase: p, isPred: true };
    }
  }

  return phases;
}

function computeWeightDifferences(){
  const sortedDates = Object.keys(data.days)
    .filter(k => data.days[k].weight != null)
    .sort();
  
  const diffs = {};
  for(let i=0; i<sortedDates.length; i++){
    const k = sortedDates[i];
    const currW = data.days[k].weight;
    if(i === 0){
      diffs[k] = null;
    } else {
      const prevW = data.days[sortedDates[i-1]].weight;
      const diff = currW - prevW;
      diffs[k] = Number(diff.toFixed(1));
    }
  }
  return diffs;
}

function renderCalendar(){
  const y = viewDate.getFullYear(), m = viewDate.getMonth();
  document.getElementById("monthTitle").textContent = `${y}年 ${m+1}月`;
  
  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  const todayObj = new Date();
  todayObj.setHours(0,0,0,0);
  const todayStr = key(todayObj);
  
  const phases = computeCyclePhases();
  const weightDiffs = computeWeightDifferences();

  /* 星期表头改为英文三字母缩写 */
  let html = ["SUN","MON","TUE","WED","THU","FRI","SAT"].map(x=>`<div class="dow">${x}</div>`).join("");

  let cellCount = 0;
  let weekKeys = [];

  function flushWeekIfNeeded(){
    if(cellCount % 7 === 0){
      if(selectedKey && weekKeys.includes(selectedKey)){
        html += buildDetailRowHtml(selectedKey, phases, weightDiffs);
      }
      weekKeys = [];
    }
  }

  for(let i=0; i<first.getDay(); i++){
    html += `<div class="day-cell other-month"></div>`;
    cellCount++;
    weekKeys.push(null);
    flushWeekIfNeeded();
  }

  for(let d=1; d<=last.getDate(); d++){
    const dt = new Date(y, m, d);
    dt.setHours(0,0,0,0);
    const k = key(dt);
    const dayData = data.days[k] || {};
    const phaseInfo = phases[k] || {};
    
    let phaseType = phaseInfo.phase;
    if(dayData.period === "start" || dayData.period === "on") phaseType = "period";
    if(phaseType && !calFilters[phaseType]) phaseType = null;

    const isPred = phaseInfo.isPred;
    
    let bandClasses = phaseType ? ` ${phaseType}` : '';
    if(isPred) bandClasses += " pred";

    let weightHtml = "";
    if(calFilters.weight && dayData.weight != null){
      const formattedW = fmt1(dayData.weight);
      const diffVal = weightDiffs[k];
      let arrowHtml = `<span class="arrow-slot"></span>`;
      if(diffVal != null && diffVal > 0){
        arrowHtml = `<span class="arrow-slot arrow-up">↑</span>`;
      } else if(diffVal != null && diffVal < 0){
        arrowHtml = `<span class="arrow-slot arrow-down">↓</span>`;
      }
      weightHtml = `<div class="weight-tag">${formattedW}${arrowHtml}</div>`;
    }

    /* 排便打卡标签：右上角色块，受筛选开关控制 */
    let poopHtml = "";
    if(calFilters.poop && dayData.poops && dayData.poops.length){
      poopHtml = `<div class="poop-tag"></div>`;
    }

    const isToday = k === todayStr;
    const isFuture = dt > todayObj;
    const isSelected = k === selectedKey;
    const dateDisplay = isToday ? "今" : d;

    html += `
      <div class="day-cell ${isToday?'today':''} ${isFuture?'future-day':''} ${isSelected?'selected':''}" onclick="selectDay('${k}')">
        ${phaseType ? `<div class="day-bg-band ${bandClasses}"></div>` : ''}
        <div class="num-wrap">${dateDisplay}</div>
        ${poopHtml}
        <div class="weight-slot">${weightHtml}</div>
      </div>
    `;
    cellCount++;
    weekKeys.push(k);
    flushWeekIfNeeded();
  }

  while(cellCount % 7 !== 0){
    html += `<div class="day-cell other-month"></div>`;
    cellCount++;
    weekKeys.push(null);
  }
  flushWeekIfNeeded();

  document.getElementById("calendar").innerHTML = html;
}

function buildDetailRowHtml(k, phases, weightDiffs){
  const dayData = data.days[k] || {};

  let pText = "";
  if(dayData.period === "start" || dayData.period === "on"){
    pText = "姨妈期";
  } else if(phases[k]){
    if(phases[k].phase === "period") pText = "姨妈期";
    else if(phases[k].phase === "ovulation") pText = "排卵期";
  }
  let phaseTagHtml = "";
  if(pText){
    const cls = pText === "姨妈期" ? "period" : "ovulation";
    phaseTagHtml = `<span class="tag-phase ${cls}">${pText}</span>`;
  }

  let weightVal = "未记录", diffVal = "—";
  if(dayData.weight != null){
    weightVal = fmt1(dayData.weight) + " kg";
    const diff = weightDiffs[k];
    if(diff != null){
      diffVal = diff === 0 ? "±0 kg" : (diff > 0 ? "+" : "") + fmt1(diff) + " kg";
    } else {
      diffVal = "首次记录";
    }
  }

  const poops = dayData.poops || [];
  let poopVal = "无";
  if(poops.length){
    poopVal = poops.map(p => `${p.size} (${p.hour}:00)${p.note?` [${p.note}]`:''}`).join("，");
  }

  return `
    <div class="week-detail-row">
      <div class="inline-detail-card">
        <div class="inline-head">
          <div class="inline-date">
            <span>${k}</span>
            ${phaseTagHtml}
          </div>
          <button class="inline-edit-btn" onclick="event.stopPropagation(); openEditModal()">编辑当天数据</button>
        </div>

        <div class="inline-grid">
          <div class="inline-item">
            <label>体重</label>
            <val>${weightVal}</val>
          </div>
          <div class="inline-item">
            <label>变化</label>
            <val>${diffVal}</val>
          </div>
          <div class="inline-item" style="grid-column: span 2;">
            <label>排便记录</label>
            <val class="inline-poop-val">${poopVal}</val>
          </div>
        </div>
      </div>
    </div>
  `;
}

function buildChartSeries(){
  const allKeys = Object.keys(data.days).sort();
  if(!allKeys.length) return [];

  const startD = new Date(allKeys[0]+"T00:00:00");
  const todayD = new Date(key(new Date())+"T00:00:00");
  const endD = todayD;
  
  let rawList = [];
  let curr = new Date(startD);

  const weightDiffs = computeWeightDifferences();
  const phases = computeCyclePhases();

  while(curr <= endD){
    const k = key(curr);
    const dayData = data.days[k] || {};
    
    let phaseText = "";
    if(dayData.period === "start" || dayData.period === "on"){
      phaseText = "姨妈期";
    } else if(phases[k]){
      if(phases[k].phase === "period") phaseText = "姨妈期";
      else if(phases[k].phase === "ovulation") phaseText = "排卵期";
    }

    rawList.push({
      date: k,
      weight: dayData.weight ?? null,
      diff: weightDiffs[k],
      poops: dayData.poops || [],
      phase: phaseText
    });
    curr.setDate(curr.getDate() + 1);
  }

  /* 去掉最前面还没有体重记录的日子，避免缩放时把这段空白也算进去 */
  const firstWeightIdx = rawList.findIndex(d => d.weight != null);
  if(firstWeightIdx === -1) return [];
  rawList = rawList.slice(firstWeightIdx);

  return rawList;
}

function drawMonotoneSpline(ctx, points, color) {
  if (points.length < 2) return;
  if (points.length === 2) {
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    ctx.lineTo(points[1].x, points[1].y);
    ctx.strokeStyle = color;
    ctx.lineWidth = 3.5;
    ctx.stroke();
    return;
  }

  const n = points.length;
  const dx = [];
  const dy = [];
  const m = [];

  for (let i = 0; i < n - 1; i++) {
    dx.push(points[i + 1].x - points[i].x);
    dy.push(points[i + 1].y - points[i].y);
    m.push(dy[i] / dx[i]);
  }

  const tangents = [m[0]];
  for (let i = 0; i < n - 2; i++) {
    if (m[i] * m[i + 1] <= 0) {
      tangents.push(0);
    } else {
      const common = dx[i] + dx[i + 1];
      tangents.push((3 * common) / ((common + dx[i + 1]) / m[i] + (common + dx[i]) / m[i + 1]));
    }
  }
  tangents.push(m[m.length - 1]);

  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);

  for (let i = 0; i < n - 1; i++) {
    const p0 = points[i];
    const p1 = points[i + 1];
    const t0 = tangents[i];
    const t1 = tangents[i + 1];
    const d = dx[i];

    const cp1x = p0.x + d / 3;
    const cp1y = p0.y + (t0 * d) / 3;
    const cp2x = p1.x - d / 3;
    const cp2y = p1.y - (t1 * d) / 3;

    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p1.x, p1.y);
  }

  ctx.strokeStyle = color;
  ctx.lineWidth = 3.5;
  ctx.stroke();
}

let userStep = 85;
let userZoomed = false;
const DEFAULT_VISIBLE_DAYS = 20;

function drawChart(){
  const box = document.getElementById("chartBox");
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");
  
  const dpr = window.devicePixelRatio || 1;
  const W = box.clientWidth;
  const H = box.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const series = buildChartSeries();

  const scrollTrackEl = document.getElementById("chartScrollTrack");

  if(!series.length){
    if(scrollTrackEl) scrollTrackEl.style.visibility = "hidden";
    ctx.fillStyle="#8E7A93"; ctx.font="bold 13px 'Noto Sans SC',sans-serif"; ctx.textAlign="center";
    ctx.fillText("暂无数据", W/2, H/2);
    return;
  }

  const validWeights = series.map(x=>x.weight).filter(w=>w!=null);
  if(!validWeights.length){
    if(scrollTrackEl) scrollTrackEl.style.visibility = "hidden";
    ctx.fillStyle="#8E7A93"; ctx.font="bold 13px 'Noto Sans SC',sans-serif"; ctx.textAlign="center";
    ctx.fillText("无体重数据", W/2, H/2);
    return;
  }

  const min = Math.min(...validWeights);
  const max = Math.max(...validWeights);
  const range = (max - min) || 1;

  const targetW = data.targetWeight || 50.0;
  const latestW = validWeights.at(-1);
  const targetDiff = Number((latestW - targetW).toFixed(1));

  let change30 = "—";
  if(series.length > 1){
    const latestDateObj = new Date(series.at(-1).date+"T00:00:00");
    const d30AgoObj = new Date(latestDateObj.getTime() - 30 * 86400000);
    const d30Key = key(d30AgoObj);
    
    const pastValid = series.filter(x => x.weight != null && x.date <= d30Key);
    if(pastValid.length){
      const diff30 = latestW - pastValid.at(-1).weight;
      change30 = (diff30 > 0 ? "+" : "") + fmt1(diff30) + "kg";
    }
  }

  document.getElementById("targetW").textContent = fmt1(targetW) + "kg";
  document.getElementById("targetDiffW").textContent = (targetDiff > 0 ? "+" : "") + fmt1(targetDiff) + "kg";
  document.getElementById("change30W").textContent = change30;

  const padL = 20, padR = 20, padT = 20, padB = 30;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  const scrollTrack = document.getElementById("chartScrollTrack");
  const scrollThumb = document.getElementById("chartScrollThumb");
  let scrollbarFadeTimer = null;
  function pokeScrollbar(){
    if(!scrollTrack) return;
    scrollTrack.classList.add("active");
    clearTimeout(scrollbarFadeTimer);
    scrollbarFadeTimer = setTimeout(()=> scrollTrack.classList.remove("active"), 700);
  }
  function updateScrollbar(totalW, offset, maxOffset){
    if(!scrollTrack || !scrollThumb) return;
    if(totalW <= plotW){
      scrollTrack.style.visibility = "hidden";
      return;
    }
    scrollTrack.style.visibility = "visible";
    const thumbPct = Math.max(8, Math.min(100, (plotW / totalW) * 100));
    const scrollRatio = maxOffset > 0 ? offset / maxOffset : 0;
    scrollThumb.style.width = thumbPct + "%";
    scrollThumb.style.left = (scrollRatio * (100 - thumbPct)) + "%";
  }

  if(!userZoomed){
    userStep = Math.max(15, Math.min(150, plotW / (Math.min(DEFAULT_VISIBLE_DAYS, series.length) - 1 || 1)));
  }

  const totalW = (series.length - 1) * userStep;
  const maxOffset = Math.max(0, totalW - plotW);
  let offset = maxOffset;

  let selectedIdx = series.length - 1;

  function updateTopCard(p){
    const dParts = p.date.split("-");
    const dateFormatted = dParts.length === 3 ? `${parseInt(dParts[1],10)}月${parseInt(dParts[2],10)}日` : p.date;
    document.getElementById("topCardDate").textContent = dateFormatted;
    
    const weightEl = document.getElementById("topCardWeight");
    if(p.weight != null){
      weightEl.classList.remove("muted");
      weightEl.textContent = fmt1(p.weight) + " kg";
      if(p.diff != null){
        if(p.diff === 0){
          document.getElementById("topCardDiff").textContent = "(±0)";
          document.getElementById("topCardDiff").style.color = "var(--diff-zero)";
        } else {
          const sign = p.diff > 0 ? "+" : "";
          document.getElementById("topCardDiff").textContent = `(${sign}${fmt1(p.diff)} kg)`;
          document.getElementById("topCardDiff").style.color = p.diff > 0 ? "var(--diff-up)" : "var(--diff-down)";
        }
      } else {
        document.getElementById("topCardDiff").textContent = "";
      }
    } else {
      weightEl.classList.add("muted");
      weightEl.textContent = "未记录";
      document.getElementById("topCardDiff").textContent = "";
    }

    const phaseEl = document.getElementById("topCardPhase");
    if(p.phase){
      const cls = p.phase === "姨妈期" ? "period" : "ovulation";
      phaseEl.innerHTML = `<span class="tag-phase ${cls}">${p.phase}</span>`;
    } else {
      phaseEl.innerHTML = "";
    }

    const poopEl = document.getElementById("topCardPoop");
    if(p.poops && p.poops.length){
      const pStr = p.poops.map(x => `${x.size} (${x.hour}:00)`).join("，");
      poopEl.textContent = `当日排便：${pStr}`;
    } else {
      poopEl.textContent = "当日排便：无";
    }
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    const totalW = (series.length - 1) * userStep;
    const maxOffset = Math.max(0, totalW - plotW);
    offset = Math.max(0, Math.min(offset, maxOffset));
    updateScrollbar(totalW, offset, maxOffset);

    ctx.strokeStyle="rgba(140, 120, 150, 0.16)";
    ctx.lineWidth=1.5;
    for(let i=0;i<3;i++){
      let y = padT + i * plotH / 2;
      ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    }

    let lastValidW = validWeights[0];
    const pts = series.map((e,i)=>{
      const wVal = e.weight != null ? e.weight : lastValidW;
      if(e.weight != null) lastValidW = e.weight;
      return {
        x: padL + i*userStep - offset,
        y: padT + (max - wVal)/range * plotH,
        raw: e
      };
    });

    const validPts = pts.filter(p=>p.raw.weight!=null);
    if(validPts.length > 0){
      drawMonotoneSpline(ctx, validPts, "#FF6B9B");
    }

    pts.forEach((p, idx)=>{
      if(p.x >= padL - 10 && p.x <= W - padR + 10){
        ctx.beginPath();
        if(p.raw.weight != null){
          ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
          ctx.fillStyle="#FF6B9B";
          ctx.fill();
        } else {
          ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
          ctx.strokeStyle="#BCA3C3";
          ctx.lineWidth=2;
          ctx.fillStyle="#FFFFFF";
          ctx.fill();
          ctx.stroke();
        }

        const labelInterval = Math.max(1, Math.round(60 / userStep));
        if(idx % labelInterval === 0){
          ctx.fillStyle="#8E7A93";
          ctx.font="bold 11px 'DM Sans','Noto Sans SC',sans-serif";
          ctx.textAlign="center";
          ctx.fillText(p.raw.date.slice(5), p.x, padT + plotH + 18);
        }
      }
    });

    if(selectedIdx >= 0 && pts[selectedIdx]){
      const p = pts[selectedIdx];
      if(p.x >= padL && p.x <= W - padR){
        ctx.strokeStyle="rgba(255, 107, 155, 0.4)";
        ctx.lineWidth=2;
        ctx.setLineDash([4,4]);
        ctx.beginPath();ctx.moveTo(p.x, padT);ctx.lineTo(p.x, padT+plotH);ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(p.x, p.y, 7, 0, Math.PI*2);
        ctx.fillStyle="#FFD166";
        ctx.fill();
        ctx.lineWidth=3;
        ctx.strokeStyle="#FF6B9B";
        ctx.stroke();

        updateTopCard(p.raw);
      }
    }
  }

  let activePointers = [];
  let prevPinchDist = null;
  let dragging = false, startX = 0;

  function getDistance(p1, p2) {
    return Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
  }

  canvas.onpointerdown = e => {
    canvas.setPointerCapture(e.pointerId);
    activePointers.push(e);
    pokeScrollbar();
    if(activePointers.length === 1){
      dragging = true; startX = e.clientX;
    }
  };

  canvas.onpointermove = e => {
    const idx = activePointers.findIndex(p => p.pointerId === e.pointerId);
    if(idx >= 0) activePointers[idx] = e;

    if (activePointers.length === 2) {
      dragging = false;
      const dist = getDistance(activePointers[0], activePointers[1]);
      if (prevPinchDist) {
        const factor = dist / prevPinchDist;
        userStep = Math.max(15, Math.min(150, userStep * factor));
        userZoomed = true;
        pokeScrollbar();
        render();
      }
      prevPinchDist = dist;
    } else if (dragging && activePointers.length === 1) {
      offset -= (e.clientX - startX);
      startX = e.clientX;
      pokeScrollbar();
      render();
    }
  };

  canvas.onpointerup = canvas.onpointercancel = e => {
    activePointers = activePointers.filter(p => p.pointerId !== e.pointerId);
    if(activePointers.length < 2) prevPinchDist = null;
    if(activePointers.length === 0){
      if(dragging){
        dragging = false;
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickedIdx = Math.round((clickX - padL + offset) / userStep);
        if(clickedIdx >= 0 && clickedIdx < series.length) selectedIdx = clickedIdx;
        render();
      }
    }
  };

  canvas.onwheel = e => {
    e.preventDefault();
    if (e.deltaY < 0) userStep = Math.min(150, userStep * 1.1);
    else userStep = Math.max(15, userStep * 0.9);
    userZoomed = true;
    pokeScrollbar();
    render();
  };

  render();
}

function prediction(){
  const starts = Object.keys(data.days).filter(k=>data.days[k].period==="start").sort();
  const summaryEl = document.getElementById("predSummary");
  const listEl = document.getElementById("predictionList");
  
  if(starts.length < 2){
    summaryEl.innerHTML = "标记 2 次及以上“姨妈第一天”，即可精准预测。";
    listEl.innerHTML = "";
    return;
  }

  const avg = getAvgCycleLength();
  summaryEl.innerHTML = `根据历史记录，您的平均周期为 <b>${avg} 天</b>。未来 12 个月预计日期：`;

  let lastDate = new Date(starts.at(-1)+"T00:00:00");
  let listHtml = "";

  for(let i=1; i<=12; i++){
    let nextDate = new Date(lastDate);
    nextDate.setDate(nextDate.getDate() + Math.round(avg * i));
    
    let fullD = formatSlash(nextDate);
    let dKey = key(nextDate);
    
    listHtml += `
      <div class="pred-item" onclick="jumpToDate('${dKey}')">
        <span class="d-label">${fullD}<span class="d-arrow">›</span></span>
      </div>
    `;
  }
  listEl.innerHTML = listHtml;
}

function jumpToDate(k){
  const d = new Date(k+"T00:00:00");
  viewDate = new Date(d.getFullYear(), d.getMonth(), 1);
  selectedKey = k;
  switchTab('calTab');
  renderCalendar();
  setTimeout(()=>{
    const el = document.querySelector('.day-cell.selected');
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, 60);
}

function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `piisuke_backup_${key(new Date())}.json`;
  a.click();
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if(!parsed.days) throw new Error();
      data = parsed;
      save();
      init();
      alert("导入成功！");
    } catch(err) {
      alert("导入失败：格式不正确。");
    }
  };
  reader.readAsText(file);
}
